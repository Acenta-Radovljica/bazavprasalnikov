<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acenta — Odgovor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="min-h-screen">
  <header id="nav"></header>

  <main class="flex-1 min-w-0 flex flex-col">
    <div class="e-wrap">
      <div class="e-crumb" id="crumb">Baza vprašalnikov / <a href="/admin/podjetja.html">Podjetja</a></div>
      <div id="content"></div>
    </div>
  </main>

  <script src="/admin/app.js"></script>
  <script>
    renderNav('home');

    const id = qs('id');
    if (!id) {
      document.getElementById('content').innerHTML = '<div class="bg-red-50 text-red-700 p-4 rounded">Manjka ?id= parameter</div>';
      throw new Error('no id');
    }

    const prazno = (v) => v == null || v === '' || (Array.isArray(v) && v.length === 0);

    const KLJUKICA = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';

    // Moznosti so lahko nizi (navaden vprasalnik) ali {value, label}
    // (izlusceno iz HTML obrazca, kjer se shrani value, prikaze pa label).
    function normMoznosti(opts) {
      return (Array.isArray(opts) ? opts : [])
        .map(o => (o && typeof o === 'object') ? { value: String(o.value ?? o.label ?? ''), label: String(o.label ?? o.value ?? '') }
                                                : { value: String(o), label: String(o) })
        .filter(o => o.value !== '');
    }

    // Lestvica = same stevilke v zaporedju (1-4, 1-5, 0-10). Izrise se kot
    // vrsta ploscic, ne kot seznam izbir, ker se tako bere kot ocena.
    function jeLestvica(moznosti) {
      if (moznosti.length < 3 || moznosti.length > 11) return false;
      const n = moznosti.map(o => Number(o.value));
      return n.every((x, i) => Number.isInteger(x) && (i === 0 || x === n[i - 1] + 1));
    }

    // Iz besedila vprasanja potegne razlago lestvice: "(1 = slabo, 4 = zelo dobro)".
    function razlagaLestvice(label) {
      const m = String(label || '').match(/\(\s*\d+\s*=\s*([^,)]+),\s*\d+\s*=\s*([^)]+)\)/);
      return m ? `${m[1].trim()} → ${m[2].trim()}` : '';
    }

    // En odgovor v HTML. Pri izbirnih vprasanjih pokazemo VSE moznosti in
    // oznacimo izbrane — tako se bere kot izpolnjen vprasalnik, ne kot izvoz.
    function izrisOdgovora(q, v) {
      if (prazno(v)) return '<div class="e-none">Ni odgovora</div>';
      const izbrane = (Array.isArray(v) ? v : [v]).map(x => String(x));
      const moznosti = normMoznosti(q.options);
      const vec = q.tip === 'checkbox' || q.tip === 'checkbox_multi' || Array.isArray(v);

      if (moznosti.length && !vec && jeLestvica(moznosti) && izbrane.length === 1) {
        const razlaga = razlagaLestvice(q.label);
        return '<div class="e-scale">' + moznosti.map(o =>
          `<span class="${izbrane.includes(o.value) ? 'on' : ''}">${esc(o.label)}</span>`).join('')
          + (razlaga ? `<small>${esc(razlaga)}</small>` : '') + '</div>';
      }
      if (moznosti.length) {
        const znane = new Set(moznosti.map(o => o.value));
        const dodatne = izbrane.filter(x => !znane.has(x)).map(x => ({ value: x, label: x }));
        return '<div class="e-opts">' + [...moznosti, ...dodatne].map(o => {
          const je = izbrane.includes(o.value);
          return `<span class="e-opt${je ? ' on' : ''}${vec ? ' sq' : ''}"><span class="box">${KLJUKICA}</span>${esc(o.label)}</span>`;
        }).join('') + '</div>';
      }
      if (Array.isArray(v)) {
        return '<div class="e-opts">' + v.map(x =>
          `<span class="e-opt on sq"><span class="box">${KLJUKICA}</span>${esc(String(x))}</span>`).join('') + '</div>';
      }
      if (typeof v === 'boolean' || v === 'on') {
        const da = v === true || v === 'on';
        return `<div class="e-opts"><span class="e-opt${da ? ' on' : ''} sq"><span class="box">${KLJUKICA}</span>${da ? 'Da' : 'Ne'}</span></div>`;
      }
      if (typeof v === 'object') return `<pre class="e-quote" style="font-size:12px">${esc(JSON.stringify(v, null, 2))}</pre>`;
      const t = String(v);
      if (t.length > 70 || t.includes('\n')) return `<div class="e-quote">${esc(t)}</div>`;
      return `<div class="e-short">${esc(t)}</div>`;
    }

    // Vprasalnik kot zaporedje kartic, v vrstnem redu obrazca, s sklopi.
    // Polja, ki niso v vprasanjih (gdpr_consent ...), gredo na konec.
    // Razreda q-item/q-label/q-kljuc/q-answer bereta testi (odgovori.test.mjs).
    function renderVprasalnik(raw, questions) {
      const r = raw && typeof raw === 'object' ? raw : {};
      const qList = Array.isArray(questions) ? questions : [];
      const handled = new Set([HONEYPOT]);
      const deli = [];
      let st = 0, odgovorjeno = 0, obveznihBrez = 0, zadnjiSklop = '';

      const kartica = (q, v) => {
        st++;
        const je = !prazno(v);
        if (je) odgovorjeno++;
        else if (q.obvezno) obveznihBrez++;
        return `
          <section class="e-q q-item${je ? '' : ' empty'}" data-kljuc="${esc(q.id)}">
            <div class="rank">${st}</div>
            <div style="min-width:0">
              <h3 class="q-label">${esc(q.label || q.id)}${q.obvezno ? '<span class="req">*</span>' : ''}</h3>
              <div class="key q-kljuc">${esc(q.id)}</div>
              <div class="ans q-answer">${izrisOdgovora(q, v)}</div>
            </div>
          </section>`;
      };

      for (const q of qList) {
        if (handled.has(q.id)) continue;
        handled.add(q.id);
        if (q.tip === 'section') {
          deli.push(`<div class="e-section"><i></i>${esc(q.label || '')}</div>`);
          continue;
        }
        if (q.sklop && q.sklop !== zadnjiSklop) {
          zadnjiSklop = q.sklop;
          deli.push(`<div class="e-section"><i></i>${esc(q.sklop)}</div>`);
        }
        deli.push(kartica(q, r[q.id]));
      }

      const meta = { gdpr_consent: 'Soglasje GDPR' };
      const ostala = Object.entries(r).filter(([k, v]) => !handled.has(k) && !prazno(v));
      if (ostala.length) {
        deli.push(`<div class="e-section"><i></i>${qList.length ? 'Ostala polja' : 'Odgovori'}</div>`);
        for (const [k, v] of ostala) deli.push(kartica({ id: k, label: meta[k] || k }, v));
      }

      return { html: deli.join('') || '<div class="e-panel"><div class="e-empty">Odgovor nima polj.</div></div>', st, odgovorjeno, obveznihBrez };
    }

    // Pretvori eno vrednost v navadno besedilo za CSV (arrays → "a; b", objekti → JSON).
    function valToText(v) {
      if (v == null) return '';
      if (Array.isArray(v)) return v.join('; ');
      if (typeof v === 'object') return JSON.stringify(v);
      return String(v);
    }

    // CSV celica — ovij v narekovaje in podvoji notranje narekovaje (RFC 4180).
    function csvCell(v) {
      return '"' + String(v ?? '').replace(/"/g, '""') + '"';
    }

    // Zgradi vrstice (vprašanje, odgovor) v istem vrstnem redu kot prikaz na zaslonu.
    // Prazna NEOBVEZNA polja preskočimo, ostala polja (gdpr_consent ...) dodamo na konec.
    function zberiVrstice(raw, questions) {
      const qList = Array.isArray(questions) ? questions : [];
      const handled = new Set();
      const vrstice = [];
      for (const q of qList) {
        const v = raw?.[q.id];
        const prazno = v == null || v === '' || (Array.isArray(v) && v.length === 0);
        if (prazno && !q.obvezno) { handled.add(q.id); continue; }
        vrstice.push([q.label || q.id, valToText(v)]);
        handled.add(q.id);
      }
      const meta = { gdpr_consent: 'GDPR consent' };
      for (const [k, v] of Object.entries(raw || {})) {
        if (handled.has(k)) continue;
        if (v == null || v === '') continue;
        vrstice.push([meta[k] || k, valToText(v)]);
      }
      return vrstice;
    }

    // Slug iz naziva podjetja za ime datoteke (ascii, brez presledkov).
    function vSlug(s) {
      return String(s || 'podjetje').toLowerCase()
        .replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '') || 'podjetje';
    }

    // Polje honeypota ni vprašanje, ampak past za robote. Pri pravi oddaji je
    // prazno; če ni, je to podatek o botu in ne odgovor stranke.
    const HONEYPOT = 'company_url';

    // Vprašanja za prikaz, po vrsti:
    //   1. kopija vprašanj ob oddaji (navadni obrazci),
    //   2. besedila, izluščena iz shranjenega HTML obrazca (custom_html),
    //   3. besedila iz DANAŠNJEGA HTML obrazca (stare vrstice brez kopije),
    //   4. današnja vprašanja vprašalnika.
    // Brez 2. in 3. se pri custom_html obrazcih odgovori prikažejo pod surovimi
    // ključi (`podrocje_karoserija`), ker ti obrazci nimajo polja `questions` —
    // vprašalnik je pri njih prav ta HTML.
    function vprasanjaZaPrikaz(r) {
      if (Array.isArray(r.vprasanja_za_prikaz) && r.vprasanja_za_prikaz.length) {
        return r.vprasanja_za_prikaz;
      }
      const html = r.custom_html_snapshot || r.q_custom_html;
      if (html) {
        const izHtml = vprasanjaIzObrazca(html);
        if (izHtml.length) return izHtml;
      }
      return r.q_questions || [];
    }

    // Iz HTML obrazca izlušči vprašanja v vrstnem redu, v katerem so bila na
    // zaslonu. Vrstni red je sam po sebi podatek: ključi v raw_data so v
    // poljubnem zaporedju, obrazec pa ima svojega.
    //
    // Bere se samo besedilo. DOMParser skript ne izvaja, zato je razčlenjevanje
    // shranjenega tujega HTML varno.
    function vprasanjaIzObrazca(html) {
      let doc;
      try { doc = new DOMParser().parseFromString(html, 'text/html'); }
      catch { return []; }

      const najdena = [];
      const videni = new Set();

      for (const polje of doc.querySelectorAll('input[name], textarea[name], select[name]')) {
        const ime = polje.getAttribute('name');
        if (!ime || videni.has(ime)) continue;
        const tip = (polje.getAttribute('type') || polje.tagName.toLowerCase()).toLowerCase();
        if (tip === 'hidden' || tip === 'submit' || tip === 'button') continue;
        // Skrito polje (honeypot) ni vprašanje.
        if (ime === HONEYPOT || polje.closest('[aria-hidden="true"]')) continue;
        videni.add(ime);
        // Skupina radiov/checkboxov: zberemo vse izbire, da jih stran lahko
        // pokaze kot v obrazcu (izbrana oznacena, ostale bledo).
        let options;
        const skupina = doc.querySelectorAll(`[name="${CSS.escape(ime)}"]`);
        if ((tip === 'radio' || tip === 'checkbox') && skupina.length > 1) {
          options = [...skupina].map((el) => {
            const oznaka = (el.id && doc.querySelector(`label[for="${CSS.escape(el.id)}"]`)) || el.closest('label');
            const value = el.getAttribute('value') ?? 'on';
            return { value, label: (oznaka && cistoBesedilo(oznaka)) || value };
          });
        } else if (tip === 'select') {
          options = [...polje.querySelectorAll('option')]
            .filter((o) => (o.getAttribute('value') ?? o.textContent).trim() !== '')
            .map((o) => ({ value: o.getAttribute('value') ?? o.textContent.trim(), label: o.textContent.trim() }));
        }
        najdena.push({
          id: ime, tip, options,
          label: besediloVprasanja(doc, polje, ime),
          sklop: naslovPred(doc, polje),
        });
      }

      // Ista oznaka pri dveh poljih je za bralca neuporabna: obrazec ima
      // "car.advisor" enkrat v seznamu portalov in enkrat pri dostopih.
      // Podvojene zato ločimo s sklopom, ostale pustimo kratke.
      const stevec = new Map();
      for (const q of najdena) stevec.set(q.label, (stevec.get(q.label) || 0) + 1);
      for (const q of najdena) {
        if (stevec.get(q.label) > 1 && q.sklop) q.label = `${q.sklop}: ${q.label}`;
      }

      return najdena;
    }

    // Naslov sklopa, pod katerega polje spada: zadnji naslov pred njim.
    function naslovPred(doc, polje) {
      let zadnji = '';
      for (const naslov of doc.querySelectorAll('h1, h2, h3, h4, legend')) {
        const jePred = naslov.compareDocumentPosition(polje) & Node.DOCUMENT_POSITION_FOLLOWING;
        if (!jePred) break;
        zadnji = cistoBesedilo(naslov);
      }
      return zadnji;
    }

    // Poišče besedilo vprašanja za dano polje. Zaporedje poskusov je pomembno:
    // pri skupinah (radio, checkbox) je `label for=` besedilo POSAMEZNE izbire
    // ("Imamo dostop"), ne vprašanja, zato se pri njih najprej pogleda ovoj.
    function besediloVprasanja(doc, polje, ime) {
      const jeSkupina = doc.querySelectorAll(`[name="${CSS.escape(ime)}"]`).length > 1;
      const ovoj = polje.closest('.q, .field, .form-group, fieldset');

      // Locnica je SKUPINA, ne tip polja. Kadar si ime deli vec kontrol
      // (radio "da/ne"), je oznaka ob posamezni kontroli besedilo izbire in
      // vprasanje je nad njimi. Kadar je ime svoje (samostojen checkbox
      // "Prodaja novih vozil", "Google"), pa je prav ta oznaka vprasanje —
      // polje in izbira sta takrat ista stvar.
      const kandidati = jeSkupina
        ? [
            () => ovoj?.querySelector('legend, .qlabel'),
            // Cez vec ravni: napis vrstice je pogosto SESTRA ovoja z izbirami
            // (`<div class="pname">Google Business Profile</div>` poleg `.opts`),
            // ne njegov otrok.
            () => napisVOvoju(polje),
          ]
        : [
            () => (polje.id ? doc.querySelector(`label[for="${CSS.escape(polje.id)}"]`) : null),
            () => polje.closest('label'),
            () => ovoj?.querySelector('legend, .qlabel, label'),
            () => napisVOvoju(polje),
          ];

      for (const najdi of kandidati) {
        const el = najdi();
        if (!el) continue;
        const besedilo = cistoBesedilo(el);
        if (besedilo) return besedilo;
      }

      const nadomestno = polje.getAttribute('aria-label') || polje.getAttribute('placeholder');
      return (nadomestno || '').trim() || ime;
    }

    // Besedilo elementa brez vsebine kontrol in brez drobnih pojasnil.
    // Pojasnilo je pogosto znotraj oznake (`<span class="sublabel">`); če ga
    // pustimo notri, se vprašanje razvleče čez tri vrstice.
    function cistoBesedilo(el) {
      const kopija = el.cloneNode(true);
      kopija.querySelectorAll('input, textarea, select, button').forEach((x) => x.remove());
      kopija.querySelectorAll('.sublabel, .hint, .help, small').forEach((x) => x.remove());
      return (kopija.textContent || '').replace(/\s+/g, ' ').trim();
    }

    // Zadnja pot: nekateri obrazci vprašanja ne zapišejo v <label>, ampak v
    // navaden element ob poljih (`<div class="pname">Google Business Profile</div>`
    // nad skupino radiov). Zato se povzpnemo največ štiri ravni navzgor in na
    // vsaki poiščemo prvi element z besedilom, ki sam ne vsebuje nobene kontrole.
    function napisVOvoju(polje, maxRavni = 4) {
      let ovoj = polje.parentElement;
      for (let raven = 0; raven < maxRavni && ovoj && ovoj.tagName !== 'FORM'; raven++) {
        for (const kandidat of ovoj.children) {
          if (kandidat.querySelector?.('input, textarea, select, button')) continue;
          if (kandidat.matches?.('input, textarea, select, button')) continue;
          if (cistoBesedilo(kandidat)) return kandidat;
        }
        ovoj = ovoj.parentElement;
      }
      return null;
    }

    // Pove, od kod so vprašanja nad odgovori. Molk bi pomenil, da bralec misli,
    // da bere vprašalnik iz časa oddaje, čeprav bere današnjega.
    function opozoriloOIzvoru(r) {
      if (r.ima_snapshot) return '';
      const hudo = r.vprasalnik_urejen_po_oddaji;
      const besedilo = hudo
        ? 'Ta odgovor je bil oddan, <b>preden je bil vprašalnik nazadnje urejen</b>. ' +
          'Kopija vprašanj iz časa oddaje ne obstaja, zato so spodaj današnja vprašanja — ' +
          'nekatera se od tistih, ki jih je stranka videla, lahko razlikujejo.'
        : 'Ta odgovor je iz časa pred shranjevanjem kopije vprašalnika, zato so spodaj ' +
          'današnja vprašanja. Vprašalnik od oddaje ni bil urejen, zato se najverjetneje ujemajo.';
      return `<div class="e-note ${hudo ? 'bad' : 'warn'}">${besedilo}</div>`;
    }

    // Sestavi CSV in sproži prenos. Doda UTF-8 BOM, da Excel pravilno pokaže šumnike.
    function prenesiCsv(r) {
      const vrstice = zberiVrstice(r.raw_data, vprasanjaZaPrikaz(r));
      const lines = [
        ['Podjetje', r.naziv_prikaz || ''],
        ['Vprašalnik', r.q_naziv || ''],
        ['Datum', formatDatum(r.submitted_at)],
        ['GDPR', r.consent_gdpr ? 'da' : 'ne'],
        ['', ''],
        ['Vprašanje', 'Odgovor'],
        ...vrstice,
      ];
      const csv = lines.map(row => row.map(csvCell).join(',')).join('\r\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `odgovor-${vSlug(r.naziv_prikaz)}-${r.id}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    (async () => {
      showLoading('content');
      const data = await apiFetch(`/api/responses/${id}`);
      if (!data?.response) {
        showError('content', 'Odgovor ni najden.');
        return;
      }
      const r = data.response;
      const vprasanja = vprasanjaZaPrikaz(r);
      const oseba = izpolnjevalec(r.raw_data, vprasanja);
      const vpr = renderVprasalnik(r.raw_data, vprasanja);
      const odstotek = vpr.st ? Math.round((vpr.odgovorjeno / vpr.st) * 100) : 0;
      const podjetjeUrl = `/admin/company.html?id=${r.company_id}`;

      document.getElementById('crumb').innerHTML =
        `Baza vprašalnikov / <a href="/admin/podjetja.html">Podjetja</a> / <a href="${podjetjeUrl}">${esc(r.naziv_prikaz || '')}</a> / <strong>${esc(oseba.ime)}</strong>`;
      document.title = `Acenta — ${oseba.ime}`;

      const povzetek = r.ai_povzetek
        ? `<div class="e-reco" style="margin-top:12px">${md(r.ai_povzetek)}</div>`
        : '<div class="e-empty-on-accent">AI povzetek še ni generiran.</div>';
      const kopija = r.ima_snapshot ? 'kopija ob oddaji' : (r.vprasalnik_urejen_po_oddaji ? 'današnja (urejena)' : 'današnja');

      document.getElementById('content').innerHTML = `
        <div class="e-title">
          <div class="e-profile">
            <div class="e-logo round${oseba.imaIme ? '' : ' anon'}">${esc(oseba.zacetnice)}</div>
            <div style="min-width:0">
              <div class="e-eyebrow"><i></i>Izpolnil/-a · ${formatDatum(r.submitted_at)}</div>
              <h1 class="r-ime">${esc(oseba.ime)}</h1>
              <div class="e-links">
                <a href="${podjetjeUrl}">${esc(r.naziv_prikaz)}</a>
                <span>${esc(r.q_naziv || '')}</span>
                ${oseba.podnaslov ? `<span>${esc(oseba.podnaslov)}</span>` : ''}
              </div>
            </div>
          </div>
          <div class="e-actions">
            <button id="btn-csv" class="e-btn-soft" type="button">Prenesi CSV</button>
            ${r.custom_html_snapshot ? '<button id="btn-obrazec" class="e-btn-soft" type="button">Pokaži obrazec</button>' : ''}
            <a class="e-btn-soft" href="${podjetjeUrl}">← Podjetje</a>
          </div>
        </div>

        <div class="e-grid">
          <div class="e-feature">
            <div class="e-feature-top">
              <span class="lbl">AI povzetek odgovora</span>
              ${r.ai_processed_at ? `<span class="e-badge">${formatDatum(r.ai_processed_at)}</span>` : ''}
            </div>
            ${povzetek}
            <div class="e-progress"><span>Odgovorjeno</span><div class="track"><i style="width:${odstotek}%"></i></div><b>${vpr.odgovorjeno} / ${vpr.st}</b></div>
          </div>
          <div class="e-side">
            <div class="e-sidecard">
              <div class="label">Izpolnjenost</div>
              <div class="big">${odstotek} <span style="font-size:15px;color:var(--muted-2);letter-spacing:0">%</span></div>
              <div class="e-stack"><i style="flex:${vpr.odgovorjeno || 0};background:var(--accent)"></i><i style="flex:${Math.max(0, vpr.st - vpr.odgovorjeno)};background:var(--track)"></i></div>
              <p class="note">${vpr.odgovorjeno} od ${sklon(vpr.st, SKLONI.vprasanje)} odgovorjenih${vpr.obveznihBrez ? ` · ${vpr.obveznihBrez} obveznih brez odgovora` : ''}</p>
            </div>
            <div class="e-sidecard">
              <div class="label">Podatki oddaje</div>
              <dl class="e-kv">
                <div><dt>Soglasje GDPR</dt><dd><span class="e-chip ${r.consent_gdpr ? 'ok' : 'warn'}">${r.consent_gdpr ? 'Da' : 'Ne'}</span></dd></div>
                <div><dt>Vprašanja</dt><dd>${kopija}</dd></div>
                <div><dt>Podjetje</dt><dd><a href="${podjetjeUrl}">${esc(r.naziv_prikaz)} →</a></dd></div>
              </dl>
            </div>
          </div>
        </div>

        ${opozoriloOIzvoru(r)}

        <div class="e-section"><i></i>Vprašalnik · ${sklon(vpr.st, SKLONI.vprasanje)}</div>
        <div>${vpr.html}</div>

        ${r.custom_html_snapshot ? `
        <div id="obrazec-ovoj" class="hidden e-panel" style="margin-top:16px">
          <h2>Obrazec, kot ga je videla stranka</h2>
          <p class="desc">Shranjena kopija obrazca ob oddaji (${r.custom_html_snapshot.length.toLocaleString('sl-SI')} znakov), samo za branje.</p>
          <iframe id="obrazec" sandbox="" class="w-full" style="height:70vh;border:1px solid var(--hairline);border-radius:10px;background:#fff;margin-top:12px"></iframe>
        </div>` : ''}
      `;

      document.getElementById('btn-csv')?.addEventListener('click', () => prenesiCsv(r));

      // Kopijo obrazca prikažemo v peskovniku (sandbox="" ugasne skripte in
      // oddajo), ker je to tuj HTML, shranjen kot podatek.
      document.getElementById('btn-obrazec')?.addEventListener('click', (e) => {
        const ovoj = document.getElementById('obrazec-ovoj');
        const okvir = document.getElementById('obrazec');
        const odpiramo = ovoj.classList.contains('hidden');
        if (odpiramo && !okvir.getAttribute('srcdoc')) {
          okvir.setAttribute('srcdoc', r.custom_html_snapshot);
        }
        ovoj.classList.toggle('hidden');
        e.currentTarget.textContent = odpiramo ? 'Skrij obrazec' : 'Pokaži obrazec';
        if (odpiramo) ovoj.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    })();
  </script>
</body>
</html>
