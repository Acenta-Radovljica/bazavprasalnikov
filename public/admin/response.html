<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acenta — Odgovor</title>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    .r-ovoj { max-width: 920px; width: 100%; margin: 0 auto; padding: 20px 16px 64px; display: flex; flex-direction: column; gap: 14px; }

    /* Glava: kdo je izpolnil */
    .r-hero { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--r-lg);
      padding: 22px 24px; display: flex; gap: 18px; align-items: center; position: relative; overflow: hidden; }
    .r-hero::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
      background: linear-gradient(90deg, var(--acenta-teal), var(--acenta-teal-2)); }
    .r-avatar { width: 56px; height: 56px; border-radius: 999px; flex: none; display: flex; align-items: center; justify-content: center;
      background: var(--acenta-teal-soft); color: var(--acenta-teal); border: 1px solid var(--acenta-teal-line);
      font-weight: 700; font-size: 19px; letter-spacing: .02em; }
    .r-avatar.anon { background: var(--bg-sub); color: var(--muted); border-color: var(--hairline); }
    .r-kdo { flex: 1; min-width: 0; }
    .r-oznaka { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .r-ime { font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; color: var(--ink); margin-top: 2px; }
    .r-pod { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
    .r-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .r-chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px;
      font-size: 11.5px; font-weight: 600; background: var(--bg-sub); color: var(--ink-2); border: 1px solid var(--hairline); white-space: nowrap; }
    a.r-chip { text-decoration: none; color: var(--acenta-teal); background: var(--acenta-teal-soft); border-color: var(--acenta-teal-line); }
    a.r-chip:hover { background: #d8f5ec; }
    .r-akcije { display: flex; flex-direction: column; gap: 8px; flex: none; align-self: flex-start; }

    /* Napredek izpolnjenosti */
    .r-napredek { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--ink-2); }
    .r-napredek .track { flex: 1; height: 6px; border-radius: 999px; background: var(--bg-sub); overflow: hidden; }
    .r-napredek .fill { height: 100%; background: var(--acenta-teal); border-radius: 999px; }
    .r-napredek b { color: var(--ink); }

    /* Karta z naslovom */
    .r-karta { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--r-lg); padding: 18px 22px; }
    .r-karta-naslov { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 12px; }
    .r-karta-naslov .ai { font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 2px 7px; border-radius: 999px;
      background: var(--info-soft); color: var(--info); border: 1px solid var(--info-line); }
    .r-povzetek { color: var(--ink-2); }
    .r-povzetek > :first-child { margin-top: 0; }
    .r-povzetek > :last-child { margin-bottom: 0; }
    .r-povzetek strong { color: var(--ink); }

    /* Vprasalnik */
    .r-sklop { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--acenta-teal);
      margin: 18px 0 2px 4px; }
    .q-item { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--r-lg);
      padding: 16px 20px 18px; display: grid; grid-template-columns: 30px 1fr; column-gap: 12px; }
    .q-item.prazen { background: #fcfcfd; }
    .q-st { width: 26px; height: 26px; border-radius: 8px; background: var(--bg-sub); color: var(--ink-2);
      font-size: 11.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
    .q-item:not(.prazen) .q-st { background: var(--acenta-navy); color: #fff; }
    .q-label { font-size: 14.5px; font-weight: 600; color: var(--ink); line-height: 1.4; }
    .q-label .obv { color: var(--danger); margin-left: 2px; }
    .q-kljuc { font: 500 10.5px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted-2); margin-top: 2px; }
    .q-answer { grid-column: 2; margin-top: 10px; font-size: 14px; color: var(--ink); }
    .q-kratko { font-weight: 600; }
    .q-besedilo { white-space: pre-wrap; line-height: 1.6; color: var(--ink-2); background: var(--bg-sub);
      border-left: 3px solid var(--acenta-teal-line); border-radius: 0 var(--r-sm) var(--r-sm) 0; padding: 10px 14px; }
    .q-prazno { font-size: 13px; color: var(--muted); font-style: italic; }
    .q-opcije { display: flex; flex-wrap: wrap; gap: 6px; }
    .opt { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 5px 12px; border-radius: 999px;
      font-size: 13px; line-height: 1.3; border: 1px solid var(--hairline); color: var(--muted); background: #fff; }
    .opt.izbran { border-color: var(--acenta-teal); background: var(--acenta-teal-soft); color: var(--acenta-teal-dark); font-weight: 600; }
    .opt .dot { width: 14px; height: 14px; border-radius: 999px; border: 1.5px solid var(--hairline-2); flex: none;
      display: flex; align-items: center; justify-content: center; }
    .opt.kvadrat .dot { border-radius: 4px; }
    .opt.izbran .dot { background: var(--acenta-teal); border-color: var(--acenta-teal); }
    .opt.izbran .dot svg { display: block; }
    .opt .dot svg { display: none; }

    .r-opozorilo { border-radius: var(--r); padding: 10px 13px; font-size: 13px; }

    @media (max-width: 640px) {
      .r-hero { flex-direction: column; align-items: flex-start; padding: 20px 18px; }
      .r-akcije { flex-direction: row; flex-wrap: wrap; align-self: stretch; }
      .r-ime { font-size: 21px; }
      .q-item { grid-template-columns: 1fr; padding: 14px 16px 16px; }
      .q-st { margin-bottom: 8px; }
      .q-answer { grid-column: 1; }
    }
  </style>
</head>
<body class="min-h-screen">
  <header id="nav"></header>

  <main class="flex-1 min-w-0 flex flex-col">
    <header class="page-head">
      <a id="back" href="/admin/" class="btn-mini">← Nazaj na podjetje</a>
      <span class="sub" id="crumb"></span>
    </header>
    <div class="r-ovoj">
      <div id="content"></div>
    </div>
  </main>

  <script src="/admin/app.js"></script>
  <script>
    renderNav('home');

    const id = qs('id');
    if (!id) {
      document.getElementById('content').innerHTML = '<div class="bg-red-50 text-red-700 p-4 rounded">Manjka ?id= parameter</div>';
      throw new Error('no id');
    }

    const prazno = (v) => v == null || v === '' || (Array.isArray(v) && v.length === 0);

    const KLJUKICA = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';

    // Moznosti so lahko nizi (navaden vprasalnik) ali {value, label}
    // (izlusceno iz HTML obrazca, kjer se shrani value, prikaze pa label).
    function normMoznosti(opts) {
      return (Array.isArray(opts) ? opts : [])
        .map(o => (o && typeof o === 'object') ? { value: String(o.value ?? o.label ?? ''), label: String(o.label ?? o.value ?? '') }
                                                : { value: String(o), label: String(o) })
        .filter(o => o.value !== '');
    }

    // En odgovor v HTML. Pri izbirnih vprasanjih pokazemo VSE moznosti in
    // oznacimo izbrane — tako se bere kot izpolnjen vprasalnik, ne kot izvoz.
    function izrisOdgovora(q, v) {
      if (prazno(v)) return '<div class="q-prazno">Ni odgovora</div>';
      const izbrane = (Array.isArray(v) ? v : [v]).map(x => String(x));
      const moznosti = normMoznosti(q.options);
      const vec = q.tip === 'checkbox' || Array.isArray(v);

      if (moznosti.length) {
        const znane = new Set(moznosti.map(o => o.value));
        const dodatne = izbrane.filter(x => !znane.has(x)).map(x => ({ value: x, label: x }));
        return '<div class="q-opcije">' + [...moznosti, ...dodatne].map(o => {
          const je = izbrane.includes(o.value);
          return `<span class="opt${je ? ' izbran' : ''}${vec ? ' kvadrat' : ''}"><span class="dot">${KLJUKICA}</span>${esc(o.label)}</span>`;
        }).join('') + '</div>';
      }
      if (Array.isArray(v)) {
        return '<div class="q-opcije">' + v.map(x =>
          `<span class="opt izbran kvadrat"><span class="dot">${KLJUKICA}</span>${esc(String(x))}</span>`).join('') + '</div>';
      }
      if (typeof v === 'boolean' || v === 'on') {
        const da = v === true || v === 'on';
        return `<div class="q-opcije"><span class="opt${da ? ' izbran' : ''} kvadrat"><span class="dot">${KLJUKICA}</span>${da ? 'Da' : 'Ne'}</span></div>`;
      }
      if (typeof v === 'object') return `<pre class="q-besedilo" style="font-size:12px">${esc(JSON.stringify(v, null, 2))}</pre>`;
      const t = String(v);
      if (t.length > 70 || t.includes('\n')) return `<div class="q-besedilo">${esc(t)}</div>`;
      return `<div class="q-kratko">${esc(t)}</div>`;
    }

    // Vprasalnik kot zaporedje kartic, v vrstnem redu obrazca, s sklopi.
    // Polja, ki niso v vprasanjih (gdpr_consent ...), gredo na konec.
    function renderVprasalnik(raw, questions) {
      const r = raw && typeof raw === 'object' ? raw : {};
      const qList = Array.isArray(questions) ? questions : [];
      const handled = new Set([HONEYPOT]);
      const deli = [];
      let st = 0, odgovorjeno = 0, zadnjiSklop = '';

      const kartica = (q, v) => {
        st++;
        const je = !prazno(v);
        if (je) odgovorjeno++;
        return `
          <section class="q-item${je ? '' : ' prazen'}" data-kljuc="${esc(q.id)}">
            <div class="q-st">${st}</div>
            <div>
              <div class="q-label">${esc(q.label || q.id)}${q.obvezno ? '<span class="obv">*</span>' : ''}</div>
              <div class="q-kljuc">${esc(q.id)}</div>
            </div>
            <div class="q-answer">${izrisOdgovora(q, v)}</div>
          </section>`;
      };

      for (const q of qList) {
        if (handled.has(q.id)) continue;
        handled.add(q.id);
        if (q.sklop && q.sklop !== zadnjiSklop) {
          zadnjiSklop = q.sklop;
          deli.push(`<div class="r-sklop">${esc(q.sklop)}</div>`);
        }
        deli.push(kartica(q, r[q.id]));
      }

      const meta = { gdpr_consent: 'Soglasje GDPR' };
      const ostala = Object.entries(r).filter(([k, v]) => !handled.has(k) && !prazno(v));
      if (ostala.length) {
        deli.push(`<div class="r-sklop">${qList.length ? 'Ostala polja' : 'Odgovori'}</div>`);
        for (const [k, v] of ostala) deli.push(kartica({ id: k, label: meta[k] || k }, v));
      }

      return { html: deli.join('') || '<div class="q-prazno">Odgovor nima polj.</div>', st, odgovorjeno };
    }

    // Pretvori eno vrednost v navadno besedilo za CSV (arrays → "a; b", objekti → JSON).
    function valToText(v) {
      if (v == null) return '';
      if (Array.isArray(v)) return v.join('; ');
      if (typeof v === 'object') return JSON.stringify(v);
      return String(v);
    }

    // CSV celica — ovij v narekovaje in podvoji notranje narekovaje (RFC 4180).
    function csvCell(v) {
      return '"' + String(v ?? '').replace(/"/g, '""') + '"';
    }

    // Zgradi vrstice (vprašanje, odgovor) v istem vrstnem redu kot prikaz na zaslonu.
    // Prazna NEOBVEZNA polja preskočimo, ostala polja (gdpr_consent ...) dodamo na konec.
    function zberiVrstice(raw, questions) {
      const qList = Array.isArray(questions) ? questions : [];
      const handled = new Set();
      const vrstice = [];
      for (const q of qList) {
        const v = raw?.[q.id];
        const prazno = v == null || v === '' || (Array.isArray(v) && v.length === 0);
        if (prazno && !q.obvezno) { handled.add(q.id); continue; }
        vrstice.push([q.label || q.id, valToText(v)]);
        handled.add(q.id);
      }
      const meta = { gdpr_consent: 'GDPR consent' };
      for (const [k, v] of Object.entries(raw || {})) {
        if (handled.has(k)) continue;
        if (v == null || v === '') continue;
        vrstice.push([meta[k] || k, valToText(v)]);
      }
      return vrstice;
    }

    // Slug iz naziva podjetja za ime datoteke (ascii, brez presledkov).
    function vSlug(s) {
      return String(s || 'podjetje').toLowerCase()
        .replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '') || 'podjetje';
    }

    // Polje honeypota ni vprašanje, ampak past za robote. Pri pravi oddaji je
    // prazno; če ni, je to podatek o botu in ne odgovor stranke.
    const HONEYPOT = 'company_url';

    // Vprašanja za prikaz, po vrsti:
    //   1. kopija vprašanj ob oddaji (navadni obrazci),
    //   2. besedila, izluščena iz shranjenega HTML obrazca (custom_html),
    //   3. besedila iz DANAŠNJEGA HTML obrazca (stare vrstice brez kopije),
    //   4. današnja vprašanja vprašalnika.
    // Brez 2. in 3. se pri custom_html obrazcih odgovori prikažejo pod surovimi
    // ključi (`podrocje_karoserija`), ker ti obrazci nimajo polja `questions` —
    // vprašalnik je pri njih prav ta HTML.
    function vprasanjaZaPrikaz(r) {
      if (Array.isArray(r.vprasanja_za_prikaz) && r.vprasanja_za_prikaz.length) {
        return r.vprasanja_za_prikaz;
      }
      const html = r.custom_html_snapshot || r.q_custom_html;
      if (html) {
        const izHtml = vprasanjaIzObrazca(html);
        if (izHtml.length) return izHtml;
      }
      return r.q_questions || [];
    }

    // Iz HTML obrazca izlušči vprašanja v vrstnem redu, v katerem so bila na
    // zaslonu. Vrstni red je sam po sebi podatek: ključi v raw_data so v
    // poljubnem zaporedju, obrazec pa ima svojega.
    //
    // Bere se samo besedilo. DOMParser skript ne izvaja, zato je razčlenjevanje
    // shranjenega tujega HTML varno.
    function vprasanjaIzObrazca(html) {
      let doc;
      try { doc = new DOMParser().parseFromString(html, 'text/html'); }
      catch { return []; }

      const najdena = [];
      const videni = new Set();

      for (const polje of doc.querySelectorAll('input[name], textarea[name], select[name]')) {
        const ime = polje.getAttribute('name');
        if (!ime || videni.has(ime)) continue;
        const tip = (polje.getAttribute('type') || polje.tagName.toLowerCase()).toLowerCase();
        if (tip === 'hidden' || tip === 'submit' || tip === 'button') continue;
        // Skrito polje (honeypot) ni vprašanje.
        if (ime === HONEYPOT || polje.closest('[aria-hidden="true"]')) continue;
        videni.add(ime);
        // Skupina radiov/checkboxov: zberemo vse izbire, da jih stran lahko
        // pokaze kot v obrazcu (izbrana oznacena, ostale bledo).
        let options;
        const skupina = doc.querySelectorAll(`[name="${CSS.escape(ime)}"]`);
        if ((tip === 'radio' || tip === 'checkbox') && skupina.length > 1) {
          options = [...skupina].map((el) => {
            const oznaka = (el.id && doc.querySelector(`label[for="${CSS.escape(el.id)}"]`)) || el.closest('label');
            const value = el.getAttribute('value') ?? 'on';
            return { value, label: (oznaka && cistoBesedilo(oznaka)) || value };
          });
        } else if (tip === 'select') {
          options = [...polje.querySelectorAll('option')]
            .filter((o) => (o.getAttribute('value') ?? o.textContent).trim() !== '')
            .map((o) => ({ value: o.getAttribute('value') ?? o.textContent.trim(), label: o.textContent.trim() }));
        }
        najdena.push({
          id: ime, tip, options,
          label: besediloVprasanja(doc, polje, ime),
          sklop: naslovPred(doc, polje),
        });
      }

      // Ista oznaka pri dveh poljih je za bralca neuporabna: obrazec ima
      // "car.advisor" enkrat v seznamu portalov in enkrat pri dostopih.
      // Podvojene zato ločimo s sklopom, ostale pustimo kratke.
      const stevec = new Map();
      for (const q of najdena) stevec.set(q.label, (stevec.get(q.label) || 0) + 1);
      for (const q of najdena) {
        if (stevec.get(q.label) > 1 && q.sklop) q.label = `${q.sklop}: ${q.label}`;
      }

      return najdena;
    }

    // Naslov sklopa, pod katerega polje spada: zadnji naslov pred njim.
    function naslovPred(doc, polje) {
      let zadnji = '';
      for (const naslov of doc.querySelectorAll('h1, h2, h3, h4, legend')) {
        const jePred = naslov.compareDocumentPosition(polje) & Node.DOCUMENT_POSITION_FOLLOWING;
        if (!jePred) break;
        zadnji = cistoBesedilo(naslov);
      }
      return zadnji;
    }

    // Poišče besedilo vprašanja za dano polje. Zaporedje poskusov je pomembno:
    // pri skupinah (radio, checkbox) je `label for=` besedilo POSAMEZNE izbire
    // ("Imamo dostop"), ne vprašanja, zato se pri njih najprej pogleda ovoj.
    function besediloVprasanja(doc, polje, ime) {
      const jeSkupina = doc.querySelectorAll(`[name="${CSS.escape(ime)}"]`).length > 1;
      const ovoj = polje.closest('.q, .field, .form-group, fieldset');

      // Locnica je SKUPINA, ne tip polja. Kadar si ime deli vec kontrol
      // (radio "da/ne"), je oznaka ob posamezni kontroli besedilo izbire in
      // vprasanje je nad njimi. Kadar je ime svoje (samostojen checkbox
      // "Prodaja novih vozil", "Google"), pa je prav ta oznaka vprasanje —
      // polje in izbira sta takrat ista stvar.
      const kandidati = jeSkupina
        ? [
            () => ovoj?.querySelector('legend, .qlabel'),
            // Cez vec ravni: napis vrstice je pogosto SESTRA ovoja z izbirami
            // (`<div class="pname">Google Business Profile</div>` poleg `.opts`),
            // ne njegov otrok.
            () => napisVOvoju(polje),
          ]
        : [
            () => (polje.id ? doc.querySelector(`label[for="${CSS.escape(polje.id)}"]`) : null),
            () => polje.closest('label'),
            () => ovoj?.querySelector('legend, .qlabel, label'),
            () => napisVOvoju(polje),
          ];

      for (const najdi of kandidati) {
        const el = najdi();
        if (!el) continue;
        const besedilo = cistoBesedilo(el);
        if (besedilo) return besedilo;
      }

      const nadomestno = polje.getAttribute('aria-label') || polje.getAttribute('placeholder');
      return (nadomestno || '').trim() || ime;
    }

    // Besedilo elementa brez vsebine kontrol in brez drobnih pojasnil.
    // Pojasnilo je pogosto znotraj oznake (`<span class="sublabel">`); če ga
    // pustimo notri, se vprašanje razvleče čez tri vrstice.
    function cistoBesedilo(el) {
      const kopija = el.cloneNode(true);
      kopija.querySelectorAll('input, textarea, select, button').forEach((x) => x.remove());
      kopija.querySelectorAll('.sublabel, .hint, .help, small').forEach((x) => x.remove());
      return (kopija.textContent || '').replace(/\s+/g, ' ').trim();
    }

    // Zadnja pot: nekateri obrazci vprašanja ne zapišejo v <label>, ampak v
    // navaden element ob poljih (`<div class="pname">Google Business Profile</div>`
    // nad skupino radiov). Zato se povzpnemo največ štiri ravni navzgor in na
    // vsaki poiščemo prvi element z besedilom, ki sam ne vsebuje nobene kontrole.
    function napisVOvoju(polje, maxRavni = 4) {
      let ovoj = polje.parentElement;
      for (let raven = 0; raven < maxRavni && ovoj && ovoj.tagName !== 'FORM'; raven++) {
        for (const kandidat of ovoj.children) {
          if (kandidat.querySelector?.('input, textarea, select, button')) continue;
          if (kandidat.matches?.('input, textarea, select, button')) continue;
          if (cistoBesedilo(kandidat)) return kandidat;
        }
        ovoj = ovoj.parentElement;
      }
      return null;
    }

    // Pove, od kod so vprašanja nad odgovori. Molk bi pomenil, da bralec misli,
    // da bere vprašalnik iz časa oddaje, čeprav bere današnjega.
    function opozoriloOIzvoru(r) {
      if (r.ima_snapshot) return '';
      const hudo = r.vprasalnik_urejen_po_oddaji;
      const barva = hudo
        ? 'background:#fef4f2; border:1px solid #f8c9c2; color:#b42318'
        : 'background:#fff8ea; border:1px solid #fbdba7; color:#b45309';
      const besedilo = hudo
        ? 'Ta odgovor je bil oddan, <b>preden je bil vprašalnik nazadnje urejen</b>. ' +
          'Kopija vprašanj iz časa oddaje ne obstaja, zato so spodaj današnja vprašanja — ' +
          'nekatera se od tistih, ki jih je stranka videla, lahko razlikujejo.'
        : 'Ta odgovor je iz časa pred shranjevanjem kopije vprašalnika, zato so spodaj ' +
          'današnja vprašanja. Vprašalnik od oddaje ni bil urejen, zato se najverjetneje ujemajo.';
      return `<div style="${barva}; border-radius:10px; padding:10px 13px; font-size:13px; margin-bottom:14px">
        ${besedilo}
      </div>`;
    }

    // Sestavi CSV in sproži prenos. Doda UTF-8 BOM, da Excel pravilno pokaže šumnike.
    function prenesiCsv(r) {
      const vrstice = zberiVrstice(r.raw_data, vprasanjaZaPrikaz(r));
      const lines = [
        ['Podjetje', r.naziv_prikaz || ''],
        ['Vprašalnik', r.q_naziv || ''],
        ['Datum', formatDatum(r.submitted_at)],
        ['GDPR', r.consent_gdpr ? 'da' : 'ne'],
        ['', ''],
        ['Vprašanje', 'Odgovor'],
        ...vrstice,
      ];
      const csv = lines.map(row => row.map(csvCell).join(',')).join('\r\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `odgovor-${vSlug(r.naziv_prikaz)}-${r.id}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    (async () => {
      showLoading('content');
      const data = await apiFetch(`/api/responses/${id}`);
      if (!data?.response) {
        showError('content', 'Odgovor ni najden.');
        return;
      }
      const r = data.response;
      const vprasanja = vprasanjaZaPrikaz(r);
      const oseba = izpolnjevalec(r.raw_data, vprasanja);
      const vpr = renderVprasalnik(r.raw_data, vprasanja);
      const odstotek = vpr.st ? Math.round((vpr.odgovorjeno / vpr.st) * 100) : 0;

      document.getElementById('back').href = `/admin/company.html?id=${r.company_id}`;
      document.getElementById('crumb').textContent = `${r.naziv_prikaz || ''} · ${r.q_naziv || ''}`;
      document.title = `Acenta — ${oseba.ime}`;

      const povzetek = r.ai_povzetek
        ? `<div class="r-povzetek prose prose-sm max-w-none">${md(r.ai_povzetek)}</div>`
        : '<div class="q-prazno">AI povzetek še ni generiran.</div>';

      document.getElementById('content').innerHTML = `
        <div class="flex flex-col gap-[14px]">
          <header class="r-hero">
            <div class="r-avatar${oseba.imaIme ? '' : ' anon'}">${esc(oseba.zacetnice)}</div>
            <div class="r-kdo">
              <div class="r-oznaka">Izpolnil/-a</div>
              <h1 class="r-ime">${esc(oseba.ime)}</h1>
              ${oseba.podnaslov ? `<div class="r-pod">${esc(oseba.podnaslov)}</div>` : ''}
              <div class="r-meta">
                <a class="r-chip" href="/admin/company.html?id=${r.company_id}">${esc(r.naziv_prikaz)}</a>
                <span class="r-chip">${esc(r.q_naziv || '')}</span>
                <span class="r-chip">${formatDatum(r.submitted_at)}</span>
                <span class="tag ${r.consent_gdpr ? 'ok' : 'warn'}" style="height:24px;display:inline-flex;align-items:center;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600">GDPR ${r.consent_gdpr ? 'da' : 'ne'}</span>
              </div>
            </div>
            <div class="r-akcije">
              <button id="btn-csv" class="btn-secondary">Prenesi CSV</button>
              ${r.custom_html_snapshot ? '<button id="btn-obrazec" class="btn-secondary">Pokaži obrazec</button>' : ''}
            </div>
          </header>

          <div class="r-karta">
            <div class="r-karta-naslov">Povzetek <span class="ai">AI</span></div>
            ${povzetek}
          </div>

          <div class="r-karta" style="padding:14px 22px">
            <div class="r-napredek">
              <span><b>${vpr.odgovorjeno}</b> od ${sklon(vpr.st, SKLONI.vprasanje)} odgovorjenih</span>
              <div class="track"><div class="fill" style="width:${odstotek}%"></div></div>
              <span>${odstotek} %</span>
            </div>
          </div>

          ${opozoriloOIzvoru(r)}

          <div class="flex flex-col gap-2">${vpr.html}</div>

          ${r.custom_html_snapshot ? `
          <div id="obrazec-ovoj" class="hidden r-karta">
            <div class="r-karta-naslov">Obrazec, kot ga je videla stranka</div>
            <div class="text-sm" style="color:var(--muted);margin-bottom:10px">
              Shranjena kopija obrazca ob oddaji (${r.custom_html_snapshot.length.toLocaleString('sl-SI')} znakov), samo za branje.
            </div>
            <iframe id="obrazec" sandbox="" class="w-full" style="height:70vh;border:1px solid var(--hairline);border-radius:var(--r);background:#fff"></iframe>
          </div>` : ''}
        </div>
      `;

      document.getElementById('btn-csv')?.addEventListener('click', () => prenesiCsv(r));

      // Kopijo obrazca prikažemo v peskovniku (sandbox="" ugasne skripte in
      // oddajo), ker je to tuj HTML, shranjen kot podatek.
      document.getElementById('btn-obrazec')?.addEventListener('click', (e) => {
        const ovoj = document.getElementById('obrazec-ovoj');
        const okvir = document.getElementById('obrazec');
        const odpiramo = ovoj.classList.contains('hidden');
        if (odpiramo && !okvir.getAttribute('srcdoc')) {
          okvir.setAttribute('srcdoc', r.custom_html_snapshot);
        }
        ovoj.classList.toggle('hidden');
        e.currentTarget.textContent = odpiramo ? 'Skrij obrazec' : 'Pokaži obrazec';
        if (odpiramo) ovoj.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    })();
  </script>
</body>
</html>
