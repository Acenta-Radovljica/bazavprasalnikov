<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanban · Acenta baza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    /* Board: all 7 funnel phases. It scrolls inside its own frame,
       the page itself never scrolls sideways. */
    .kb-namig { font-size: var(--text-sm); margin-bottom: var(--space-4); }
    .kb-board {
      display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr)); gap: var(--space-3);
      overflow-x: auto; min-width: 0; padding-bottom: var(--space-2);
    }
    .kb-col { display: flex; flex-direction: column; min-width: 0; }
    .kb-col__head { display: flex; align-items: center; gap: var(--space-2); min-height: 28px; padding: 0 var(--space-1) var(--space-2); }
    .kb-col__name { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .kb-col__head .count { margin-left: auto; }
    .kb-drop {
      flex: 1; min-height: 60vh; padding: var(--space-2);
      display: flex; flex-direction: column; gap: var(--space-2);
      background: var(--bg-subtle); border: 1px solid transparent; border-radius: var(--radius-lg);
      transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
    }
    .kb-board:has(> .loading, > .callout) { display: block; }
    .kb-drop.is-over { background: var(--accent-subtle); border-color: var(--accent-border); }
    .kb-empty { padding: var(--space-5) 0; text-align: center; font-size: var(--text-xs); color: var(--text-muted); }

    .kb-card {
      display: block; padding: 10px var(--space-3);
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md);
      cursor: grab; transition: border-color var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
    }
    .kb-card:hover { border-color: var(--border-strong); }
    .kb-card.is-dragging { opacity: 0.5; cursor: grabbing; }
    .kb-card__name { display: block; font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--text); line-height: 1.35; overflow-wrap: anywhere; }
    .kb-card__foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); margin-top: var(--space-2); min-height: 22px; }
    .kb-card__st { font-size: var(--text-xs); color: var(--text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; margin-left: auto; }

    @media (max-width: 1100px) {
      .kb-board { grid-template-columns: repeat(7, minmax(200px, 1fr)); }
    }
    @media (max-width: 760px) {
      /* Touch screens cannot drag; the board is for reading, one column per swipe */
      .kb-board { grid-template-columns: repeat(7, minmax(240px, 82%)); scroll-snap-type: x mandatory; margin: 0 calc(-1 * var(--space-4)); padding: 0 var(--space-4) var(--space-2); scroll-padding: 0 var(--space-4); }
      .kb-col { scroll-snap-align: start; }
      .kb-drop { min-height: 40vh; }
      .kb-card { cursor: pointer; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar__title">
          <h1>Kanban</h1>
          <span class="topbar__meta" id="meta">Nalagam …</span>
        </div>
        <span class="spacer"></span>
        <div class="topbar__actions">
          <a class="btn btn--secondary" href="/admin/podjetja.html">Seznam</a>
        </div>
      </header>

      <div class="page page--wide">
        <p class="muted kb-namig">
          <span class="hide-m">Povlecite kartico v drug stolpec, da spremenite status. Klik na kartico odpre podjetje.</span>
          <span class="only-m">Klik na kartico odpre podjetje. Status spremenite na <a class="link" href="/admin/podjetja.html">seznamu podjetij</a>.</span>
        </p>
        <div id="board" class="kb-board" aria-label="Podjetja po fazah lijaka"></div>
      </div>
    </main>
  </div>

  <script src="/admin/app.js"></script>
  <script>
    renderNav('home');

    let vsaPodjetja = [];

    // Funnel: the same truth as STATUSI in src/routes/api.js and the CHECK in migration 005.
    const STATUSI = ['nov', 'kvalificiran', 'kontaktiran', 'sestanek', 'ponudba', 'dobljen', 'izgubljen'];
    const STATUS_NAZIV = {
      nov: 'Nov', kvalificiran: 'Kvalificiran', kontaktiran: 'Kontaktiran', sestanek: 'Sestanek',
      ponudba: 'Ponudba', dobljen: 'Dobljen', izgubljen: 'Izgubljen',
    };
    // Phase color for the column dot: grey (new), deepening teal, amber
    // (offer), green (won), red (lost). Semantic variables only.
    const STOLPEC_BARVA = {
      nov:          'var(--text-faint)',
      kvalificiran: 'var(--accent-muted)',
      kontaktiran:  'var(--accent)',
      sestanek:     'var(--accent-pressed)',
      ponudba:      'var(--warning)',
      dobljen:      'var(--success)',
      izgubljen:    'var(--danger)',
    };

    // Lead score chip (hot red / warm amber / cold blue).
    function kvalBadge(k) {
      if (k === 'hot')  return '<span class="chip chip--hot">Hot</span>';
      if (k === 'warm') return '<span class="chip chip--warm">Warm</span>';
      if (k === 'cold') return '<span class="chip chip--cold">Cold</span>';
      return '';
    }

    // One card: a real link (keyboard, middle click) that can also be dragged.
    function kartica(p) {
      return `
        <a class="kb-card kartica" href="/admin/company.html?id=${p.id}" draggable="true" data-id="${p.id}">
          <span class="kb-card__name">${esc(p.naziv_prikaz)}</span>
          <span class="kb-card__foot">${kvalBadge(p.kvalifikacija)}<span class="kb-card__st">${p.st_odgovorov} odg.</span></span>
        </a>`;
    }

    function renderBoard() {
      const board = document.getElementById('board');
      // Group by status (old rows may have NULL → 'nov').
      const skupine = {};
      for (const s of STATUSI) skupine[s] = [];
      for (const p of vsaPodjetja) {
        const s = STATUSI.includes(p.status) ? p.status : 'nov';
        skupine[s].push(p);
      }

      board.innerHTML = STATUSI.map(s => {
        const kartice = skupine[s].map(kartica).join('') || '<p class="kb-empty">Ni podjetij</p>';
        return `
          <section class="kb-col" aria-label="${STATUS_NAZIV[s]}">
            <header class="kb-col__head">
              <span class="dot" style="background:${STOLPEC_BARVA[s]}" aria-hidden="true"></span>
              <h2 class="kb-col__name">${STATUS_NAZIV[s]}</h2>
              <span class="count">${skupine[s].length}</span>
            </header>
            <div class="kb-drop stolpec" data-status="${s}">${kartice}</div>
          </section>`;
      }).join('');

      document.getElementById('meta').textContent =
        sklon(vsaPodjetja.length, ['podjetje', 'podjetji', 'podjetja', 'podjetij']);
    }

    // ── Drag and drop ─────────────────────────────────────────────────────
    // jeVleklo stops the click that ends a drag from opening the company.
    let jeVleklo = false;
    let vlecenId = null;

    function zacniVlecenje(e, id) {
      vlecenId = id;
      jeVleklo = true;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(id));
      const kartica = e.target.closest('.kb-card');
      kartica?.classList.add('is-dragging');
      // Release the flag a little after the drag ends, so the click does not navigate.
      kartica?.addEventListener('dragend', () => {
        kartica.classList.remove('is-dragging');
        document.querySelectorAll('.kb-drop.is-over').forEach(x => x.classList.remove('is-over'));
        setTimeout(() => { jeVleklo = false; }, 50);
      }, { once: true });
    }

    async function spustiKartico(e, novStatus) {
      e.preventDefault();
      const id = vlecenId;
      vlecenId = null;
      if (!id) return;

      const p = vsaPodjetja.find(x => x.id === id);
      if (!p || p.status === novStatus) return;  // no change

      // PATCH first; the card moves only after the server confirms.
      const res = await apiFetch(`/api/companies/${id}`, {
        method: 'PATCH',
        body: JSON.stringify({ status: novStatus }),
      });
      if (!res || !res.ok) {
        alert('Napaka pri shranjevanju statusa.');
        return;
      }
      p.status = novStatus;  // update the local cache
      renderBoard();          // redraw: moves the card and updates the counts
    }

    const board = document.getElementById('board');
    board.addEventListener('dragstart', (e) => {
      const k = e.target.closest?.('.kb-card');
      if (k) zacniVlecenje(e, Number(k.dataset.id));
    });
    board.addEventListener('dragover', (e) => {
      const stolpec = e.target.closest?.('.kb-drop');
      if (!stolpec || !vlecenId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (!stolpec.classList.contains('is-over')) {
        document.querySelectorAll('.kb-drop.is-over').forEach(x => x.classList.remove('is-over'));
        stolpec.classList.add('is-over');
      }
    });
    board.addEventListener('dragleave', (e) => {
      const stolpec = e.target.closest?.('.kb-drop');
      if (stolpec && !stolpec.contains(e.relatedTarget)) stolpec.classList.remove('is-over');
    });
    board.addEventListener('drop', (e) => {
      const stolpec = e.target.closest?.('.kb-drop');
      if (!stolpec) return;
      stolpec.classList.remove('is-over');
      spustiKartico(e, stolpec.dataset.status);
    });
    board.addEventListener('click', (e) => {
      if (jeVleklo && e.target.closest('.kb-card')) e.preventDefault();
    });

    (async () => {
      showLoading('board', 'Nalagam podjetja …');
      const data = await apiFetch('/api/companies');
      if (!data) {
        document.getElementById('meta').textContent = '';
        showError('board', 'Napaka pri nalaganju podjetij. Osvežite stran.');
        return;
      }
      vsaPodjetja = data.companies ?? [];
      renderBoard();
    })();
  </script>
</body>
</html>
