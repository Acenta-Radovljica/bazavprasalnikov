<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acenta — Kanban</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <header id="nav"></header>

  <main class="flex-1 min-w-0 flex flex-col">
    <header class="page-head">
      <h1 class="display">Kanban</h1>
      <span class="sub" id="meta">—</span>
      <div class="spacer"></div>
      <a class="btn-secondary" href="/admin/podjetja.html">Seznam pogled →</a>
    </header>

    <div class="p-4">
      <p class="text-muted mb-3" style="font-size:12px">
        Povleci kartico v drug stolpec za spremembo statusa. Klik na kartico odpre podjetje.
      </p>
      <div id="board" class="kb-board"></div>
    </div>
  </main>

  <style>
    /* Vseh 7 faz lijaka na en zaslon; pod ~1200px se tabla drsi vodoravno. */
    .kb-board { display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 12px; }
    .kb-glava { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin: 0 4px 8px; font-size: 12px; font-weight: 800; color: var(--ink-2); }
    .kb-glava span { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kb-glava i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
    .kb-glava b { font-size: 10px; font-weight: 800; color: var(--muted); background: var(--row-line); border-radius: 10px; padding: 2px 7px; }
    .kb-stolpec { background: #ffffff80; border-radius: 12px; min-height: 60vh; padding: 8px; display: flex; flex-direction: column; gap: 8px; transition: background .15s; }
    .kb-stolpec:hover { background: #ffffffb3; }
    .kb-kartica { background: #fff; border-radius: 10px; padding: 11px 12px; cursor: grab; border: 1px solid transparent; transition: border-color .15s, box-shadow .15s; }
    .kb-kartica:hover { border-color: var(--accent-soft); box-shadow: var(--shadow-lift); }
    .kb-ime { font-size: 12.5px; font-weight: 800; color: var(--ink-2); margin-bottom: 8px; line-height: 1.35; overflow-wrap: anywhere; }
    .kb-st { font-size: 10px; font-weight: 700; color: var(--muted-2); white-space: nowrap; }
    .kb-prazno { text-align: center; color: var(--muted-2); font-size: 11px; font-weight: 600; padding: 22px 0; }
  </style>

  <script src="/admin/app.js"></script>
  <script>
    renderNav('home');

    let vsaPodjetja = [];

    // Lijak — ista resnica kot STATUSI v src/routes/api.js in CHECK v migraciji 005.
    const STATUSI = ['nov', 'kvalificiran', 'kontaktiran', 'sestanek', 'ponudba', 'dobljen', 'izgubljen'];

    // Barvni rob stolpca po fazi (vizualna orientacija po lijaku).
    // Barve lijaka iz palete v admin.css: od sive (nov) prek vse temnejse
    // turkizne do jantarja (ponudba); dobljen zelen, izgubljen rdec.
    const STOLPEC_BARVA = {
      nov:          'var(--sev3)',
      kvalificiran: '#6cc2b3',
      kontaktiran:  'var(--accent-hover)',
      sestanek:     'var(--accent)',
      ponudba:      '#e8b640',
      dobljen:      'var(--good, #1f9a6b)',
      izgubljen:    'var(--sev1)',
    };
    const STATUS_NAZIV = {
      nov: 'Nov', kvalificiran: 'Kvalificiran', kontaktiran: 'Kontaktiran', sestanek: 'Sestanek',
      ponudba: 'Ponudba', dobljen: 'Dobljen', izgubljen: 'Izgubljen',
    };

    // Barvna znacka za kvalifikacijo (HOT rdeca / WARM oranzna / COLD modra).
    function kvalBadge(k) {
      if (k === 'hot')  return '<span class="e-chip bad">Hot</span>';
      if (k === 'warm') return '<span class="e-chip warn">Warm</span>';
      if (k === 'cold') return '<span class="e-chip cold">Cold</span>';
      return '';
    }

    // Sestavi eno kartico. draggable + data-id za drag-and-drop.
    function kartica(p) {
      const badge = kvalBadge(p.kvalifikacija);
      return `
        <div draggable="true"
             data-id="${p.id}"
             ondragstart="zacniVlecenje(event, ${p.id})"
             onclick="if(!jeVleklo) window.location.href='/admin/company.html?id=${p.id}'"
             class="kartica kb-kartica">
          <div class="kb-ime">${esc(p.naziv_prikaz)}</div>
          <div class="flex items-center justify-between gap-2">
            ${badge || '<span></span>'}
            <span class="kb-st">${p.st_odgovorov} odg.</span>
          </div>
        </div>
      `;
    }

    function renderBoard() {
      const board = document.getElementById('board');
      // Grupiraj podjetja po statusu (status je lahko NULL pri starih vrsticah → 'nov').
      const skupine = {};
      for (const s of STATUSI) skupine[s] = [];
      for (const p of vsaPodjetja) {
        const s = STATUSI.includes(p.status) ? p.status : 'nov';
        skupine[s].push(p);
      }

      board.innerHTML = STATUSI.map(s => {
        const kartice = skupine[s].map(kartica).join('') ||
          '<div class="kb-prazno">Ni podjetij</div>';
        return `
          <div class="kb-stolpec-ovoj">
            <div class="kb-glava">
              <span><i style="background:${STOLPEC_BARVA[s]}"></i>${STATUS_NAZIV[s]}</span>
              <b>${skupine[s].length}</b>
            </div>
            <div class="stolpec kb-stolpec"
                 data-status="${s}"
                 ondragover="event.preventDefault()"
                 ondrop="spustiKartico(event, '${s}')">
              ${kartice}
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('meta').textContent = `${vsaPodjetja.length} podjetij`;
    }

    // ── Drag-and-drop ─────────────────────────────────────────────────
    // jeVleklo prepreci, da drag sprozi tudi onclick (odpre podjetje).
    let jeVleklo = false;
    let vlecenId = null;

    function zacniVlecenje(e, id) {
      vlecenId = id;
      jeVleklo = true;
      e.dataTransfer.effectAllowed = 'move';
      // Po koncu vlecenja sprosti zastavico (z malo zamika, da onclick ne sprozi navigacije).
      e.target.addEventListener('dragend', () => {
        setTimeout(() => { jeVleklo = false; }, 50);
      }, { once: true });
    }

    async function spustiKartico(e, novStatus) {
      e.preventDefault();
      const id = vlecenId;
      vlecenId = null;
      if (!id) return;

      const p = vsaPodjetja.find(x => x.id === id);
      if (!p || p.status === novStatus) return;  // ni spremembe

      const prej = p.status;
      // PATCH na backend (Faza C endpoint). Optimisticno NE premikamo dokler ni OK.
      const res = await apiFetch(`/api/companies/${id}`, {
        method: 'PATCH',
        body: JSON.stringify({ status: novStatus }),
      });
      if (!res || !res.ok) {
        alert('Napaka pri shranjevanju statusa.');
        return;
      }
      p.status = novStatus;  // posodobi lokalni cache
      renderBoard();          // ponovno izrisi (premakne kartico + posodobi stevce)
    }

    (async () => {
      const data = await apiFetch('/api/companies');
      if (!data) {
        document.getElementById('board').innerHTML =
          '<div class="bg-red-50 text-red-700 p-4 rounded">Napaka pri nalaganju podjetij.</div>';
        return;
      }
      vsaPodjetja = data.companies ?? [];
      renderBoard();
    })();
  </script>
</body>
</html>
