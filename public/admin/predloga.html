<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Urejanje predloge · Acenta baza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    /* Template editor: the list reads as a list, not a form with 50 boxes.
       Text inputs have no frame until hover or focus. Semantic variables only. */
    .tpl-wrap { max-width: 880px; }
    .crumbs h1 { font-size: inherit; font-weight: var(--weight-medium); letter-spacing: normal; line-height: inherit; min-width: 0; }
    .tpl-save { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .tpl-save:empty { display: none; }
    .tpl-save[data-s="dirty"] { color: var(--warning-text); }
    .tpl-save[data-s="ok"] { color: var(--success-text); }
    .tpl-save[data-s="dirty"]::before, .tpl-save[data-s="ok"]::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

    .tpl { overflow: hidden; }
    .tpl-in {
      flex: 1 1 auto; min-width: 0; height: 32px; padding: 0 var(--space-2);
      border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent;
      color: var(--text); font-size: var(--text-base);
      transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
    }
    .tpl-in:hover { border-color: var(--border); background: var(--bg-surface); }
    .tpl-in:focus { outline: none; border-color: var(--accent); background: var(--bg-surface); box-shadow: 0 0 0 3px var(--accent-subtle-hover); }

    /* Section header: emphasized band */
    .tpl-sec { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--bg-subtle); border-bottom: 1px solid var(--border-subtle); }
    .tpl-sec:not(:first-child) { border-top: 1px solid var(--border-subtle); }
    .tpl-sec .tpl-in { font-weight: var(--weight-semibold); }
    .tpl-sec__lbl { font-weight: var(--weight-semibold); padding: 0 var(--space-2); line-height: 32px; }
    .tpl-sec .chip { flex: none; }

    /* Question row */
    .tpl-q { display: flex; align-items: center; gap: var(--space-3); padding: 6px var(--space-3); border-bottom: 1px solid var(--border-subtle); min-width: 0; }
    .tpl-q .chip { flex: none; }
    .tpl-q .check { flex: none; font-size: var(--text-sm); white-space: nowrap; }
    .tpl-del { flex: none; color: var(--danger-text); }
    .tpl-del:hover:not(:disabled) { color: var(--danger-text); background: var(--danger-bg); }
    .tpl-add { padding: 6px var(--space-3) var(--space-2); border-bottom: 1px solid var(--border-subtle); }
    #seznam > :last-child { border-bottom: 0; }

    @media (max-width: 760px) {
      .tpl-q { flex-wrap: wrap; row-gap: var(--space-1); padding: var(--space-2) var(--space-3) var(--space-3); }
      .tpl-q .tpl-in { flex: 1 1 100%; }
      .tpl-q .chip { margin-left: var(--space-2); }
      .tpl-q .tpl-del { margin-left: auto; }
      .tpl-in { height: 40px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main">
      <header class="topbar">
        <nav class="crumbs" aria-label="Pot">
          <a href="/admin/procesi.html">Procesi</a>
          <svg class="icon icon--sm" aria-hidden="true"><use href="#i-chev-right"/></svg>
          <a href="/admin/procesi.html#knjiznica">Knjižnica</a>
          <svg class="icon icon--sm" aria-hidden="true"><use href="#i-chev-right"/></svg>
          <h1 class="ellipsis" id="naslov" aria-current="page">Urejanje predloge</h1>
        </nav>
        <span class="topbar__meta" id="stevec">—</span>
        <span class="spacer"></span>
        <div class="topbar__actions">
          <span class="tpl-save" id="stanjeShranjeno" aria-live="polite"></span>
          <button class="btn btn--primary" type="button" id="btnShrani" disabled><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span>Shrani predlogo</span></button>
        </div>
      </header>

      <div class="page">
        <div class="stack tpl-wrap">
          <div class="callout callout--warning">
            <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>
            <div><strong>Urejaš predlogo.</strong> Spremembe veljajo za vse prihodnje sestanke.
              Že začeti in izpolnjeni vprašalniki obdržijo svoja vprašanja.</div>
          </div>

          <div id="napaka" class="callout callout--danger hidden" role="alert"></div>

          <section class="panel tpl" aria-label="Vprašanja predloge">
            <div id="seznam"><div class="loading" role="status"><span class="spinner" aria-hidden="true"></span>Nalagam predlogo …</div></div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="/admin/app.js"></script>
  <script>
    renderNav('procesi');

    const PREDLOGA_ID = parseInt(qs('id'), 10);
    let predloga = null;
    let vprasanja = [];
    let spremenjeno = false;

    function el(id) { return document.getElementById(id); }

    // Prijazna imena tipov: komercialist ne rabi videti "checkbox_multi".
    const TIP_IME = {
      section: 'sklop', text: 'kratek odgovor', textarea: 'daljši odgovor',
      date: 'datum', email: 'e-naslov', radio: 'ena izbira',
      select: 'ena izbira', checkbox_multi: 'več izbir', table: 'tabela',
    };

    // Save state next to the button. stanje: dirty | ok
    function nastaviStanje(besedilo, stanje) {
      const e = el('stanjeShranjeno');
      e.dataset.s = stanje;
      e.textContent = besedilo;
    }

    function oznaciSpremenjeno() {
      spremenjeno = true;
      el('btnShrani').disabled = false;
      nastaviStanje('Neshranjene spremembe', 'dirty');
    }

    window.addEventListener('beforeunload', (e) => {
      if (spremenjeno) { e.preventDefault(); e.returnValue = ''; }
    });

    function pokaziNapako(besedilo) {
      const n = el('napaka');
      n.innerHTML = `${ikona('alert')}<div>${besedilo}</div>`;
      n.classList.remove('hidden');
    }
    function skrijNapako() { el('napaka').classList.add('hidden'); }

    // Page-level empty/error state with the way back to the library.
    function prazno(naslov, besedilo) {
      el('seznam').innerHTML = `
        <div class="empty">
          <b class="empty__title">${esc(naslov)}</b>
          <p class="empty__text">${esc(besedilo)}</p>
          <a class="btn btn--secondary" href="/admin/procesi.html#knjiznica">${ikona('arrow-left')}<span>V knjižnico</span></a>
        </div>`;
    }

    // ── Izris ───────────────────────────────────────────────────────────
    function izrisi() {
      const kosi = [];
      const dodaj = (pred) => `
        <div class="tpl-add"><button type="button" class="btn btn--ghost btn--sm" data-dodajpred="${pred}">${ikona('plus')}<span>Dodaj vprašanje v ta sklop</span></button></div>`;

      // Vprasanja pred prvim sklopom (glava obrazca) dobijo svojo skupino,
      // enako kot na sestanku ("Osnovni podatki").
      const idxPrve = vprasanja.findIndex(q => q.tip === 'section');
      if (idxPrve !== 0) {
        kosi.push('<div class="tpl-sec"><span class="tpl-sec__lbl">Osnovni podatki</span></div>');
      }

      vprasanja.forEach((q, i) => {
        if (q.tip === 'section') {
          if (i > 0) kosi.push(dodaj(i));
          kosi.push(`
            <div class="tpl-sec">
              <input class="tpl-in" type="text" value="${esc(q.label)}" data-i="${i}" data-lastnost="label" title="Ime sklopa" aria-label="Ime sklopa">
            </div>`);
          return;
        }
        kosi.push(`
          <div class="tpl-q">
            <input class="tpl-in" type="text" value="${esc(q.label)}" data-i="${i}" data-lastnost="label" title="Besedilo vprašanja" aria-label="Besedilo vprašanja">
            <span class="chip">${esc(TIP_IME[q.tip] || q.tip)}</span>
            <label class="check"><input type="checkbox" data-i="${i}" data-lastnost="obvezno"${q.obvezno ? ' checked' : ''}>obvezno</label>
            <button type="button" class="btn btn--ghost btn--sm tpl-del" data-odstrani="${i}">Odstrani</button>
          </div>`);
      });
      kosi.push(dodaj(vprasanja.length));

      el('seznam').innerHTML = kosi.join('');
      osveziStevec();
    }

    function osveziStevec() {
      const stVprasanj = vprasanja.filter(q => q.tip !== 'section').length;
      const stSklopov = vprasanja.filter(q => q.tip === 'section').length;
      el('stevec').textContent = `${sklon(stVprasanj, SKLONI.vprasanje)} · ${sklon(stSklopov, ['sklop', 'sklopa', 'sklopi', 'sklopov'])}`;
    }

    // ── Urejanje ────────────────────────────────────────────────────────
    el('seznam').addEventListener('input', (e) => {
      const t = e.target;
      const i = parseInt(t.dataset.i, 10);
      if (!Number.isInteger(i) || !vprasanja[i]) return;
      if (t.dataset.lastnost === 'label' && t.value.trim()) {
        vprasanja[i].label = t.value.trim();
        oznaciSpremenjeno();
      }
      if (t.dataset.lastnost === 'obvezno') {
        if (t.checked) vprasanja[i].obvezno = true; else delete vprasanja[i].obvezno;
        oznaciSpremenjeno();
      }
    });

    el('seznam').addEventListener('click', (e) => {
      const t = e.target.closest('[data-odstrani],[data-dodajpred]');
      if (!t) return;

      if (t.dataset.odstrani !== undefined) {
        const i = parseInt(t.dataset.odstrani, 10);
        const q = vprasanja[i];
        if (!q) return;
        if (!confirm(`Odstranim vprašanje »${q.label}« iz predloge?\n\nVelja za vse prihodnje sestanke. Že izpolnjeni vprašalniki ga obdržijo.`)) return;
        vprasanja.splice(i, 1);
        izrisi();
        oznaciSpremenjeno();
        return;
      }

      if (t.dataset.dodajpred !== undefined) {
        dodajVprasanje(parseInt(t.dataset.dodajpred, 10));
      }
    });

    // Isti tok kot na sestanku (proces-seja.html), da se komercialist uci
    // enkrat: besedilo -> tip -> (za radio) moznosti.
    function dodajVprasanje(vstaviNa) {
      const label = prompt('Besedilo novega vprašanja:');
      if (!label || !label.trim()) return;

      const tip = prompt('Tip (text, textarea, date, radio):', 'textarea');
      const veljavni = ['text', 'textarea', 'date', 'radio'];
      if (!veljavni.includes(tip)) {
        alert(`Neveljaven tip. Dovoljeni: ${veljavni.join(', ')}`);
        return;
      }

      let options;
      if (tip === 'radio') {
        const vnos = prompt('Možnosti, ločene z vejico:', 'da, delno, ne');
        options = (vnos || '').split(',').map(s => s.trim()).filter(Boolean);
        if (!options.length) { alert('Radio potrebuje vsaj eno možnost.'); return; }
      }

      // Unikaten id: brez tega bi PATCH padel na duplicate_id.
      const osnova = 'dodano_' + label.toLowerCase()
        .replace(/[čć]/g, 'c').replace(/š/g, 's').replace(/ž/g, 'z')
        .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 30);
      let id = osnova || 'dodano';
      let n = 2;
      while (vprasanja.some(q => q.id === id)) id = `${osnova}_${n++}`;

      const novo = { id, label: label.trim(), tip };
      if (options) novo.options = options;

      vprasanja.splice(vstaviNa, 0, novo);
      izrisi();
      oznaciSpremenjeno();
    }

    // ── Shranjevanje ────────────────────────────────────────────────────
    el('btnShrani').addEventListener('click', async () => {
      const gumb = el('btnShrani');
      const oznaka = gumb.querySelector('span');
      gumb.disabled = true;
      oznaka.textContent = 'Shranjujem …';
      skrijNapako();

      const res = await fetch(`/api/procesi/predloge/${PREDLOGA_ID}`, {
        method: 'PATCH', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ questions: vprasanja }),
      }).catch(() => null);
      const d = res ? await res.json().catch(() => ({})) : {};

      oznaka.textContent = 'Shrani predlogo';

      if (!d.ok) {
        gumb.disabled = false;
        pokaziNapako(`Predloge ni bilo mogoče shraniti${d.detail ? `: ${esc(d.detail)}` : ''}. Nič ni izgubljeno, poskusi znova.`);
        return;
      }
      spremenjeno = false;
      const zdaj = new Date();
      nastaviStanje(`Shranjeno ${zdaj.getHours()}.${String(zdaj.getMinutes()).padStart(2, '0')}`, 'ok');
    });

    // ── Nalaganje ───────────────────────────────────────────────────────
    async function nalozi() {
      const d = await apiFetch(`/api/procesi/predloge/${PREDLOGA_ID}`);
      if (!d?.predloga) {
        prazno('Predloge ni bilo mogoče naložiti', 'Preveri povezavo ali ID v naslovu in poskusi znova.');
        return;
      }
      predloga = d.predloga;
      vprasanja = Array.isArray(predloga.questions) ? predloga.questions : [];
      el('naslov').textContent = predloga.naziv_prikaz;
      el('naslov').title = predloga.naziv_prikaz;
      document.title = `${predloga.naziv_prikaz} · Urejanje predloge · Acenta baza`;
      izrisi();
    }

    if (!Number.isInteger(PREDLOGA_ID)) {
      prazno('Predloga ni izbrana', 'V naslovu manjka parameter ?id=. Predlogo odpri v knjižnici na strani Procesi.');
    } else {
      nalozi();
    }
  </script>
</body>
</html>
