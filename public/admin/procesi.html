<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acenta — Procesi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    /* Glava tabele: klik razvrsti. Puscica se pokaze na aktivnem stolpcu. */
    th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
    th.sortable:hover { color: var(--ink); }
    th.sortable .pusc { opacity: 0; margin-left: 4px; font-size: 9px; }
    th.sortable:hover .pusc { opacity: 0.35; }
    th.sortable.aktiven { color: var(--ink); }
    th.sortable.aktiven .pusc { opacity: 1; }

    /* Orodna vrstica filtrov: ena vrstica, ki se ovija; oznake so drobne,
       ker so filtri pripomocek in ne glavna vsebina strani. */
    .orodna { display: flex; align-items: flex-end; gap: 8px; flex-wrap: wrap; padding: 10px 12px; }
    .polje { display: block; min-width: 132px; }
    .polje > span { display: block; font-size: 10px; font-weight: 700; letter-spacing: .06em;
                    text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
    .polje .select, .polje .input { height: 30px; padding: 0 8px; font-size: 12.5px; }
    .znacke { display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
              padding: 0 12px 10px; }

    /* Znacka aktivnega filtra. */
    .cip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 2px 9px; border-radius: 999px;
      background: var(--acenta-teal-soft); color: var(--acenta-teal);
      box-shadow: inset 0 0 0 1px var(--acenta-teal-line);
      font-size: 11.5px; font-weight: 600;
    }
    .cip button { line-height: 1; opacity: 0.65; font-weight: 700; }
    .cip button:hover { opacity: 1; }

    tbody tr.vrstica { cursor: pointer; }
    td, th { text-align: left; }

    /* Fiksna postavitev z odstotki: tabela se VEDNO prilega svojemu ovoju,
       predolgo besedilo pa odreze s tropicjem (cela vrednost je v namigu).
       Brez tega je "Ocena poslovnega potenciala za AI" ovila v tri vrstice
       pri vsaki vrstici, tabela pa je bila sirsa od zaslona, tako da je bilo
       treba do stolpca Datum drseti. */
    table.seznam { table-layout: fixed; width: 100%; min-width: 900px; border-collapse: collapse; }

    /* Vrstica z naslovom skupine. Status je zato viden brez branja stolpca,
       hkrati pa ostane en sam sortljiv naslov tabele za vse skupine. */
    tr.skupina td {
      background: var(--bg-sub); height: 30px;
      font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      color: var(--ink-2); border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline);
    }
    tr.skupina .st { font-weight: 600; color: var(--muted); text-transform: none; letter-spacing: 0; margin-left: 8px; }
    tr.skupina .namig { float: right; font-weight: 500; color: var(--muted); text-transform: none; letter-spacing: 0; }
  </style>
</head>
<body>
  <div class="flex min-h-screen">
    <aside id="sidebar" class="w-52 app-sidebar p-3 flex flex-col"></aside>

    <main class="flex-1 min-w-0 flex flex-col">

      <!-- ── Glava ── -->
      <header class="page-head">
        <h1 class="display">Procesi</h1>
        <span class="sub" id="stevec">&mdash;</span>
        <div class="spacer"></div>
        <a class="btn-secondary" href="#knjiznica">Knjižnica</a>
        <button id="btnNova" class="btn-dark">+ Nov sestanek</button>
      </header>

      <div class="p-4 flex flex-col gap-4">

      <!-- ── Shranjeni pogledi ── (vsak nastavi spodnje filtre) -->
      <nav class="tabs" id="pogledi"></nav>

      <!-- ── Nov sestanek ── -->
      <section id="novaSeja" class="hidden card p-4">
        <div class="text-xs font-semibold uppercase tracking-[0.07em] text-muted mb-3">Nov sestanek</div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
          <label class="block">
            <span class="text-xs text-muted block mb-1.5 font-medium">Vprašalnik <span class="text-red-500">*</span></span>
            <select id="nsPredloga" class="select"></select>
          </label>
          <label class="block">
            <span class="text-xs text-muted block mb-1.5 font-medium">Stranka <span class="text-red-500">*</span></span>
            <input id="nsStranka" type="text" class="input" placeholder="npr. Hotel Astoria Bled">
          </label>
          <label class="block">
            <span class="text-xs text-muted block mb-1.5 font-medium">Proces</span>
            <input id="nsProces" type="text" class="input" placeholder="npr. priprava urnikov zaposlenih">
          </label>
          <label class="block">
            <span class="text-xs text-muted block mb-1.5 font-medium">Oddelek</span>
            <input id="nsOddelek" type="text" class="input" placeholder="npr. recepcija">
          </label>
          <label class="block">
            <span class="text-xs text-muted block mb-1.5 font-medium">Svetovalec Acente</span>
            <input id="nsSvetovalec" type="text" class="input">
          </label>
          <label class="block">
            <span class="text-xs text-muted block mb-1.5 font-medium">Datum sestanka</span>
            <input id="nsDatum" type="date" class="input">
          </label>
        </div>
        <div class="flex items-center gap-3 mt-4 flex-wrap">
          <button id="nsShrani" class="btn-primary">Začni izpolnjevati &rarr;</button>
          <button id="nsPreklici" class="btn-secondary">Prekliči</button>
          <span id="nsNapaka" class="text-sm" style="color:var(--danger)"></span>
        </div>
      </section>

      <!-- ── Filtri ── (ena vrstica, ki se ovija; podrobnosti v znackah spodaj) -->
      <section class="card">
        <div class="orodna">
          <label class="polje" style="min-width:190px;flex:1 1 190px">
            <span>Iskanje</span>
            <input id="fStranka" type="text" class="input" placeholder="stranka, proces, oddelek...">
          </label>
          <label class="polje">
            <span>Vprašalnik</span>
            <select id="fPredloga" class="select"><option value="">Vsi</option></select>
          </label>
          <label class="polje">
            <span>Svetovalec</span>
            <select id="fSvetovalec" class="select"><option value="">Vsi</option></select>
          </label>
          <label class="polje">
            <span>Status</span>
            <select id="fStatus" class="select">
              <option value="">Aktivni (brez arhiva)</option>
              <option value="osnutek">Osnutki</option>
              <option value="zakljucen">Zaključeni</option>
              <option value="poslan">Poslani stranki</option>
              <option value="arhiv">Arhiv</option>
              <option value="vse">Vsi, tudi arhiv</option>
            </select>
          </label>
          <label class="polje">
            <span>Obdobje</span>
            <select id="fObdobje" class="select">
              <option value="">Kadarkoli</option>
              <option value="7">Zadnjih 7 dni</option>
              <option value="30">Zadnjih 30 dni</option>
              <option value="90">Zadnjih 90 dni</option>
            </select>
          </label>
          <label class="polje">
            <span>Izpolnjenost</span>
            <select id="fNapredek" class="select">
              <option value="">Vse</option>
              <option value="prazno">Še ni začeto</option>
              <option value="delno">V teku (1&ndash;79 %)</option>
              <option value="polno">Skoraj polno (80 %+)</option>
            </select>
          </label>
          <label class="polje">
            <span>Transkript</span>
            <select id="fTranskript" class="select">
              <option value="">Vseeno</option>
              <option value="da">Shranjen</option>
              <option value="ne">Manjka</option>
            </select>
          </label>
          <label class="polje">
            <span>Poslano stranki</span>
            <select id="fPoslano" class="select">
              <option value="">Vseeno</option>
              <option value="da">Poslano</option>
              <option value="ne">Ni poslano</option>
            </select>
          </label>
        </div>

        <div id="cipi" class="znacke"></div>
      </section>

      <!-- ── Seznam sej ── (skupine po statusu, en skupen sortljiv naslov) -->
      <section class="card overflow-hidden">
        <div id="seje" class="scroll-x"></div>
      </section>

      <!-- ── Knjiznica ── -->
      <section class="card overflow-hidden" id="knjiznica">
        <div class="card-head">
          <h2>Knjižnica vprašalnikov</h2>
          <span class="count" id="stPredlog">&mdash;</span>
          <span style="margin-left:auto;font-size:11px;color:var(--muted)">
            Urejanje velja za prihodnje sestanke; že začeti obdržijo svoja vprašanja.
          </span>
        </div>
        <div id="predloge" class="scroll-x"></div>
      </section>

      </div>
    </main>
  </div>

  <script src="/admin/app.js"></script>
  <script>
    renderSidebar('procesi');

    // ── Stanje ────────────────────────────────────────────────────────────
    let vseSeje = [];         // vse seje s streznika (do 200)
    let predlogeCache = [];
    let razvrsti = { stolpec: 'updated_at', smer: 'desc' };

    // Znacke statusov uporabljajo skupne razrede iz admin.css, da so enake
    // kot na strani Danes in v podjetjih.
    const STATUS_OZNAKA = {
      osnutek:   ['Osnutek', 'tag'],
      zakljucen: ['Zaključen', 'tag ok'],
      poslan:    ['Poslan', 'tag info'],
      arhiv:     ['Arhiv', 'tag'],
    };

    // Skupine v seznamu. Vrstni red je vrstni red dela: kar je v teku, je
    // zgoraj; arhiv na dnu.
    const SKUPINE = [
      { status: 'osnutek',   naslov: 'V teku',                       namig: 'Izpolnjuje se med sestankom, autosave' },
      { status: 'zakljucen', naslov: 'Zaključeno, čaka pošiljanje',   namig: 'Pripravljeno za stranko' },
      { status: 'poslan',    naslov: 'Poslano stranki',               namig: 'Zapis je pri stranki' },
      { status: 'arhiv',     naslov: 'Arhiv',                         namig: '' },
    ];

    function statusBadge(s) {
      const [besedilo, razred] = STATUS_OZNAKA[s] || [s, 'tag'];
      return `<span class="${razred}">${esc(besedilo)}</span>`;
    }

    // Slovenska dvojina: 1 seja, 2 seji, 3-4 seje, 5+ sej.
    function steviloSej(n) {
      const zadnji = n % 100;
      if (zadnji === 1) return `${n} seja`;
      if (zadnji === 2) return `${n} seji`;
      if (zadnji === 3 || zadnji === 4) return `${n} seje`;
      return `${n} sej`;
    }

    function steviloSestankov(n) {
      const zadnji = n % 100;
      if (zadnji === 1) return `${n} sestanek`;
      if (zadnji === 2) return `${n} sestanka`;
      if (zadnji === 3 || zadnji === 4) return `${n} sestanki`;
      return `${n} sestankov`;
    }

    function napredekBar(n) {
      if (!n || !n.skupaj) return '<span class="text-muted-2">&mdash;</span>';
      const nizko = n.odstotek < 40 ? ' low' : '';
      return `
        <div class="meter">
          <span class="track"><i class="fill${nizko}" style="width:${n.odstotek}%;display:block;height:100%"></i></span>
          <span>${n.odstotek} %</span>
        </div>`;
    }

    function kljukica(jeTam, besedilo) {
      return jeTam
        ? `<span class="ok" style="color:var(--acenta-teal);font-weight:700">${esc(besedilo || '✓')}</span>`
        : '<span class="text-muted-2">&mdash;</span>';
    }

    // ── Filtri ────────────────────────────────────────────────────────────
    // Filtriramo v brskalniku, ne na strezniku: seznam je omejen na 200 vrstic,
    // vsi potrebni podatki so ze v odzivu, in filtriranje je zato takojsnje
    // brez cakanja na omrezje. Ce seznam kdaj preseze to velikost, se filtri
    // preselijo v SQL (ruta jih ze delno podpira).
    const FILTRI = [
      { id: 'fStranka',    naslov: 'Iskanje' },
      { id: 'fPredloga',   naslov: 'Vprašalnik' },
      { id: 'fSvetovalec', naslov: 'Svetovalec' },
      { id: 'fStatus',     naslov: 'Status' },
      { id: 'fObdobje',    naslov: 'Obdobje' },
      { id: 'fNapredek',   naslov: 'Izpolnjenost' },
      { id: 'fTranskript', naslov: 'Transkript' },
      { id: 'fPoslano',    naslov: 'Poslano' },
    ];

    function vrednostFiltra(id) {
      const el = document.getElementById(id);
      return el ? el.value : '';
    }

    // Berljiv opis izbrane vrednosti (za znacke aktivnih filtrov).
    function opisFiltra(id) {
      const el = document.getElementById(id);
      if (!el || !el.value) return null;
      if (el.tagName === 'SELECT') {
        const izbrana = el.options[el.selectedIndex];
        return izbrana ? izbrana.textContent.trim() : el.value;
      }
      return el.value.trim() || null;
    }

    function uporabiFiltre(seje) {
      const iskanje = vrednostFiltra('fStranka').trim().toLowerCase();
      const predloga = vrednostFiltra('fPredloga');
      const svetovalec = vrednostFiltra('fSvetovalec');
      const status = vrednostFiltra('fStatus');
      const obdobje = vrednostFiltra('fObdobje');
      const napredek = vrednostFiltra('fNapredek');
      const transkript = vrednostFiltra('fTranskript');
      const poslano = vrednostFiltra('fPoslano');

      const mejaDni = obdobje ? Date.now() - Number(obdobje) * 86400000 : null;

      return seje.filter(s => {
        if (iskanje) {
          const kup = [s.stranka_naziv, s.proces, s.oddelek, s.svetovalec, s.naziv_prikaz]
            .filter(Boolean).join(' ').toLowerCase();
          if (!kup.includes(iskanje)) return false;
        }
        if (predloga && String(s.questionnaire_id ?? '') !== predloga) return false;
        if (svetovalec && (s.svetovalec || '') !== svetovalec) return false;

        // Privzeto skrijemo arhiv; "vse" ga izrecno vklopi.
        if (!status) { if (s.status === 'arhiv') return false; }
        else if (status !== 'vse' && s.status !== status) return false;

        if (mejaDni) {
          const t = new Date(s.datum_sestanka || s.created_at).getTime();
          if (!Number.isFinite(t) || t < mejaDni) return false;
        }
        if (napredek) {
          const o = s.napredek?.odstotek ?? 0;
          if (napredek === 'prazno' && o !== 0) return false;
          if (napredek === 'delno' && (o === 0 || o >= 80)) return false;
          if (napredek === 'polno' && o < 80) return false;
        }
        if (transkript === 'da' && !s.st_transkriptov) return false;
        if (transkript === 'ne' && s.st_transkriptov) return false;
        if (poslano === 'da' && !s.st_poslanih) return false;
        if (poslano === 'ne' && s.st_poslanih) return false;
        return true;
      });
    }

    function izrisiCipe() {
      const aktivni = FILTRI
        .map(f => ({ ...f, opis: opisFiltra(f.id) }))
        .filter(f => f.opis);

      const el = document.getElementById('cipi');
      if (!aktivni.length) {
        el.innerHTML = '<span class="text-xs text-muted-2">Ni aktivnih filtrov.</span>';
        return;
      }
      el.innerHTML = aktivni.map(f => `
        <span class="cip">
          ${esc(f.naslov)}: ${esc(f.opis)}
          <button type="button" data-pocisti-filter="${f.id}" title="Odstrani filter">&times;</button>
        </span>`).join('')
        + `<button type="button" id="pocistiVse" class="text-xs text-muted hover:text-[#15151f] underline ml-1">Počisti vse</button>`;
    }

    // ── Razvrscanje ───────────────────────────────────────────────────────
    const STOLPCI = [
      { kljuc: 'stranka_naziv', naslov: 'Stranka',      sort: true  },
      { kljuc: 'proces',        naslov: 'Proces',       sort: true  },
      { kljuc: 'oddelek',       naslov: 'Oddelek',      sort: true  },
      { kljuc: 'naziv_prikaz',  naslov: 'Vprašalnik',   sort: true  },
      { kljuc: 'svetovalec',    naslov: 'Svetovalec',   sort: true  },
      { kljuc: 'napredek',      naslov: 'Izpolnjenost', sort: true  },
      { kljuc: 'status',        naslov: 'Status',       sort: true  },
      { kljuc: 'st_transkriptov', naslov: 'Transkript', sort: true  },
      { kljuc: 'st_poslanih',   naslov: 'Poslano',      sort: true  },
      { kljuc: 'datum_sestanka', naslov: 'Datum',       sort: true  },
    ];

    function kljucZaSort(s, kljuc) {
      if (kljuc === 'napredek') return s.napredek?.odstotek ?? -1;
      if (kljuc === 'datum_sestanka') return s.datum_sestanka || s.created_at || '';
      if (kljuc === 'updated_at') return s.updated_at || '';
      const v = s[kljuc];
      return v == null ? '' : v;
    }

    function razvrstiSeje(seje) {
      const { stolpec, smer } = razvrsti;
      const znak = smer === 'asc' ? 1 : -1;
      return [...seje].sort((a, b) => {
        const va = kljucZaSort(a, stolpec);
        const vb = kljucZaSort(b, stolpec);
        if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * znak;
        // Prazne vrednosti vedno na konec, ne glede na smer — prazen oddelek
        // na vrhu seznama ni koristna informacija.
        if (!va && vb) return 1;
        if (va && !vb) return -1;
        return String(va).localeCompare(String(vb), 'sl') * znak;
      });
    }

    // ── Izris tabele sej ──────────────────────────────────────────────────
    function izrisiSeje() {
      const filtrirane = uporabiFiltre(vseSeje);
      const seje = razvrstiSeje(filtrirane);

      document.getElementById('stevec').textContent =
        `${seje.length} od ${steviloSestankov(vseSeje.length)}`;
      izrisiCipe();

      if (!vseSeje.length) {
        document.getElementById('seje').innerHTML = `
          <div class="text-center py-16 px-6">
            <div class="text-[#15151f] font-medium mb-1">Še ni sestankov.</div>
            <div class="text-sm text-muted">Klikni „Nov sestanek“ zgoraj in začni izpolnjevati vprašalnik.</div>
          </div>`;
        return;
      }
      if (!seje.length) {
        document.getElementById('seje').innerHTML = `
          <div class="text-center py-16 px-6">
            <div class="text-[#15151f] font-medium mb-1">Noben sestanek ne ustreza filtrom.</div>
            <div class="text-sm text-muted">Odstrani kakšen filter zgoraj.</div>
          </div>`;
        return;
      }

      const glava = STOLPCI.map(c => {
        if (!c.sort) return `<th>${esc(c.naslov)}</th>`;
        const jeAktiven = razvrsti.stolpec === c.kljuc;
        const pusc = jeAktiven ? (razvrsti.smer === 'asc' ? '▲' : '▼') : '▼';
        return `<th class="sortable ${jeAktiven ? 'aktiven sorted' : ''}"
                    data-sort="${c.kljuc}" title="Razvrsti po: ${esc(c.naslov)}">${esc(c.naslov)}<span class="pusc">${pusc}</span></th>`;
      }).join('');

      const prazno = '<span class="text-muted-2">&mdash;</span>';

      const vrstica = (s) => `
        <tr class="vrstica" data-odpri="${s.id}">
          <td title="${esc(s.stranka_naziv)}"><b>${esc(s.stranka_naziv)}</b></td>
          <td title="${esc(s.proces || '')}">${esc(s.proces) || prazno}</td>
          <td title="${esc(s.oddelek || '')}">${esc(s.oddelek) || prazno}</td>
          <td title="${esc(s.naziv_prikaz)}">${esc(s.naziv_prikaz)}</td>
          <td title="${esc(s.svetovalec || '')}">${esc(s.svetovalec) || prazno}</td>
          <td>${napredekBar(s.napredek)}</td>
          <td>${statusBadge(s.status)}</td>
          <td>${kljukica(s.st_transkriptov)}</td>
          <td>${kljukica(s.st_poslanih, s.st_poslanih ? s.st_poslanih + '×' : '')}</td>
          <td class="nowrap">${formatDan(s.datum_sestanka || s.created_at)}</td>
        </tr>`;

      // Skupine se izpisejo samo, kadar imajo vrstice. Razvrscanje znotraj
      // skupine ostane po izbranem stolpcu — naslovi tabele so skupni.
      const vrstice = SKUPINE.map(g => {
        const vGrupi = seje.filter(s => s.status === g.status);
        if (!vGrupi.length) return '';
        const namig = g.namig ? `<span class="namig">${esc(g.namig)}</span>` : '';
        return `
          <tr class="skupina"><td colspan="${STOLPCI.length}">
            ${esc(g.naslov)}<span class="st">${steviloSej(vGrupi.length)}</span>${namig}
          </td></tr>
          ${vGrupi.map(vrstica).join('')}`;
      }).join('');

      // Sirine (v %) so IZMERJENE, ne ocenjene. Pri ovoju 1104px so naslovi
      // stolpcev potrebovali: Transkript 92px, Poslano 80px, Datum 88px —
      // dokler tega nisem izmeril, so bili odrezani na "TR..." in "PO...",
      // datum pa je tabelo raztegnil cez rob. Vsota mora ostati 100.
      //          stranka proces oddelek vpr. svet. izpol. status transk. poslano datum
      const sirine = [13,    11,    9,     10,  10,   11,    9,     9,      8,      10];
      const colgroup = `<colgroup>${sirine.map(w => `<col style="width:${w}%">`).join('')}</colgroup>`;

      document.getElementById('seje').innerHTML = `
        <table class="seznam app-table">
          ${colgroup}
          <thead><tr>${glava}</tr></thead>
          <tbody>${vrstice}</tbody>
        </table>`;
    }

    // ── Shranjeni pogledi ─────────────────────────────────────────────────
    // Vsak pogled je samo prednastavljen nabor filtrov — nobene skrite
    // logike, zato se v znackah spodaj vedno vidi, kaj pogled dejansko dela.
    const POGLEDI = [
      { kljuc: 'vsi',        naslov: 'Vsi',              filtri: {} },
      { kljuc: 'vteku',      naslov: 'V teku',           filtri: { fStatus: 'osnutek' } },
      { kljuc: 'transkript', naslov: 'Brez transkripta', filtri: { fTranskript: 'ne' } },
      { kljuc: 'poslati',    naslov: 'Za pošiljanje',    filtri: { fStatus: 'zakljucen', fPoslano: 'ne' } },
      { kljuc: 'poslani',    naslov: 'Poslani stranki',  filtri: { fStatus: 'poslan' } },
      { kljuc: 'arhiv',      naslov: 'Arhiv',            filtri: { fStatus: 'arhiv' } },
    ];
    let aktivenPogled = 'vsi';

    // Koliko sej bi pogled pokazal — stevec na zavihku. Racuna se iz ze
    // nalozenega seznama, brez dodatnega obhoda do streznika.
    function stejZaPogled(p) {
      return vseSeje.filter(s => {
        const st = p.filtri.fStatus;
        if (st) { if (s.status !== st) return false; }
        else if (s.status === 'arhiv') return false;
        if (p.filtri.fTranskript === 'ne' && s.st_transkriptov) return false;
        if (p.filtri.fPoslano === 'ne' && s.st_poslanih) return false;
        return true;
      }).length;
    }

    function izrisiPoglede() {
      document.getElementById('pogledi').innerHTML = POGLEDI.map(p => `
        <button type="button" class="tab ${p.kljuc === aktivenPogled ? 'active' : ''}" data-pogled="${p.kljuc}">
          ${esc(p.naslov)}<span class="num">${stejZaPogled(p)}</span>
        </button>`).join('');
    }

    function uporabiPogled(kljuc) {
      const p = POGLEDI.find(x => x.kljuc === kljuc);
      if (!p) return;
      aktivenPogled = kljuc;
      // Pogled prepise SAMO svoje filtre; iskanje in ostalo ostane.
      ['fStatus', 'fTranskript', 'fPoslano'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = p.filtri[id] ?? '';
      });
      izrisiPoglede();
      izrisiSeje();
    }

    // ── Knjiznica predlog ─────────────────────────────────────────────────
    function izrisiPredloge() {
      if (!predlogeCache.length) {
        document.getElementById('predloge').innerHTML =
          `<div class="text-center text-muted py-12 px-6">
             Ni procesnih vprašalnikov. Migracija 009 doda „Ocena poslovnega potenciala za AI“ &mdash;
             če je seznam prazen, migracija še ni stekla.
           </div>`;
        return;
      }
      document.getElementById('stPredlog').textContent = predlogeCache.length;
      document.getElementById('predloge').innerHTML = `
        <table class="app-table" style="min-width:720px">
          <colgroup><col style="width:38%"><col style="width:11%"><col style="width:12%"><col style="width:19%"><col style="width:20%"></colgroup>
          <thead>
            <tr>
              <th>Vprašalnik</th><th>Vprašanj</th><th>Sestankov</th><th>Zadnja sprememba</th><th></th>
            </tr>
          </thead>
          <tbody>
            ${predlogeCache.map(p => `
              <tr class="${p.aktivna ? '' : 'opacity-50'}" style="height:44px">
                <td title="${esc(p.naziv_prikaz)}">
                  <b>${esc(p.naziv_prikaz)}</b>${p.aktivna ? '' : ' <span class="text-muted">(ugasnjen)</span>'}
                  <span class="sub" style="font-family:ui-monospace,monospace">${esc(p.slug)}</span>
                </td>
                <td>${p.st_vprasanj}</td>
                <td>${p.st_sej}</td>
                <td>${formatDan(p.updated_at)}</td>
                <td style="text-align:right">
                  <a href="/admin/questionnaires.html?id=${p.id}"
                     style="color:var(--acenta-teal);font-weight:600">Uredi vprašanja &rarr;</a>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>`;
    }

    // ── Nalaganje ─────────────────────────────────────────────────────────
    async function naloziSeje() {
      showLoading('seje', 'Nalagam sestanke...');
      // Vzamemo VSE (tudi arhiv) in filtriramo v brskalniku, da preklop
      // filtra ne rabi novega obhoda do streznika.
      const d = await apiFetch('/api/procesi/seje?status=vse');
      if (!d) return showError('seje', 'Sestankov ni bilo mogoče naložiti.');

      vseSeje = d.seje;
      napolniSvetovalce();
      izrisiPoglede();
      izrisiSeje();
    }

    // Izbirnik svetovalcev sestavimo iz podatkov — sifranta zanje ni.
    function napolniSvetovalce() {
      const imena = [...new Set(vseSeje.map(s => s.svetovalec).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, 'sl'));
      const sel = document.getElementById('fSvetovalec');
      const prej = sel.value;
      sel.innerHTML = '<option value="">Vsi</option>'
        + imena.map(i => `<option value="${esc(i)}">${esc(i)}</option>`).join('');
      if (imena.includes(prej)) sel.value = prej;
    }

    async function naloziPredloge() {
      showLoading('predloge', 'Nalagam vprašalnike...');
      const d = await apiFetch('/api/procesi/predloge');
      if (!d) return showError('predloge', 'Vprašalnikov ni bilo mogoče naložiti.');

      predlogeCache = d.predloge;

      const aktivne = predlogeCache.filter(p => p.aktivna);
      document.getElementById('nsPredloga').innerHTML = aktivne.length
        ? aktivne.map(p => `<option value="${p.id}">${esc(p.naziv_prikaz)}</option>`).join('')
        : '<option value="">&mdash; ni aktivnih vprašalnikov &mdash;</option>';

      document.getElementById('fPredloga').innerHTML = '<option value="">Vsi</option>'
        + predlogeCache.map(p => `<option value="${p.id}">${esc(p.naziv_prikaz)}</option>`).join('');

      izrisiPredloge();
    }

    // ── Dogodki ───────────────────────────────────────────────────────────
    function odpri(id) { window.location.href = `/admin/proces-seja.html?id=${id}`; }

    document.getElementById('seje').addEventListener('click', (e) => {
      const th = e.target.closest('th[data-sort]');
      if (th) {
        const kljuc = th.dataset.sort;
        if (razvrsti.stolpec === kljuc) {
          razvrsti.smer = razvrsti.smer === 'asc' ? 'desc' : 'asc';
        } else {
          razvrsti = { stolpec: kljuc, smer: 'asc' };
        }
        izrisiSeje();
        return;
      }
      const tr = e.target.closest('tr[data-odpri]');
      if (tr) odpri(tr.dataset.odpri);
    });

    document.getElementById('cipi').addEventListener('click', (e) => {
      const x = e.target.closest('[data-pocisti-filter]');
      if (x) {
        const el = document.getElementById(x.dataset.pocistiFilter);
        if (el) el.value = '';
        izrisiSeje();
        return;
      }
      if (e.target.id === 'pocistiVse') {
        FILTRI.forEach(f => { const el = document.getElementById(f.id); if (el) el.value = ''; });
        izrisiSeje();
      }
    });

    document.getElementById('pogledi').addEventListener('click', (e) => {
      const b = e.target.closest('[data-pogled]');
      if (b) uporabiPogled(b.dataset.pogled);
    });

    // Kateri shranjeni pogled ustreza trenutnim filtrom (ce sploh kateri).
    // Brez tega bi zavihek ostal poudarjen, ko uporabnik rocno spremeni
    // status ali transkript — in bi lagal, kaj je prikazano.
    function osveziAktivenPogled() {
      const trenutno = {
        fStatus: vrednostFiltra('fStatus'),
        fTranskript: vrednostFiltra('fTranskript'),
        fPoslano: vrednostFiltra('fPoslano'),
      };
      const ujemanje = POGLEDI.find(p => ['fStatus', 'fTranskript', 'fPoslano']
        .every(k => (p.filtri[k] ?? '') === trenutno[k]));
      aktivenPogled = ujemanje ? ujemanje.kljuc : null;
      izrisiPoglede();
    }

    // Spustni seznami takoj, iskalno polje z zamikom.
    FILTRI.forEach(f => {
      const el = document.getElementById(f.id);
      if (!el) return;
      const osvezi = () => { osveziAktivenPogled(); izrisiSeje(); };
      if (el.tagName === 'SELECT') el.addEventListener('change', osvezi);
      else el.addEventListener('input', debounce(izrisiSeje, 220));
    });

    // ── Nov sestanek ──────────────────────────────────────────────────────
    const panel = document.getElementById('novaSeja');
    const napakaEl = document.getElementById('nsNapaka');

    function odpriNovSestanek() {
      panel.classList.remove('hidden');
      const d = new Date();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      document.getElementById('nsDatum').value = `${d.getFullYear()}-${mm}-${dd}`;
      document.getElementById('nsStranka').focus();
    }

    document.getElementById('btnNova').addEventListener('click', () => {
      if (panel.classList.contains('hidden')) odpriNovSestanek();
      else panel.classList.add('hidden');
    });

    // Gumb "+ Nov sestanek" na strani Danes pripelje sem s #nov, zato mora
    // panel biti odprt takoj — sicer bi klik izgledal, kot da ni naredil nic.
    if (window.location.hash === '#nov') odpriNovSestanek();

    document.getElementById('nsPreklici').addEventListener('click', () => {
      panel.classList.add('hidden');
      napakaEl.textContent = '';
    });

    document.getElementById('nsShrani').addEventListener('click', async () => {
      napakaEl.textContent = '';
      const questionnaire_id = parseInt(document.getElementById('nsPredloga').value, 10);
      const stranka_naziv = document.getElementById('nsStranka').value.trim();

      if (!questionnaire_id) { napakaEl.textContent = 'Izberi vprašalnik.'; return; }
      if (!stranka_naziv) { napakaEl.textContent = 'Vpiši stranko.'; return; }

      const gumb = document.getElementById('nsShrani');
      gumb.disabled = true;
      gumb.textContent = 'Ustvarjam...';

      const d = await apiFetch('/api/procesi/seje', {
        method: 'POST',
        body: JSON.stringify({
          questionnaire_id,
          stranka_naziv,
          proces: document.getElementById('nsProces').value.trim() || null,
          oddelek: document.getElementById('nsOddelek').value.trim() || null,
          svetovalec: document.getElementById('nsSvetovalec').value.trim() || null,
          datum_sestanka: document.getElementById('nsDatum').value || null,
        }),
      });

      gumb.disabled = false;
      gumb.textContent = 'Začni izpolnjevati →';

      if (!d?.ok) { napakaEl.textContent = 'Sestanka ni bilo mogoče ustvariti. Poskusi znova.'; return; }
      odpri(d.seja.id);
    });

    naloziPredloge();
    naloziSeje();
  </script>
</body>
</html>
