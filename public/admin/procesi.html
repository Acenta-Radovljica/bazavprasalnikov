<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Procesi · Acenta baza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    /* Page-only styles. Closest prototypes: podjetja.html (toolbar, table,
       panel foot) and danes.html (tabs with counts). */
    #nsNapaka { color: var(--danger-text); font-size: var(--text-sm); }
    .ns-dejanja { margin-top: var(--space-5); }
    .panel__head .panel__desc { margin-left: auto; text-align: right; }
    .panel__body > .filter-chips { margin-top: var(--space-3); }
    #pogledi:empty, #cipi:empty { display: none; }
    #seje > .callout, #predloge > .callout { margin: var(--space-4); }
    /* Eight filters in two even rows of four on a desktop */
    @media (min-width: 761px) {
      .filters > .field, .filters > .field--grow { flex: 1 1 230px; max-width: none; }
    }

    /* Session table: fixed layout in percentages, so it ALWAYS fits its
       frame; long text is cut with an ellipsis (full value in the tooltip).
       Widths were measured: at 1440 px no header is cut. */
    .seje-tabela { min-width: 900px; }
    .seje-tabela th { padding: 0 10px; }
    .seje-tabela td { padding-left: 10px; padding-right: 10px; }
    .seje-tabela .table__name { font-weight: var(--weight-medium); }
    .seje-tabela .da { display: inline-flex; align-items: center; gap: 4px; color: var(--accent-text); font-weight: var(--weight-medium); }
    .seje-tabela .ni { color: var(--text-muted); }
    .skupina__namig { float: right; font-weight: var(--weight-regular); color: var(--text-muted); }

    /* Template library */
    .predloge-tabela .table__sub { font-family: var(--font-mono); font-size: var(--text-xs); }
    .predloge-tabela tr.is-off td { color: var(--text-muted); }
    .predloge-tabela tr.is-off .table__name { color: var(--text-secondary); }
    .predloge-tabela .table__name .chip { margin-left: var(--space-2); vertical-align: 1px; }

    @media (max-width: 760px) {
      .panel__head { flex-wrap: wrap; row-gap: 4px; }
      .panel__head .panel__desc { margin-left: 0; text-align: left; flex: 1 1 100%; }
      .seje-tabela { min-width: 0; }
      /* Session card: name + status, process, progress + date */
      .seje-tabela td { display: none; }
      .seje-tabela td.c-stranka { display: block; order: 0; flex: 1 1 0; min-width: 0; }
      .seje-tabela td.c-status { display: block; order: 1; flex: none; }
      .seje-tabela td.c-proces { display: block; order: 2; flex: 1 1 100%; color: var(--text-muted); font-size: var(--text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .seje-tabela td.c-napredek { display: block; order: 3; flex: 1 1 0; min-width: 0; }
      .seje-tabela td.c-datum { display: block; order: 4; flex: none; color: var(--text-muted); font-size: var(--text-sm); }
      /* no process: an empty full-width line keeps name and progress apart */
      .seje-tabela td.c-proces.is-empty { height: 0; overflow: hidden; margin-top: calc(-1 * var(--space-2)); }
      .filters > .field--grow { flex-basis: 100%; }
      .seje-tabela .table__name { white-space: normal; }
      .seje-tabela tr.table__group { background: var(--bg-canvas); padding: var(--space-2) var(--space-4); }
      .seje-tabela tr.table__group td { display: block; flex: 1 1 100%; background: none; height: auto; }
      .skupina__namig { display: none; }
      .predloge-tabela td.c-dejanje { flex: 1 1 100%; }
      .predloge-tabela td.c-ime { flex: 1 1 100%; min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar__title">
          <h1>Procesi</h1>
          <span class="topbar__meta" id="stevec">Nalagam …</span>
        </div>
        <span class="spacer"></span>
        <div class="topbar__actions">
          <a class="btn btn--secondary" href="#knjiznica"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg>Knjižnica</a>
          <button class="btn btn--primary" type="button" id="btnNova" aria-expanded="false" aria-controls="novaSeja"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span>Nov sestanek</span></button>
        </div>
      </header>

      <div class="page stack">
        <!-- Saved views: each one only presets the filters below -->
        <nav class="tabs" id="pogledi" aria-label="Pogledi"></nav>

        <!-- New meeting -->
        <section class="panel hidden" id="novaSeja" aria-labelledby="novaSejaNaslov">
          <header class="panel__head">
            <h2 class="panel__title" id="novaSejaNaslov">Nov sestanek</h2>
            <span class="panel__desc">Po shranjevanju se odpre vprašalnik za izpolnjevanje med sestankom.</span>
          </header>
          <div class="panel__body">
            <div class="form-grid" style="--form-cols:3">
              <div class="field">
                <label class="field__label field__label--sm" for="nsPredloga">Vprašalnik<span class="field__req" aria-hidden="true">*</span></label>
                <span class="select-wrap"><select class="select" id="nsPredloga" required></select></span>
              </div>
              <div class="field">
                <label class="field__label field__label--sm" for="nsStranka">Stranka<span class="field__req" aria-hidden="true">*</span></label>
                <input class="input" id="nsStranka" type="text" placeholder="npr. Hotel Smrekov gaj" required autocomplete="off">
              </div>
              <div class="field">
                <label class="field__label field__label--sm" for="nsProces">Proces</label>
                <input class="input" id="nsProces" type="text" placeholder="npr. priprava urnikov zaposlenih" autocomplete="off">
              </div>
              <div class="field">
                <label class="field__label field__label--sm" for="nsOddelek">Oddelek</label>
                <input class="input" id="nsOddelek" type="text" placeholder="npr. recepcija" autocomplete="off">
              </div>
              <div class="field">
                <label class="field__label field__label--sm" for="nsSvetovalec">Svetovalec Acente</label>
                <input class="input" id="nsSvetovalec" type="text" autocomplete="off">
              </div>
              <div class="field">
                <label class="field__label field__label--sm" for="nsDatum">Datum sestanka</label>
                <input class="input" id="nsDatum" type="date">
              </div>
            </div>
            <div class="cluster ns-dejanja">
              <button class="btn btn--primary" type="button" id="nsShrani"><span>Začni izpolnjevati</span><svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
              <button class="btn btn--secondary" type="button" id="nsPreklici">Prekliči</button>
              <span class="field__status" id="nsNapaka" role="alert"></span>
            </div>
          </div>
        </section>

        <!-- Filters: fields wrap in rows; active ones show as chips below -->
        <section class="panel" aria-label="Filtri">
          <div class="panel__body">
            <div class="filters">
              <div class="field field--grow">
                <label class="field__label" for="fStranka">Iskanje</label>
                <input class="input input--sm" id="fStranka" type="search" placeholder="Stranka, proces, oddelek …" autocomplete="off">
              </div>
              <div class="field">
                <label class="field__label" for="fPredloga">Vprašalnik</label>
                <span class="select-wrap"><select class="select select--sm" id="fPredloga"><option value="">Vsi</option></select></span>
              </div>
              <div class="field">
                <label class="field__label" for="fSvetovalec">Svetovalec</label>
                <span class="select-wrap"><select class="select select--sm" id="fSvetovalec"><option value="">Vsi</option></select></span>
              </div>
              <div class="field">
                <label class="field__label" for="fStatus">Status</label>
                <span class="select-wrap"><select class="select select--sm" id="fStatus">
                  <option value="">Aktivni (brez arhiva)</option>
                  <option value="osnutek">Osnutki</option>
                  <option value="zakljucen">Zaključeni</option>
                  <option value="poslan">Poslani stranki</option>
                  <option value="arhiv">Arhiv</option>
                  <option value="vse">Vsi, tudi arhiv</option>
                </select></span>
              </div>
              <div class="field">
                <label class="field__label" for="fObdobje">Obdobje</label>
                <span class="select-wrap"><select class="select select--sm" id="fObdobje">
                  <option value="">Kadarkoli</option>
                  <option value="7">Zadnjih 7 dni</option>
                  <option value="30">Zadnjih 30 dni</option>
                  <option value="90">Zadnjih 90 dni</option>
                </select></span>
              </div>
              <div class="field">
                <label class="field__label" for="fNapredek">Izpolnjenost</label>
                <span class="select-wrap"><select class="select select--sm" id="fNapredek">
                  <option value="">Vse</option>
                  <option value="prazno">Še ni začeto</option>
                  <option value="delno">V teku (1–79 %)</option>
                  <option value="polno">Skoraj polno (80 %+)</option>
                </select></span>
              </div>
              <div class="field">
                <label class="field__label" for="fTranskript">Transkript</label>
                <span class="select-wrap"><select class="select select--sm" id="fTranskript">
                  <option value="">Vseeno</option>
                  <option value="da">Shranjen</option>
                  <option value="ne">Manjka</option>
                </select></span>
              </div>
              <div class="field">
                <label class="field__label" for="fPoslano">Poslano stranki</label>
                <span class="select-wrap"><select class="select select--sm" id="fPoslano">
                  <option value="">Vseeno</option>
                  <option value="da">Poslano</option>
                  <option value="ne">Ni poslano</option>
                </select></span>
              </div>
            </div>
            <div class="filter-chips" id="cipi" aria-live="polite"></div>
          </div>
        </section>

        <!-- Sessions: groups by status, one shared sortable header -->
        <section class="panel" aria-label="Sestanki">
          <div class="table-scroll" id="seje"></div>
        </section>

        <!-- Library -->
        <section class="panel" id="knjiznica" aria-labelledby="knjiznicaNaslov">
          <header class="panel__head">
            <h2 class="panel__title" id="knjiznicaNaslov">Knjižnica vprašalnikov</h2>
            <span class="count" id="stPredlog">—</span>
            <span class="panel__desc">Urejanje velja za prihodnje sestanke; že začeti obdržijo svoja vprašanja.</span>
          </header>
          <div class="table-scroll" id="predloge"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="/admin/app.js"></script>
  <script>
    renderSidebar('procesi');

    // ── State ─────────────────────────────────────────────────────────────
    let vseSeje = [];         // every session from the server (up to 200)
    let predlogeCache = [];
    let razvrsti = { stolpec: 'updated_at', smer: 'desc' };

    // Status chips: the same meaning as on Danes and in the company list.
    const STATUS_OZNAKA = {
      osnutek:   ['Osnutek', 'chip'],
      zakljucen: ['Zaključen', 'chip chip--info'],
      poslan:    ['Poslan', 'chip chip--success'],
      arhiv:     ['Arhiv', 'chip'],
    };

    // Groups in the list. The order is the order of work: what is in
    // progress is on top, the archive at the bottom.
    const SKUPINE = [
      { status: 'osnutek',   naslov: 'V teku',                      namig: 'Izpolnjuje se med sestankom, sproti se shranjuje' },
      { status: 'zakljucen', naslov: 'Zaključeno, čaka pošiljanje', namig: 'Pripravljeno za stranko' },
      { status: 'poslan',    naslov: 'Poslano stranki',             namig: 'Zapis je pri stranki' },
      { status: 'arhiv',     naslov: 'Arhiv',                       namig: '' },
    ];

    function statusBadge(s) {
      const [besedilo, razred] = STATUS_OZNAKA[s] || [s, 'chip'];
      return `<span class="${razred}">${esc(besedilo)}</span>`;
    }

    const steviloSej = (n) => sklon(n, SKLONI.seja);
    const steviloSestankov = (n) => sklon(n, ['sestanek', 'sestanka', 'sestanki', 'sestankov']);
    const PRAZNO = '<span class="ni">—</span>';

    function napredekBar(n) {
      if (!n || !n.skupaj) return PRAZNO;
      const nizko = n.odstotek < 40 ? ' progress__fill--low' : '';
      return `
        <div class="meter" title="${n.izpolnjenih ?? 0} od ${n.skupaj} polj">
          <span class="progress"><span class="progress__fill${nizko}" style="width:${n.odstotek}%"></span></span>
          <span class="meter__val">${n.odstotek}&nbsp;%</span>
        </div>`;
    }

    function kljukica(jeTam, besedilo) {
      return jeTam
        ? `<span class="da">${ikona('check', 'icon--sm')}${besedilo ? `<span>${esc(besedilo)}</span>` : '<span class="sr-only">Da</span>'}</span>`
        : PRAZNO;
    }

    // ── Filters ───────────────────────────────────────────────────────────
    // Filtering happens in the browser, not on the server: the list is capped
    // at 200 rows, every needed field is already in the response, so a filter
    // change is instant. If the list ever outgrows that, the filters move to
    // SQL (the route already supports some of them).
    const FILTRI = [
      { id: 'fStranka',    naslov: 'Iskanje' },
      { id: 'fPredloga',   naslov: 'Vprašalnik' },
      { id: 'fSvetovalec', naslov: 'Svetovalec' },
      { id: 'fStatus',     naslov: 'Status' },
      { id: 'fObdobje',    naslov: 'Obdobje' },
      { id: 'fNapredek',   naslov: 'Izpolnjenost' },
      { id: 'fTranskript', naslov: 'Transkript' },
      { id: 'fPoslano',    naslov: 'Poslano' },
    ];

    function vrednostFiltra(id) {
      const el = document.getElementById(id);
      return el ? el.value : '';
    }

    // Readable label of the chosen value (for the active filter chips).
    function opisFiltra(id) {
      const el = document.getElementById(id);
      if (!el || !el.value) return null;
      if (el.tagName === 'SELECT') {
        const izbrana = el.options[el.selectedIndex];
        return izbrana ? izbrana.textContent.trim() : el.value;
      }
      return el.value.trim() || null;
    }

    function uporabiFiltre(seje) {
      const iskanje = vrednostFiltra('fStranka').trim().toLowerCase();
      const predloga = vrednostFiltra('fPredloga');
      const svetovalec = vrednostFiltra('fSvetovalec');
      const status = vrednostFiltra('fStatus');
      const obdobje = vrednostFiltra('fObdobje');
      const napredek = vrednostFiltra('fNapredek');
      const transkript = vrednostFiltra('fTranskript');
      const poslano = vrednostFiltra('fPoslano');

      const mejaDni = obdobje ? Date.now() - Number(obdobje) * 86400000 : null;

      return seje.filter(s => {
        if (iskanje) {
          const kup = [s.stranka_naziv, s.proces, s.oddelek, s.svetovalec, s.naziv_prikaz]
            .filter(Boolean).join(' ').toLowerCase();
          if (!kup.includes(iskanje)) return false;
        }
        if (predloga && String(s.questionnaire_id ?? '') !== predloga) return false;
        if (svetovalec && (s.svetovalec || '') !== svetovalec) return false;

        // The archive is hidden by default; "vse" turns it on explicitly.
        if (!status) { if (s.status === 'arhiv') return false; }
        else if (status !== 'vse' && s.status !== status) return false;

        if (mejaDni) {
          const t = new Date(s.datum_sestanka || s.created_at).getTime();
          if (!Number.isFinite(t) || t < mejaDni) return false;
        }
        if (napredek) {
          const o = s.napredek?.odstotek ?? 0;
          if (napredek === 'prazno' && o !== 0) return false;
          if (napredek === 'delno' && (o === 0 || o >= 80)) return false;
          if (napredek === 'polno' && o < 80) return false;
        }
        if (transkript === 'da' && !s.st_transkriptov) return false;
        if (transkript === 'ne' && s.st_transkriptov) return false;
        if (poslano === 'da' && !s.st_poslanih) return false;
        if (poslano === 'ne' && s.st_poslanih) return false;
        return true;
      });
    }

    function izrisiCipe() {
      const aktivni = FILTRI
        .map(f => ({ ...f, opis: opisFiltra(f.id) }))
        .filter(f => f.opis);

      const el = document.getElementById('cipi');
      if (!aktivni.length) {
        el.innerHTML = '<span>Ni aktivnih filtrov.</span>';
        return;
      }
      el.innerHTML = aktivni.map(f => `
        <span class="chip chip--filter cip">${esc(f.naslov)}: ${esc(f.opis)}<button class="chip__x" type="button" data-pocisti-filter="${f.id}" aria-label="Odstrani filter ${esc(f.naslov)}" title="Odstrani filter">${ikona('x')}</button></span>`).join('')
        + '<button class="link" type="button" id="pocistiVse">Počisti vse</button>';
    }

    // ── Sorting ───────────────────────────────────────────────────────────
    // `r` = class of the cell; the phone card shows only some of them.
    const STOLPCI = [
      { kljuc: 'stranka_naziv',   naslov: 'Stranka',      r: 'c-stranka'  },
      { kljuc: 'proces',          naslov: 'Proces',       r: 'c-proces'   },
      { kljuc: 'oddelek',         naslov: 'Oddelek',      r: 'c-oddelek'  },
      { kljuc: 'naziv_prikaz',    naslov: 'Vprašalnik',   r: 'c-vpr'      },
      { kljuc: 'svetovalec',      naslov: 'Svetovalec',   r: 'c-svet'     },
      { kljuc: 'napredek',        naslov: 'Izpolnjenost', r: 'c-napredek' },
      { kljuc: 'status',          naslov: 'Status',       r: 'c-status'   },
      { kljuc: 'st_transkriptov', naslov: 'Transkript',   r: 'c-tr'       },
      { kljuc: 'st_poslanih',     naslov: 'Poslano',      r: 'c-poslano'  },
      { kljuc: 'datum_sestanka',  naslov: 'Datum',        r: 'c-datum'    },
    ];

    function kljucZaSort(s, kljuc) {
      if (kljuc === 'napredek') return s.napredek?.odstotek ?? -1;
      if (kljuc === 'datum_sestanka') return s.datum_sestanka || s.created_at || '';
      if (kljuc === 'updated_at') return s.updated_at || '';
      const v = s[kljuc];
      return v == null ? '' : v;
    }

    function razvrstiSeje(seje) {
      const { stolpec, smer } = razvrsti;
      const znak = smer === 'asc' ? 1 : -1;
      return [...seje].sort((a, b) => {
        const va = kljucZaSort(a, stolpec);
        const vb = kljucZaSort(b, stolpec);
        if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * znak;
        // Empty values always last, whatever the direction: an empty
        // department on top of the list is not useful information.
        if (!va && vb) return 1;
        if (va && !vb) return -1;
        return String(va).localeCompare(String(vb), 'sl') * znak;
      });
    }

    // ── Session table ─────────────────────────────────────────────────────
    function izrisiSeje() {
      const filtrirane = uporabiFiltre(vseSeje);
      const seje = razvrstiSeje(filtrirane);

      document.getElementById('stevec').textContent =
        `${seje.length} od ${steviloSestankov(vseSeje.length)}`;
      izrisiCipe();

      if (!vseSeje.length) {
        document.getElementById('seje').innerHTML = `
          <div class="empty empty--center">
            <b class="empty__title">Še ni sestankov</b>
            <p class="empty__text">Kliknite »Nov sestanek« zgoraj in začnite izpolnjevati vprašalnik.</p>
          </div>`;
        return;
      }
      if (!seje.length) {
        document.getElementById('seje').innerHTML = `
          <div class="empty empty--center">
            <b class="empty__title">Noben sestanek ne ustreza filtrom</b>
            <p class="empty__text">Odstranite kakšen filter zgoraj ali kliknite »Počisti vse«.</p>
          </div>`;
        return;
      }

      const glava = STOLPCI.map(c => {
        const jeAktiven = razvrsti.stolpec === c.kljuc;
        const pusc = jeAktiven ? (razvrsti.smer === 'asc' ? '▲' : '▼') : '▼';
        const aria = jeAktiven ? ` aria-sort="${razvrsti.smer === 'asc' ? 'ascending' : 'descending'}"` : '';
        return `<th class="is-sortable${jeAktiven ? ' is-sorted aktiven' : ''}" data-sort="${c.kljuc}"${aria} title="Razvrsti po: ${esc(c.naslov)}">${esc(c.naslov)}<span class="sort-arrow" aria-hidden="true">${pusc}</span></th>`;
      }).join('');

      const vrstica = (s) => `
        <tr class="is-link" data-odpri="${s.id}" tabindex="0">
          <td class="c-stranka" title="${esc(s.stranka_naziv)}"><span class="table__name">${esc(s.stranka_naziv)}</span></td>
          <td class="c-proces${s.proces ? '' : ' is-empty'}" title="${esc(s.proces || '')}">${esc(s.proces) || PRAZNO}</td>
          <td class="c-oddelek" title="${esc(s.oddelek || '')}">${esc(s.oddelek) || PRAZNO}</td>
          <td class="c-vpr" title="${esc(s.naziv_prikaz)}">${esc(s.naziv_prikaz)}</td>
          <td class="c-svet" title="${esc(s.svetovalec || '')}">${esc(s.svetovalec) || PRAZNO}</td>
          <td class="c-napredek">${napredekBar(s.napredek)}</td>
          <td class="c-status">${statusBadge(s.status)}</td>
          <td class="c-tr">${kljukica(s.st_transkriptov)}</td>
          <td class="c-poslano">${kljukica(s.st_poslanih, s.st_poslanih ? s.st_poslanih + '×' : '')}</td>
          <td class="c-datum nowrap">${formatDan(s.datum_sestanka || s.created_at)}</td>
        </tr>`;

      // Groups are printed only when they have rows. Sorting applies within
      // each group, by the chosen column; the header is shared.
      const vrstice = SKUPINE.map(g => {
        const vGrupi = seje.filter(s => s.status === g.status);
        if (!vGrupi.length) return '';
        const namig = g.namig ? `<span class="skupina__namig">${esc(g.namig)}</span>` : '';
        return `
          <tr class="table__group skupina"><td colspan="${STOLPCI.length}">${esc(g.naslov)}<span class="table__group-meta">${steviloSej(vGrupi.length)}</span>${namig}</td></tr>
          ${vGrupi.map(vrstica).join('')}`;
      }).join('');

      // Widths in % are MEASURED, not guessed (no header may be cut at
      // 1440 px; the test checks scrollWidth). The sum stays 100.
      //          stranka proces oddelek vpr. svet. izpol. status transk. poslano datum
      const sirine = [13,    11,    9,     11,  10,   11,    9,     9,      8,      9];
      const colgroup = `<colgroup>${sirine.map(w => `<col style="width:${w}%">`).join('')}</colgroup>`;

      document.getElementById('seje').innerHTML = `
        <table class="table table--fixed table--stack seje-tabela">
          ${colgroup}
          <thead><tr>${glava}</tr></thead>
          <tbody>${vrstice}</tbody>
        </table>`;
    }

    // ── Saved views ───────────────────────────────────────────────────────
    // A view is only a preset of filters, no hidden logic: the chips below
    // always show what the view actually does.
    const POGLEDI = [
      { kljuc: 'vsi',        naslov: 'Vsi',              filtri: {} },
      { kljuc: 'vteku',      naslov: 'V teku',           filtri: { fStatus: 'osnutek' } },
      { kljuc: 'transkript', naslov: 'Brez transkripta', filtri: { fTranskript: 'ne' } },
      { kljuc: 'poslati',    naslov: 'Za pošiljanje',    filtri: { fStatus: 'zakljucen', fPoslano: 'ne' } },
      { kljuc: 'poslani',    naslov: 'Poslani stranki',  filtri: { fStatus: 'poslan' } },
      { kljuc: 'arhiv',      naslov: 'Arhiv',            filtri: { fStatus: 'arhiv' } },
    ];
    let aktivenPogled = 'vsi';

    // How many sessions a view would show: the count on the tab, from the
    // already loaded list, no extra server round trip.
    function stejZaPogled(p) {
      return vseSeje.filter(s => {
        const st = p.filtri.fStatus;
        if (st) { if (s.status !== st) return false; }
        else if (s.status === 'arhiv') return false;
        if (p.filtri.fTranskript === 'ne' && s.st_transkriptov) return false;
        if (p.filtri.fPoslano === 'ne' && s.st_poslanih) return false;
        return true;
      }).length;
    }

    function izrisiPoglede() {
      document.getElementById('pogledi').innerHTML = POGLEDI.map(p => {
        const on = p.kljuc === aktivenPogled;
        return `<button class="tab${on ? ' active' : ''}" type="button" data-pogled="${p.kljuc}" aria-pressed="${on}">${esc(p.naslov)}<span class="count">${stejZaPogled(p)}</span></button>`;
      }).join('');
    }

    function uporabiPogled(kljuc) {
      const p = POGLEDI.find(x => x.kljuc === kljuc);
      if (!p) return;
      aktivenPogled = kljuc;
      // A view overwrites ONLY its own filters; search and the rest stay.
      ['fStatus', 'fTranskript', 'fPoslano'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = p.filtri[id] ?? '';
      });
      izrisiPoglede();
      izrisiSeje();
    }

    // ── Template library ──────────────────────────────────────────────────
    function izrisiPredloge() {
      document.getElementById('stPredlog').textContent = predlogeCache.length;
      if (!predlogeCache.length) {
        document.getElementById('predloge').innerHTML = `
          <div class="empty">
            <b class="empty__title">Ni procesnih vprašalnikov</b>
            <p class="empty__text">Migracija 009 doda »Ocena poslovnega potenciala za AI«. Če je seznam prazen, migracija še ni stekla.</p>
          </div>`;
        return;
      }
      document.getElementById('predloge').innerHTML = `
        <table class="table table--fixed table--stack predloge-tabela">
          <colgroup><col style="width:44%"><col style="width:12%"><col style="width:12%"><col style="width:16%"><col style="width:16%"></colgroup>
          <thead><tr>
            <th>Vprašalnik</th><th class="is-num">Vprašanj</th><th class="is-num">Sestankov</th><th>Zadnja sprememba</th><th><span class="sr-only">Dejanje</span></th>
          </tr></thead>
          <tbody>
            ${predlogeCache.map(p => `
              <tr class="${p.aktivna ? '' : 'is-off'}">
                <td class="c-ime" title="${esc(p.naziv_prikaz)}">
                  <span class="table__name">${esc(p.naziv_prikaz)}${p.aktivna ? '' : '<span class="chip">Ugasnjen</span>'}</span>
                  <span class="table__sub">${esc(p.slug)}</span>
                </td>
                <td class="is-num" data-label="Vprašanj:">${p.st_vprasanj}</td>
                <td class="is-num" data-label="Sestankov:">${p.st_sej}</td>
                <td data-label="Spremenjeno:">${formatDan(p.updated_at)}</td>
                <td class="c-dejanje" style="text-align:right"><a class="link" href="/admin/predloga.html?id=${p.id}">Uredi vprašanja${ikona('arrow-right', 'icon--sm')}</a></td>
              </tr>`).join('')}
          </tbody>
        </table>`;
    }

    // ── Loading ───────────────────────────────────────────────────────────
    async function naloziSeje() {
      showLoading('seje', 'Nalagam sestanke …');
      // Take ALL (archive too) and filter in the browser, so a filter change
      // needs no new round trip.
      const d = await apiFetch('/api/procesi/seje?status=vse');
      if (!d) {
        document.getElementById('stevec').textContent = '';
        return showError('seje', 'Sestankov ni bilo mogoče naložiti. Osvežite stran.');
      }

      vseSeje = d.seje;
      napolniSvetovalce();
      izrisiPoglede();
      izrisiSeje();
    }

    // The consultant picker is built from the data; there is no code list.
    function napolniSvetovalce() {
      const imena = [...new Set(vseSeje.map(s => s.svetovalec).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, 'sl'));
      const sel = document.getElementById('fSvetovalec');
      const prej = sel.value;
      sel.innerHTML = '<option value="">Vsi</option>'
        + imena.map(i => `<option value="${esc(i)}">${esc(i)}</option>`).join('');
      if (imena.includes(prej)) sel.value = prej;
    }

    async function naloziPredloge() {
      showLoading('predloge', 'Nalagam vprašalnike …');
      const d = await apiFetch('/api/procesi/predloge');
      if (!d) return showError('predloge', 'Vprašalnikov ni bilo mogoče naložiti. Osvežite stran.');

      predlogeCache = d.predloge;

      const aktivne = predlogeCache.filter(p => p.aktivna);
      document.getElementById('nsPredloga').innerHTML = aktivne.length
        ? aktivne.map(p => `<option value="${p.id}">${esc(p.naziv_prikaz)}</option>`).join('')
        : '<option value="">Ni aktivnih vprašalnikov</option>';

      document.getElementById('fPredloga').innerHTML = '<option value="">Vsi</option>'
        + predlogeCache.map(p => `<option value="${p.id}">${esc(p.naziv_prikaz)}</option>`).join('');

      izrisiPredloge();
    }

    // ── Events ────────────────────────────────────────────────────────────
    function odpri(id) { window.location.href = `/admin/proces-seja.html?id=${id}`; }

    function razvrstiPo(kljuc) {
      if (razvrsti.stolpec === kljuc) {
        razvrsti.smer = razvrsti.smer === 'asc' ? 'desc' : 'asc';
      } else {
        razvrsti = { stolpec: kljuc, smer: 'asc' };
      }
      izrisiSeje();
    }

    const sejeEl = document.getElementById('seje');
    sejeEl.addEventListener('click', (e) => {
      const th = e.target.closest('th[data-sort]');
      if (th) { razvrstiPo(th.dataset.sort); return; }
      const tr = e.target.closest('tr[data-odpri]');
      if (tr) odpri(tr.dataset.odpri);
    });
    sejeEl.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const tr = e.target.closest('tr[data-odpri]');
      if (tr) odpri(tr.dataset.odpri);
    });

    document.getElementById('cipi').addEventListener('click', (e) => {
      const x = e.target.closest('[data-pocisti-filter]');
      if (x) {
        const el = document.getElementById(x.dataset.pocistiFilter);
        if (el) el.value = '';
        osveziAktivenPogled();
        izrisiSeje();
        return;
      }
      if (e.target.closest('#pocistiVse')) {
        FILTRI.forEach(f => { const el = document.getElementById(f.id); if (el) el.value = ''; });
        osveziAktivenPogled();
        izrisiSeje();
      }
    });

    document.getElementById('pogledi').addEventListener('click', (e) => {
      const b = e.target.closest('[data-pogled]');
      if (b) uporabiPogled(b.dataset.pogled);
    });

    // Which saved view matches the current filters (if any). Without this
    // a tab would stay highlighted after a manual change of status or
    // transcript, and lie about what is shown.
    function osveziAktivenPogled() {
      const trenutno = {
        fStatus: vrednostFiltra('fStatus'),
        fTranskript: vrednostFiltra('fTranskript'),
        fPoslano: vrednostFiltra('fPoslano'),
      };
      const ujemanje = POGLEDI.find(p => ['fStatus', 'fTranskript', 'fPoslano']
        .every(k => (p.filtri[k] ?? '') === trenutno[k]));
      aktivenPogled = ujemanje ? ujemanje.kljuc : null;
      izrisiPoglede();
    }

    // Selects apply at once, the search box after a short pause.
    FILTRI.forEach(f => {
      const el = document.getElementById(f.id);
      if (!el) return;
      const osvezi = () => { osveziAktivenPogled(); izrisiSeje(); };
      if (el.tagName === 'SELECT') el.addEventListener('change', osvezi);
      else el.addEventListener('input', debounce(izrisiSeje, 220));
    });

    // ── New meeting ───────────────────────────────────────────────────────
    const panel = document.getElementById('novaSeja');
    const napakaEl = document.getElementById('nsNapaka');
    const btnNova = document.getElementById('btnNova');

    function odpriNovSestanek() {
      panel.classList.remove('hidden');
      btnNova.setAttribute('aria-expanded', 'true');
      const d = new Date();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      document.getElementById('nsDatum').value = `${d.getFullYear()}-${mm}-${dd}`;
      document.getElementById('nsStranka').focus();
    }

    function zapriNovSestanek() {
      panel.classList.add('hidden');
      btnNova.setAttribute('aria-expanded', 'false');
      napakaEl.textContent = '';
    }

    btnNova.addEventListener('click', () => {
      if (panel.classList.contains('hidden')) odpriNovSestanek();
      else zapriNovSestanek();
    });

    // "Nov sestanek" on Danes links here with #nov, so the panel must open
    // at once; otherwise the click would look like it did nothing.
    if (window.location.hash === '#nov') odpriNovSestanek();

    document.getElementById('nsPreklici').addEventListener('click', zapriNovSestanek);

    document.getElementById('nsShrani').addEventListener('click', async () => {
      napakaEl.textContent = '';
      const questionnaire_id = parseInt(document.getElementById('nsPredloga').value, 10);
      const stranka_naziv = document.getElementById('nsStranka').value.trim();

      if (!questionnaire_id) { napakaEl.textContent = 'Izberite vprašalnik.'; return; }
      if (!stranka_naziv) {
        napakaEl.textContent = 'Vpišite stranko.';
        document.getElementById('nsStranka').focus();
        return;
      }

      const gumb = document.getElementById('nsShrani');
      const oznaka = gumb.querySelector('span');
      gumb.disabled = true;
      oznaka.textContent = 'Ustvarjam …';

      const d = await apiFetch('/api/procesi/seje', {
        method: 'POST',
        body: JSON.stringify({
          questionnaire_id,
          stranka_naziv,
          proces: document.getElementById('nsProces').value.trim() || null,
          oddelek: document.getElementById('nsOddelek').value.trim() || null,
          svetovalec: document.getElementById('nsSvetovalec').value.trim() || null,
          datum_sestanka: document.getElementById('nsDatum').value || null,
        }),
      });

      gumb.disabled = false;
      oznaka.textContent = 'Začni izpolnjevati';

      if (!d?.ok) { napakaEl.textContent = 'Sestanka ni bilo mogoče ustvariti. Poskusite znova.'; return; }
      odpri(d.seja.id);
    });

    // Enter in a form field = save (the panel is not a <form>).
    panel.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.matches('input')) document.getElementById('nsShrani').click();
    });

    naloziPredloge();
    naloziSeje();
  </script>
</body>
</html>
