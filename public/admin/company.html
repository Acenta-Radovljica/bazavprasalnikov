<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Podjetje · Acenta baza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
  <link rel="stylesheet" href="/admin/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* Company record (design-prototype/podjetje.html): document + properties,
       like a CRM record. Areas: doc | props, work, answers | meta. */
    .ident__meta { margin-top: 6px; }
    .ident .qlink:has(.count) { padding-right: 4px; }
    .dvojnik { margin-bottom: var(--space-5); }
    .dvojnik > div { flex: 1; min-width: 0; }

    .record {
      display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--space-6);
      /* props spans the first two rows; the 1fr row takes the extra height of
         a tall side column, so a short (empty) proposal gets no gap below it. */
      grid-template-areas: "doc props" "popis props" "answers meta";
      grid-template-rows: auto 1fr auto;
      align-items: start;
    }
    /* Part "Pred delavnico": the overview card instead of proposal + inventory.
       Part "Drugo": only the answers. */
    .record.is-pred { grid-template-areas: "doc props" "answers meta"; grid-template-rows: auto auto; }
    .record.is-drugo { grid-template-areas: "answers props" "answers meta"; grid-template-rows: auto 1fr; }
    .record > [hidden] { display: none !important; }
    .a-doc { grid-area: doc; scroll-margin-top: calc(var(--topbar-h) + var(--space-4)); }
    .a-popis { grid-area: popis; scroll-margin-top: calc(var(--topbar-h) + var(--space-4)); }
    .a-props { grid-area: props; align-self: stretch; min-width: 0; }
    .a-answers { grid-area: answers; scroll-margin-top: calc(var(--topbar-h) + var(--space-4)); }
    .a-meta { grid-area: meta; }
    .props { position: sticky; top: calc(var(--topbar-h) + var(--space-4)); }

    /* Parts of the workshop: before / after (questionnaires.faza) */
    .faze { margin: calc(-1 * var(--space-2)) 0 var(--space-6); }
    .faze .tabs { gap: var(--space-6); }
    .faze .tab { height: 44px; font-size: var(--text-md); font-weight: var(--weight-semibold); }

    /* Sales proposal: reading surface */
    .docp__note { padding: 0 var(--space-6) var(--space-3); }
    .doc h3 .dept { font-weight: var(--weight-regular); color: var(--text-muted); }
    .panel > .empty { padding: var(--space-4) var(--space-6) var(--space-8); }
    .docp__head + .loading { padding: var(--space-8) var(--space-6); justify-content: flex-start; }

    /* Task inventory (Popis opravil): employees' recurring tasks with hours per month */
    .popis__head { display: flex; align-items: flex-start; gap: var(--space-3); flex-wrap: wrap; padding: var(--space-4) var(--space-6) var(--space-3); }
    .popis__title { min-width: 0; flex: 1 1 220px; }
    .popis__title h2 { font-size: var(--text-md); }
    .popis__title p { font-size: var(--text-sm); color: var(--text-muted); margin-top: 2px; }
    .popis__acts { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
    .popis__sum { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-3); padding: 0 var(--space-6) var(--space-4); }
    .popis__total { font-size: 1.375rem; font-weight: var(--weight-semibold); letter-spacing: -0.01em; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .popis__link { max-width: 100%; padding: 3px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-subtle); font-family: var(--font-mono); font-size: var(--text-sm); color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .popis__link[hidden] { display: none; }
    .popis__empty { padding: 0 var(--space-6) var(--space-6); font-size: var(--text-sm); color: var(--text-secondary); max-width: var(--prose-max); }
    .popis .table { table-layout: fixed; }
    .popis .table th:first-child, .popis .table td:first-child { padding-left: var(--space-6); }
    .popis .table th:last-child, .popis .table td:last-child { padding-right: var(--space-6); }
    .popis__c-pog { width: 150px; }
    .popis__c-cas { width: 140px; }
    .popis__c-ure { width: 116px; }
    .popis .table td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .popis__opis { display: block; color: var(--text); font-weight: var(--weight-medium); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .popis__ure { color: var(--text); font-weight: var(--weight-semibold); }
    .popis__enota { display: none; }
    .popis .table__sub.only-m { display: none; }
    .popis__link.is-nova { border-color: var(--accent-border); background: var(--accent-subtle); color: var(--accent-text); }
    .pp-novi { flex: 1; display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; }
    .pp-novi .link { font-weight: var(--weight-semibold); white-space: nowrap; }

    /* Lead score: the AI segment shows what the AI suggests */
    .seg-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--text-faint); }
    .seg-dot--hot { background: var(--lead-hot); }
    .seg-dot--warm { background: var(--lead-warm); }
    .seg-dot--cold { background: var(--lead-cold); }

    /* Before the workshop: level (computed) and what takes their time (AI) */
    .pred__grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-6); padding: var(--space-4) var(--space-6) var(--space-6); }
    .pred__blok { min-width: 0; }
    .pred__h { font-size: var(--text-base); font-weight: var(--weight-semibold); margin-bottom: var(--space-3); }
    .pred__h4 { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-secondary); margin: var(--space-5) 0 var(--space-2); }
    .pred__raven { display: flex; align-items: baseline; gap: var(--space-2); flex-wrap: wrap; }
    .pred__ocena { font-size: 2rem; font-weight: var(--weight-semibold); letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
    .pred__od { font-size: var(--text-sm); color: var(--text-muted); margin-right: var(--space-2); }
    .pred__raven .chip { align-self: center; }
    .pred__opis { font-size: var(--text-sm); color: var(--text-secondary); margin: var(--space-2) 0 var(--space-4); line-height: 1.5; }
    .pred .bar-row { grid-template-columns: minmax(0, 1fr) 96px 28px; }
    .pred__vir { font-size: var(--text-sm); color: var(--text-muted); margin: calc(-1 * var(--space-2)) 0 var(--space-3); line-height: 1.5; }
    .pred__prazno { font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.5; }
    .pred__stanje { margin-bottom: var(--space-3); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips .chip b { font-weight: var(--weight-semibold); margin-left: 4px; font-variant-numeric: tabular-nums; }
    .chip--off { opacity: .55; }
    .teme { list-style: none; margin: 0; padding: 0; }
    .teme li { padding: var(--space-3) 0; border-top: 1px solid var(--border-subtle); }
    .teme li:first-child { border-top: 0; padding-top: 0; }
    .teme__vrh { display: flex; align-items: center; gap: var(--space-2); }
    .teme__vrh b { font-weight: var(--weight-semibold); font-size: var(--text-base); min-width: 0; }
    .teme__vrh .count { margin-left: auto; flex: none; }
    .teme__citat { display: block; margin-top: 4px; font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.5; text-decoration: none; overflow-wrap: anywhere; }
    .teme__citat:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
    .pred__foot { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; padding: var(--space-3) var(--space-6); border-top: 1px solid var(--border-subtle); font-size: var(--text-sm); color: var(--text-muted); }
    .pred__foot .spacer { flex: 1; }
    .pred > .empty { padding: var(--space-4) var(--space-6) var(--space-8); }
    .actions { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }

    /* Answers */
    .odg-tabs { padding: 0 var(--space-4); }
    .resp { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: var(--space-3); padding: var(--space-4); border-bottom: 1px solid var(--border-subtle); }
    .resp:last-of-type { border-bottom: 0; }
    .resp h3 { font-size: var(--text-base); font-weight: var(--weight-semibold); overflow-wrap: anywhere; }
    .resp__meta { font-size: var(--text-sm); color: var(--text-muted); margin-top: 1px; overflow-wrap: anywhere; }
    .resp__sum {
      margin-top: var(--space-2); max-width: 72ch;
      font-size: var(--text-sm); line-height: 1.6; color: var(--text-secondary); overflow-wrap: anywhere;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .resp__sum.is-open { display: block; -webkit-line-clamp: unset; overflow: visible; }
    .resp__sum :is(p, ul, ol, h1, h2, h3, h4, blockquote, pre) { margin: 0; font-size: inherit; line-height: inherit; color: inherit; }
    .resp__sum :is(h1, h2, h3, h4) { font-weight: var(--weight-semibold); color: var(--text); }
    .resp__sum :is(ul, ol) { padding-left: 1.25em; }
    .resp__sum.is-open > * + * { margin-top: var(--space-2); }
    .resp__sum strong { color: var(--text); font-weight: var(--weight-semibold); }
    .resp__none { margin-top: var(--space-2); font-size: var(--text-sm); color: var(--text-muted); }
    .resp .link { margin-top: 6px; font-size: var(--text-sm); }
    .resp__open { align-self: start; }

    /* Management: normalized name below the actions */
    .kv--meta { margin-top: var(--space-4); border-top: 1px solid var(--border-subtle); }
    .kv--meta > div { padding-bottom: 0; font-size: var(--text-xs); }
    .kv--meta dd { font-family: var(--font-mono); color: var(--text-secondary); white-space: normal; overflow-wrap: anywhere; }

    @media (max-width: 1100px) {
      .record { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "doc" "popis" "props" "answers" "meta"; }
      .record.is-pred { grid-template-areas: "doc" "props" "answers" "meta"; grid-template-rows: none; }
      .record.is-drugo { grid-template-areas: "answers" "props" "meta"; grid-template-rows: none; }
      .props { position: static; }
    }
    @media (max-width: 900px) {
      .pred__grid { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 760px) {
      .ident__meta > span:first-child { flex: 1 1 100%; }
      .docp__actions { order: -1; }
      .docp__actions .btn { flex: 1 1 0; }
      .docp__actions .btn--primary { order: -1; flex: 1 1 100%; }
      .docp__bar .tabs { border-top: 1px solid var(--border-subtle); gap: var(--space-6); }
      .resp { grid-template-columns: 36px minmax(0, 1fr); }
      .resp__open { grid-column: 2; justify-self: start; }
      /* Task inventory on a phone: buttons full width, each task a stacked row */
      .popis__head, .popis__sum { padding-left: var(--space-4); padding-right: var(--space-4); }
      .popis__acts { flex: 1 1 100%; flex-direction: column; align-items: stretch; }
      .popis__empty { padding: 0 var(--space-4) var(--space-4); }
      .popis .table thead { display: none; }
      .popis .table, .popis .table tbody { display: block; }
      .popis .table tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--space-3); align-items: center; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-subtle); }
      .popis .table tbody tr:last-child { border-bottom: 0; }
      .popis .table td { display: block; height: auto; padding: 0 !important; border: 0; }
      .popis .table .popis__c-pog, .popis .table .popis__c-cas { display: none; }
      .popis .table td.is-num { width: auto; text-align: right; line-height: 1.1; }
      .popis .table td:first-child { white-space: normal; }
      .popis__opis { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
      .popis__enota { display: block; font-size: var(--text-xs); color: var(--text-muted); font-weight: var(--weight-regular); }
      .popis .table__sub.only-m { display: block; }
      .faze .tabs { gap: var(--space-5); }
      .faze .tab { font-size: var(--text-base); }
      .pred__grid { padding: var(--space-3) var(--space-4) var(--space-4); }
      .pred__foot { padding: var(--space-3) var(--space-4); }
      .pred > .empty { padding: var(--space-4); }
    }
    @media print {
      .ident, .dvojnik, .faze, .a-props, .a-answers, .a-meta, .pred__foot .btn, .docp__actions, .docp__tabs, .docp__note, .docp__body > .callout { display: none !important; }
      .record { display: block; }
      .panel { border: 0; }
      .page { padding: 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main">
      <header class="topbar">
        <nav class="crumbs" aria-label="Pot">
          <a href="/admin/podjetja.html">Podjetja</a>
          <svg class="icon icon--sm" aria-hidden="true"><use href="#i-chev-right"/></svg>
          <span aria-current="page" id="crumb-ime">Podjetje</span>
        </nav>
        <span class="spacer"></span>
        <div class="topbar__actions">
          <button class="btn btn--secondary" type="button" id="btn-izvoz" hidden
            title="Odgovori (brez tistih pred delavnico), zapisi sestankov in transkripti tega podjetja v enem ZIP-u, z navodili za prodajni predlog AI procesov"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg><span>Izvoz za Claude (ZIP)</span></button>
        </div>
      </header>

      <div class="page" id="stran">
        <div class="loading" role="status"><span class="spinner" aria-hidden="true"></span>Nalagam podjetje …</div>
      </div>
    </main>
  </div>

  <script src="/admin/app.js"></script>
  <script>
    renderNav('home');

    const id = qs('id');
    const stran = document.getElementById('stran');

    // ── State ─────────────────────────────────────────────────────────────
    let podjetje = null;
    let odgovori = [];        // [{id, questionnaire_id, q_slug, q_naziv, q_faza, submitted_at, raw_data, ai_povzetek, vprasanja}]
    let aktivnaFaza = null;   // 'pred' | 'po' | 'drugo'; null = the company has no workshop answers (no tabs)
    let aktivniTab = null;    // questionnaire_id in the answers list of the active part
    let vsiOdgovori = false;  // "Pokaži vse" in the answers list
    let mozniDvojnik = null;  // {id, naziv_prikaz}: matching on submit did not merge it automatically

    // Sales funnel: same truth as STATUSI in src/routes/api.js.
    const LIJAK = ['nov', 'kvalificiran', 'kontaktiran', 'sestanek', 'ponudba', 'dobljen'];
    const STATUS_NAZIV = {
      nov: 'Nov', kvalificiran: 'Kvalificiran', kontaktiran: 'Kontaktiran', sestanek: 'Sestanek',
      ponudba: 'Ponudba', dobljen: 'Dobljen', izgubljen: 'Izgubljen',
    };
    const KVAL_NAZIV = { hot: 'Hot', warm: 'Warm', cold: 'Cold' };
    const MAX_ODGOVOROV = 5;
    const SKLON_ODGOVOR = ['odgovor', 'odgovora', 'odgovori', 'odgovorov'];

    // Time as 14.05 (Slovenian), date as 6. 10. 2026.
    function ura(iso) {
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? '' : `${d.getHours()}.${String(d.getMinutes()).padStart(2, '0')}`;
    }
    const danUra = (iso) => `${formatDan(iso)}, ${ura(iso)}`;
    const danObUri = (iso) => `${formatDan(iso)} ob ${ura(iso)}`;
    const piko = (s) => /[.!?]$/.test(s) ? s : `${s}.`;

    // Initials for the company mark; legal forms are not part of the name.
    function zacetnicePodjetja(naziv) {
      const besede = String(naziv || '').replace(/\b(d\.?o\.?o\.?|s\.?p\.?|d\.?d\.?)/gi, '')
        .split(/\s+/).filter(b => /[\p{L}\d]/u.test(b) && !/^(za|in|na|v|pri|s|z|of|the|and)$/i.test(b));
      return besede.slice(0, 2).map(b => b.match(/[\p{L}\d]/u)[0].toUpperCase()).join('') || '?';
    }

    // ── Parts: before / after the workshop ──────────────────────────────
    // The questionnaire decides (questionnaires.faza, set in Vprašalniki).
    // Before: the overview card. After: the sales proposal (prepared only
    // from answers that are not before the workshop) and the task inventory.
    // Drugo: AI Business Score, intake forms. A company without any workshop
    // answer has no tabs and looks as before.
    const FAZE = [
      { id: 'pred', naziv: 'Pred delavnico', odgovori: 'Odgovori pred delavnico', prazno: 'Pred delavnico to podjetje ni oddalo nobenega odgovora.' },
      { id: 'po', naziv: 'Po delavnici', odgovori: 'Odgovori po delavnici', prazno: 'Po delavnici to podjetje še ni oddalo nobenega odgovora.' },
      { id: 'drugo', naziv: 'Drugo', odgovori: 'Drugi odgovori', prazno: 'Drugih odgovorov ni.' },
    ];
    const fazaOdgovora = (o) => (o.q_faza === 'pred' || o.q_faza === 'po' ? o.q_faza : 'drugo');
    const odgovoriFaze = (f) => (f ? odgovori.filter(o => fazaOdgovora(o) === f) : odgovori);
    const imaDelavnico = () => odgovori.some(o => o.q_faza === 'pred' || o.q_faza === 'po');

    // Both workshop parts always (an empty one says what is missing), Drugo
    // only when there is something in it.
    function vidneFaze() {
      if (!imaDelavnico()) return [];
      return FAZE.filter(f => f.id !== 'drugo' || odgovoriFaze('drugo').length);
    }

    function privzetaFaza() {
      const vidne = vidneFaze().map(f => f.id);
      if (!vidne.length) return null;
      const iz = location.hash.slice(1);
      if (vidne.includes(iz)) return iz;
      if (odgovoriFaze('po').length) return 'po';
      if (odgovoriFaze('pred').length) return 'pred';
      return vidne.includes('drugo') ? 'drugo' : 'po';
    }

    // Questionnaires with answers in one part (all of them for null).
    function vprasalniki(faza = aktivnaFaza) {
      const m = new Map();
      for (const o of odgovoriFaze(faza)) {
        if (!m.has(o.questionnaire_id)) m.set(o.questionnaire_id, { qid: o.questionnaire_id, slug: o.q_slug, naziv: o.q_naziv, faza: fazaOdgovora(o), st: 0 });
        m.get(o.questionnaire_id).st++;
      }
      return [...m.values()].sort((a, b) => b.st - a.st || a.naziv.localeCompare(b.naziv));
    }

    // ── Page skeleton ─────────────────────────────────────────────────────
    function renderStran() {
      stran.innerHTML = `
        <div id="dvojnik-mesto"></div>
        <header class="ident" id="ident"></header>
        <nav class="faze" id="faze" aria-label="Del" hidden></nav>
        <div class="record" id="record">
          <section class="panel a-doc pred" id="pred-pregled" aria-labelledby="predNaslov" hidden></section>
          <section class="panel a-doc" id="prodajni-predlog" aria-labelledby="ppNaslov"></section>
          <section class="panel a-popis popis" id="popis-opravil" aria-labelledby="popNaslov"></section>
          <div class="a-props pp-stran">
            <aside class="panel props e-side" aria-label="Lastnosti podjetja">
              ${opombeHtml()}
              <section class="prop" id="prop-kval"></section>
              <section class="prop e-sidecard" id="prop-status"></section>
            </aside>
          </div>
          <section class="panel a-answers" id="odgovori-section" aria-labelledby="odgNaslov"></section>
          <div class="stack a-meta" id="meta"></div>
        </div>`;

      const polje = document.getElementById('opombe');
      polje.addEventListener('input', () => {
        podjetje.interne_opombe = polje.value;
        nacrtujShranjevanjeOpomb();
      });
      polje.addEventListener('blur', shraniOpombe);

      renderDvojnik();
      renderIdent();
      renderPredlog();
      renderPopis();
      renderKval();
      renderStatus();
      renderFaze();
      renderMeta();
    }

    // Tabs Pred delavnico / Po delavnici (/ Drugo) and what each shows.
    function renderFaze() {
      const nav = document.getElementById('faze');
      const vidne = vidneFaze();
      nav.hidden = !vidne.length;
      nav.innerHTML = vidne.length ? `
        <div class="tabs" role="tablist" aria-label="Del">
          ${vidne.map(f => `<button class="tab${f.id === aktivnaFaza ? ' active' : ''}" type="button" role="tab" aria-selected="${f.id === aktivnaFaza}" data-del="${f.id}">${f.naziv} <span class="count">${odgovoriFaze(f.id).length}</span></button>`).join('')}
        </div>` : '';

      const f = aktivnaFaza;
      const record = document.getElementById('record');
      record.classList.toggle('is-pred', f === 'pred');
      record.classList.toggle('is-drugo', f === 'drugo');
      // No tabs: proposal and inventory as before. Po: the same. Pred: the overview.
      document.getElementById('pred-pregled').hidden = f !== 'pred';
      document.getElementById('prodajni-predlog').hidden = !(f === null || f === 'po');
      document.getElementById('popis-opravil').hidden = !(f === null || f === 'po');
      if (f === 'pred') renderPredPregled();
      renderOdgovori();
    }

    // A link to #pred / #po / #drugo on the same page switches the part too.
    window.addEventListener('hashchange', () => {
      const f = location.hash.slice(1);
      if (podjetje && f !== aktivnaFaza && vidneFaze().some(x => x.id === f)) izberiFazo(f);
    });

    function izberiFazo(f, { qid = null } = {}) {
      aktivnaFaza = f;
      const vpr = vprasalniki();
      aktivniTab = qid && vpr.some(v => v.qid === qid) ? qid : (vpr[0]?.qid ?? null);
      vsiOdgovori = false;
      if (f) history.replaceState(null, '', `${location.pathname}${location.search}#${f}`);
      renderFaze();
    }

    // ── Header ────────────────────────────────────────────────────────────
    function renderIdent() {
      const vpr = vprasalniki(null);
      document.title = `${podjetje.naziv_prikaz} · Acenta baza`;
      document.getElementById('crumb-ime').textContent = podjetje.naziv_prikaz;
      const povzetek = odgovori.length
        ? `${sklon(odgovori.length, SKLON_ODGOVOR)} · zadnji ${formatDan(podjetje.last_response_at || odgovori[0]?.submitted_at)}`
        : 'Še ni odgovorov';
      document.getElementById('ident').innerHTML = `
        <span class="ident__logo" aria-hidden="true">${esc(zacetnicePodjetja(podjetje.naziv_prikaz))}</span>
        <div class="ident__txt">
          <h1>${esc(podjetje.naziv_prikaz)}</h1>
          <div class="ident__meta">
            <span>${povzetek}</span>
            ${vpr.length ? '<span class="ident__sep" aria-hidden="true"></span>' : ''}
            ${vpr.map(v => `<a class="qlink" href="#odgovori-section" data-q="${v.qid}" title="Odgovori: ${esc(v.naziv)}"><span>${esc(v.naziv)}</span><span class="count">${v.st}</span></a>`).join('')}
          </div>
        </div>`;
    }

    // Possible duplicate: merge THIS company into the older one, or dismiss.
    function renderDvojnik() {
      const el = document.getElementById('dvojnik-mesto');
      if (!mozniDvojnik) { el.innerHTML = ''; return; }
      const razlog = podjetje.mozni_dvojnik_razlog ? ` ${esc(piko(podjetje.mozni_dvojnik_razlog))}` : '';
      el.innerHTML = `
        <div class="callout callout--warning dvojnik" id="mozni-dvojnik">
          ${ikona('alert')}
          <div>
            Verjetno isto podjetje kot <a class="link" href="/admin/company.html?id=${mozniDvojnik.id}">${esc(mozniDvojnik.naziv_prikaz)} (#${mozniDvojnik.id})</a>.${razlog}
            <div class="actions" style="margin-top:var(--space-3)">
              <button class="btn btn--primary btn--sm" type="button" id="btn-zdruzi-dvojnik">Združi v #${mozniDvojnik.id}</button>
              <button class="btn btn--secondary btn--sm" type="button" id="btn-ni-dvojnik">Ni isto podjetje</button>
            </div>
          </div>
        </div>`;
      document.getElementById('btn-zdruzi-dvojnik').addEventListener('click', zdruziZDvojnikom);
      document.getElementById('btn-ni-dvojnik').addEventListener('click', niDvojnik);
    }

    async function zdruziZDvojnikom() {
      if (!mozniDvojnik) return;
      if (!confirm(`Združiti »${podjetje.naziv_prikaz}« v »${mozniDvojnik.naziv_prikaz}«? Odgovori se prenesejo, tega ni mogoče razveljaviti.`)) return;
      const r = await apiFetch(`/api/companies/${id}/merge`, {
        method: 'POST',
        body: JSON.stringify({ target_id: mozniDvojnik.id }),
      });
      if (r?.ok) {
        window.location.href = `/admin/company.html?id=${mozniDvojnik.id}`;
      } else {
        alert('Napaka pri združevanju.');
      }
    }

    async function niDvojnik() {
      if (!await patchPodjetje({ mozni_dvojnik_id: null })) return;
      mozniDvojnik = null;
      renderDvojnik();
    }

    // ── Sales proposal ────────────────────────────────────────────────────
    // Opus reads the whole package (same as the ZIP for Claude) and writes a
    // process list for the director and a sales sheet for Matjaz. It takes a
    // few minutes on the server; the page follows it by reloading every 5 s.
    let predlogStanje = { predlog: null, tek: null, gradivo: { odgovori: 0, pred: 0, seje: 0 }, nalozeno: false };
    let predlogDok = 'direktor';      // 'direktor' | 'matjaz'
    let predlogCasovnik = null;

    const NAPAKE_PREDLOGA = {
      ni_gradiva: 'Podjetje nima ne odgovorov ne zapisov sestankov.',
      prevelik_paket: 'Gradivo je preobsežno za samodejno pripravo. Uporabite Izvoz za Claude (ZIP).',
      not_found: 'Podjetje ne obstaja več.',
    };
    const izOdgovorov = (n) => `${n} ${n === 1 ? 'odgovora' : 'odgovorov'}`;
    const izSej = (n) => `${n} ${n === 1 ? 'zapisa sestanka' : 'zapisov sestankov'}`;

    // "### 1. Rezervacije iz e-pošte (recepcija)": the department reads quieter.
    function sOddelki(html) {
      return html.replace(/(<h3[^>]*>)([\s\S]*?)\s*(\([^()<>]{1,60}\))(<\/h3>)/g, '$1$2 <span class="dept">$3</span>$4');
    }

    function renderPredlog() {
      const el = document.getElementById('prodajni-predlog');
      if (!el) return;
      const { predlog: p, tek, gradivo, nalozeno } = predlogStanje;
      const tece = tek?.status === 'pripravlja';
      const padlo = tek?.status === 'napaka' ? tek : null;
      const imaGradivo = gradivo.odgovori + gradivo.seje > 0;

      const pod = p
        ? `Pripravljeno ${formatDan(p.koncano_at || p.created_at)} iz ${izOdgovorov(p.vhod?.odgovori ?? 0)} in ${izSej(p.vhod?.seje ?? 0)}`
        : (nalozeno ? (tece ? 'Pripravlja se' : 'Še ni pripravljen') : 'Nalagam …');
      let html = `
        <header class="docp__head">
          <div class="docp__title">
            <h2 class="lbl" id="ppNaslov">Prodajni predlog</h2>
            <p class="e-feature-sub">${pod}</p>
          </div>
        </header>`;

      if (!nalozeno) {
        el.innerHTML = html + '<div class="loading" role="status"><span class="spinner" aria-hidden="true"></span>Nalagam prodajni predlog …</div>';
        return;
      }

      if (tece) {
        html += `
          <div class="docp__note" id="pp-tece">
            <div class="callout callout--info" role="status"><span class="pulse" style="margin-top:6px" aria-hidden="true"></span><div>Pripravljam ${p ? 'novo različico' : 'prodajni predlog'} (začeto ob ${ura(tek.created_at)}). AI bere ${sklon(tek.vhod?.odgovori ?? 0, ['odgovor', 'odgovora', 'odgovore', 'odgovorov'])} in ${sklon(tek.vhod?.seje ?? 0, ['zapis sestanka', 'zapisa sestankov', 'zapise sestankov', 'zapisov sestankov'])}; traja nekaj minut. Stran se osveži sama.</div></div>
          </div>`;
      }
      if (padlo) {
        html += `
          <div class="docp__note" id="pp-napaka">
            <div class="callout callout--danger" role="alert">${ikona('alert')}<div><b>Zadnja priprava ni uspela:</b> ${esc(piko(padlo.napaka || 'neznana napaka'))}${p ? ' Prejšnja različica ostaja spodaj.' : ''}</div></div>
          </div>`;
      }

      // Prepared before the split (sql/019) from all answers, including the
      // ones from before the workshop. Matjaz prepares it again when he wants.
      const predPred = gradivo.pred ?? 0;
      if (p && !p.brez_pred && predPred > 0 && !tece) {
        html += `
          <div class="docp__note" id="pp-iz-vseh">
            <div class="callout callout--warning">${ikona('alert')}<div class="pp-novi"><span><b>Pripravljeno še iz vseh odgovorov.</b> Ta predlog upošteva tudi ${sklon(predPred, ['odgovor', 'odgovora', 'odgovore', 'odgovorov'])} pred delavnico. Pripravite ga znova, da bo samo iz odgovorov po delavnici; traja nekaj minut.</span><span class="spacer"></span><button type="button" class="link" id="pp-pripravi-brez-pred">Pripravi znova</button></div></div>
          </div>`;
      }

      // New task inventories since this proposal was prepared: one line, the
      // regeneration stays Matjaz's choice (it takes a few minutes).
      const novi = p && !tece ? noviPopisi(p) : 0;
      if (novi) {
        html += `
          <div class="docp__note" id="pp-novi-popisi">
            <div class="callout callout--info">${ikona('info')}<div class="pp-novi">${esc(besediloNovih(novi))}<span class="spacer"></span><button type="button" class="link" id="pp-pripravi-novi">Pripravi znova</button></div></div>
          </div>`;
      }

      if (p) {
        const besedilo = predlogDok === 'direktor' ? p.za_direktorja : p.za_matjaza;
        const opozorila = predlogDok === 'direktor' && p.opozorila?.length ? `
          <div class="callout callout--warning" id="pp-opozorila">
            ${ikona('alert')}
            <div><b>Preverite pred pošiljanjem:</b><ul>${p.opozorila.map(o => `<li>${esc(o)}</li>`).join('')}</ul></div>
          </div>` : '';
        const zavihek = (dok, naziv) => `<button class="tab${predlogDok === dok ? ' active' : ''}" type="button" role="tab" aria-selected="${predlogDok === dok}" aria-controls="pp-dok" data-dok="${dok}">${naziv}</button>`;
        const pripravi = tece
          ? '<button class="btn btn--secondary" type="button" id="pp-pripravi" disabled><span class="spinner" aria-hidden="true"></span><span>Pripravljam …</span></button>'
          : `<button class="btn btn--secondary" type="button" id="pp-pripravi">${ikona('refresh')}<span>Pripravi znova</span></button>`;
        html += `
          <div class="docp__bar">
            <div class="tabs docp__tabs e-switch" role="tablist" aria-label="Dokument">${zavihek('direktor', 'Za direktorja')}${zavihek('matjaz', 'Za Matjaža')}</div>
            <span class="spacer"></span>
            <div class="docp__actions e-feature-actions">
              ${pripravi}
              <button class="btn btn--secondary" type="button" id="pp-kopiraj">${ikona('copy')}<span>Kopiraj</span></button>
              <a class="btn btn--primary" id="pp-pdf" href="/api/companies/${id}/prodajni-predlog/pdf" download>${ikona('printer')}<span>Natisni / PDF za direktorja</span></a>
            </div>
          </div>
          <div class="docp__body">
            ${opozorila}
            <article class="doc pp-dok" id="pp-dok" role="tabpanel">${sOddelki(md(besedilo))}</article>
          </div>`;
      } else if (tece) {
        html += `
          <div class="empty">
            <span class="empty__icon" aria-hidden="true"><span class="spinner"></span></span>
            <p class="empty__title">Prodajni predlog se pripravlja</p>
            <p class="empty__text">Ko bo pripravljen, se tu pokažeta seznam procesov za direktorja in prodajni list za Matjaža.</p>
          </div>`;
      } else if (!imaGradivo && predPred > 0) {
        // Only answers from before the workshop: they are not used for the proposal.
        html += `
          <div class="empty e-reco-prazno" id="pp-caka-po">
            <span class="empty__icon" aria-hidden="true">${ikona('sparkles', 'icon--lg')}</span>
            <b class="empty__title">Predlog se pripravi iz odgovorov po delavnici</b>
            <p class="empty__text">To podjetje jih še nima. Odgovori pred delavnico (${predPred}) so v zavihku Pred delavnico.</p>
          </div>`;
      } else {
        const odgBesedilo = predPred > 0
          ? `odgovore po delavnici (${gradivo.odgovori})`
          : `vse odgovore tega podjetja (${gradivo.odgovori})`;
        html += `
          <div class="empty e-reco-prazno">
            <span class="empty__icon" aria-hidden="true">${ikona('sparkles', 'icon--lg')}</span>
            <b class="empty__title">Prodajni predlog še ni pripravljen</b>
            <p class="empty__text">AI prebere ${odgBesedilo}, zapise sestankov (${gradivo.seje}), interne opombe in katalog rešitev ter pripravi seznam procesov za direktorja in prodajni list za Matjaža. Traja nekaj minut.</p>
            ${imaGradivo
              ? `<button class="btn btn--primary" type="button" id="pp-pripravi">${ikona('sparkles')}<span>Pripravi prodajni predlog</span></button>`
              : '<p class="empty__text">Za predlog potrebujemo vsaj en odgovor ali zapis sestanka.</p>'}
          </div>`;
      }

      el.innerHTML = html;
      document.getElementById('pp-pripravi')?.addEventListener('click', (e) => pripraviPredlog(e.currentTarget));
      document.getElementById('pp-kopiraj')?.addEventListener('click', (e) => kopirajPredlog(e.currentTarget));
      document.getElementById('pp-pripravi-novi')?.addEventListener('click', () => document.getElementById('pp-pripravi')?.click());
      document.getElementById('pp-pripravi-brez-pred')?.addEventListener('click', () => document.getElementById('pp-pripravi')?.click());
    }

    async function naloziPredlog() {
      const r = await apiFetch(`/api/companies/${id}/prodajni-predlog`);
      if (!r) {
        if (!predlogStanje.nalozeno) {
          const el = document.getElementById('prodajni-predlog');
          if (el) el.innerHTML = `<header class="docp__head"><div class="docp__title"><h2 class="lbl" id="ppNaslov">Prodajni predlog</h2></div></header>
            <div class="docp__note"><div class="callout callout--danger" role="alert">${ikona('alert')}<div>Prodajnega predloga ni bilo mogoče naložiti. Osvežite stran.</div></div></div>`;
        }
        return false;
      }
      predlogStanje = { ...r, nalozeno: true };
      renderPredlog();
      spremljajPredlog();
      return true;
    }

    function spremljajPredlog() {
      clearTimeout(predlogCasovnik);
      if (predlogStanje.tek?.status === 'pripravlja') predlogCasovnik = setTimeout(naloziPredlog, 5000);
    }

    async function pripraviPredlog(gumb) {
      if (predlogStanje.predlog && !confirm('Pripraviti nov prodajni predlog? Trenutni ostane viden, dokler novi ni pripravljen.')) return;
      const oznaka = gumb.querySelector('span');
      const besedilo = oznaka.textContent;
      gumb.disabled = true;
      oznaka.textContent = 'Zbiram gradivo …';
      try {
        // Same package as the ZIP: questions of custom_html forms can only be
        // extracted in the browser (DOMParser).
        const data = await apiFetch(`/api/companies/${id}/izvoz`);
        if (!data?.company) throw new Error('strežnik ni vrnil podatkov');
        const { sestaviDatoteke } = await import('/admin/izvoz.js');
        const datoteke = sestaviDatoteke(data, { vprasanjaZa: vprasanjaZaPrikaz, izpolnjevalec });
        const res = await fetch(`/api/companies/${id}/prodajni-predlog`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ datoteke }),
        });
        const r = await res.json().catch(() => ({}));
        if (res.status === 409) { await naloziPredlog(); return; }
        if (!res.ok) throw new Error(NAPAKE_PREDLOGA[r.error] || r.error || `HTTP ${res.status}`);
        predlogStanje.tek = r.tek;
        renderPredlog();
        spremljajPredlog();
      } catch (err) {
        console.error('[prodajni-predlog]', err);
        alert(`Priprava ni uspela: ${err.message}`);
        gumb.disabled = false;
        oznaka.textContent = besedilo;
      }
    }

    async function kopirajPredlog(gumb) {
      const p = predlogStanje.predlog;
      if (!p) return;
      const oznaka = gumb.querySelector('span');
      try {
        await navigator.clipboard.writeText(predlogDok === 'direktor' ? p.za_direktorja : p.za_matjaza);
        oznaka.textContent = 'Kopirano';
      } catch {
        oznaka.textContent = 'Kopiranje ni uspelo';
      }
      setTimeout(() => { oznaka.textContent = 'Kopiraj'; }, 1600);
    }

    // ── Task inventory (Popis opravil) ────────────────────────────────────
    // Employees describe up to three recurring tasks on the company's own link
    // (/popis/<code>); hours per month come from public/admin/popis.js, the
    // same rule the sales proposal uses.
    let P = null;   // public/admin/popis.js, loaded at start

    const popisOdgovori = () => (P ? odgovori.filter(o => o.q_slug === P.POPIS_SLUG) : []);

    function noviPopisi(predlog) {
      const od = new Date(predlog.created_at).getTime();
      return popisOdgovori().filter(o => new Date(o.submitted_at).getTime() > od).length;
    }

    function besediloNovih(n) {
      const d = n % 100;
      if (d === 1) return `Od zadnje priprave je prišel ${n} nov odgovor na Popis opravil.`;
      if (d === 2) return `Od zadnje priprave sta prišla ${n} nova odgovora na Popis opravil.`;
      if (d === 3 || d === 4) return `Od zadnje priprave so prišli ${n} novi odgovori na Popis opravil.`;
      return `Od zadnje priprave je prišlo ${n} novih odgovorov na Popis opravil.`;
    }

    // Public link: on the admin host (nacrt-admin.*) the clean nacrt.* host.
    function popisPovezava() {
      const h = window.location.host;
      const javni = h.startsWith('nacrt-admin.') ? h.replace('nacrt-admin.', 'nacrt.') : h;
      return `${window.location.protocol}//${javni}/popis/${podjetje.popis_koda}`;
    }

    // "12. 10." this year, "12. 10. 2025" otherwise.
    function kratekDan(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '';
      return d.getFullYear() === new Date().getFullYear() ? `${d.getDate()}. ${d.getMonth() + 1}.` : formatDan(iso);
    }

    function renderPopis() {
      const el = document.getElementById('popis-opravil');
      if (!el || !P) return;
      const odg = popisOdgovori();
      const opravila = P.opravilaPodjetja(odg).sort((a, b) => b.minut - a.minut || a.oznaka.localeCompare(b.oznaka, 'sl', { numeric: true }));
      const povezava = popisPovezava();
      const kopiraj = `<button class="btn btn--primary" type="button" id="popis-kopiraj">${ikona('copy')}<span>Kopiraj povezavo za zaposlene</span></button>`;

      if (!odg.length) {
        el.innerHTML = `
          <header class="popis__head">
            <div class="popis__title"><h2 class="lbl" id="popNaslov">Popis opravil</h2></div>
            <div class="popis__acts">${kopiraj}</div>
          </header>
          <p class="popis__empty">Še noben zaposleni ni izpolnil popisa. Kopirajte povezavo in jo pošljite direktorju, da jo posreduje zaposlenim.</p>
          <div class="popis__sum"><code class="popis__link" id="popis-povezava" title="${esc(povezava)}" hidden>${esc(povezava)}</code></div>`;
      } else {
        const zadnji = odg.reduce((m, o) => (new Date(o.submitted_at) > new Date(m) ? o.submitted_at : m), odg[0].submitted_at);
        const vrstice = opravila.map(o => {
          const kdo = o.ime || 'brez imena';
          const ure = P.ureNaMesec(o.minut);
          const prikazUr = o.minut > 0 && ure < 1 ? '<1' : String(ure);
          const url = `/admin/response.html?id=${o.responseId}`;
          return `
            <tr class="is-link" data-href="${url}">
              <td>
                <a class="popis__opis" href="${url}" title="${esc(o.opis)}">${esc(o.opis)}</a>
                <span class="table__sub hide-m">${esc([o.oddelek, kdo].filter(Boolean).join(' · '))}</span>
                <span class="table__sub only-m">${esc([o.oddelek, o.pogostost, o.cas].filter(Boolean).join(' · '))}</span>
              </td>
              <td class="popis__c-pog">${esc(o.pogostost)}</td>
              <td class="popis__c-cas">${esc(o.cas)}</td>
              <td class="is-num popis__c-ure"><span class="popis__ure">${prikazUr}</span><span class="popis__enota">ur</span></td>
            </tr>`;
        }).join('');
        el.innerHTML = `
          <header class="popis__head">
            <div class="popis__title">
              <h2 class="lbl" id="popNaslov">Popis opravil</h2>
              <p>${sklon(odg.length, P.ODGOVORI)} · ${sklon(opravila.length, P.OPRAVILA)} · zadnji ${kratekDan(zadnji)}</p>
            </div>
            <div class="popis__acts">
              ${kopiraj}
              <button class="btn btn--secondary" type="button" id="popis-zamenjaj" title="Nova povezava; stara takoj preneha delovati">${ikona('refresh')}<span>Zamenjaj povezavo</span></button>
            </div>
          </header>
          <div class="popis__sum">
            <div class="popis__total" id="popis-skupaj">Skupaj ${esc(P.besediloUr(P.skupajMinut(opravila)))}</div>
            <code class="popis__link" id="popis-povezava" title="${esc(povezava)}">${esc(povezava)}</code>
          </div>
          <div class="table-scroll">
            <table class="table" id="popis-tabela">
              <thead><tr>
                <th>Opravilo</th>
                <th class="popis__c-pog">Kako pogosto</th>
                <th class="popis__c-cas">Čas vsakič</th>
                <th class="is-num popis__c-ure">Ur na mesec</th>
              </tr></thead>
              <tbody>${vrstice}</tbody>
            </table>
          </div>`;
        el.querySelector('#popis-tabela').addEventListener('click', (e) => {
          if (e.target.closest('a')) return;
          const tr = e.target.closest('tr[data-href]');
          if (tr) window.location.href = tr.dataset.href;
        });
        document.getElementById('popis-zamenjaj').addEventListener('click', (e) => zamenjajPovezavo(e.currentTarget));
      }
      document.getElementById('popis-kopiraj').addEventListener('click', (e) => kopirajPovezavo(e.currentTarget));
    }

    async function kopirajPovezavo(gumb) {
      const oznaka = gumb.querySelector('span');
      try {
        await navigator.clipboard.writeText(popisPovezava());
        oznaka.textContent = 'Povezava kopirana';
      } catch {
        // Without clipboard access the link is shown so it can be copied by hand.
        document.getElementById('popis-povezava').hidden = false;
        oznaka.textContent = 'Kopirajte jo spodaj';
      }
      setTimeout(() => { oznaka.textContent = 'Kopiraj povezavo za zaposlene'; }, 2000);
    }

    async function zamenjajPovezavo(gumb) {
      if (!confirm('Zamenjati povezavo? Stara povezava takoj preneha delovati; zaposleni, ki popisa še niso izpolnili, bodo potrebovali novo. Oddani odgovori ostanejo.')) return;
      gumb.disabled = true;
      const r = await apiFetch(`/api/companies/${id}/popis-koda`, { method: 'POST' });
      gumb.disabled = false;
      if (!r?.popis_koda) { alert('Zamenjava povezave ni uspela. Poskusite znova.'); return; }
      podjetje.popis_koda = r.popis_koda;
      renderPopis();
      const nova = document.getElementById('popis-povezava');
      nova?.classList.add('is-nova');
    }

    // ── Internal notes ────────────────────────────────────────────────────
    // What we know (e.g. "they already pay for Claude"). Goes into the sales
    // proposal and the ZIP as a fact; the client never sees it. Saved after a
    // pause in typing and when the field loses focus. The text lives in
    // `podjetje`, so re-rendering the other properties never loses it.
    let opombeCasovnik = null;
    let opombeShranjene = '';     // last saved text (set on load)

    function stanjeOpomb() {
      if (!podjetje.interne_opombe_updated_at) return 'Še ni opomb';
      return `Shranjeno ${danObUri(podjetje.interne_opombe_updated_at)}`;
    }

    function opombeHtml() {
      return `
        <section class="prop" id="prop-opombe">
          <div class="prop__head">
            <label class="prop__label" for="opombe">Interne opombe</label>
            <span class="chip">${ikona('lock')}samo za nas</span>
          </div>
          <textarea class="textarea" id="opombe" rows="5" maxlength="5000"
            placeholder="Kar veva o podjetju: katera orodja že imajo, kdo odloča, kaj smo že rešili …">${esc(podjetje.interne_opombe || '')}</textarea>
          <p class="prop__foot" id="opombe-stanje" aria-live="polite">${stanjeOpomb()}</p>
        </section>`;
    }

    function nacrtujShranjevanjeOpomb() {
      clearTimeout(opombeCasovnik);
      const el = document.getElementById('opombe-stanje');
      if (el) el.textContent = 'Neshranjeno …';
      opombeCasovnik = setTimeout(shraniOpombe, 900);
    }

    async function shraniOpombe() {
      clearTimeout(opombeCasovnik);
      const besedilo = podjetje.interne_opombe || '';
      if (besedilo === opombeShranjene) return;
      const el = document.getElementById('opombe-stanje');
      if (el) el.textContent = 'Shranjujem …';
      const r = await apiFetch(`/api/companies/${id}`, {
        method: 'PATCH', body: JSON.stringify({ interne_opombe: besedilo }),
      });
      if (!r?.ok) { if (el) el.textContent = 'Shranjevanje ni uspelo, poskusite znova'; return; }
      opombeShranjene = besedilo;
      podjetje.interne_opombe_updated_at = r.company.interne_opombe_updated_at;
      if (el && (podjetje.interne_opombe || '') === besedilo) el.textContent = stanjeOpomb();
    }

    // Warn when the page closes with unsaved notes.
    window.addEventListener('beforeunload', (e) => {
      if (podjetje && (podjetje.interne_opombe || '') !== opombeShranjene) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    // ── Lead score ────────────────────────────────────────────────────────
    // One choice: Hot / Warm / Cold set by hand, or "AI" (the AI decides).
    // The AI segment shows the AI value only while the score is not manual.
    function renderKval() {
      const k = podjetje.kvalifikacija;
      const rocna = !!podjetje.kvalifikacija_rocna;
      const vir = !k ? ['chip', 'Še ni ocenjeno'] : rocna ? ['chip', 'Ročno'] : ['chip chip--accent', 'Ocenil AI'];
      const izbran = (v) => (v === 'ai' ? !rocna : rocna && k === v);
      const gumb = (v, vsebina, title = '') => `<button class="seg__item seg__item--${v}${izbran(v) ? ' active' : ''}" type="button" role="radio" aria-checked="${izbran(v)}" data-kval="${v}"${title ? ` title="${title}"` : ''}>${vsebina}</button>`;
      const ai = !rocna && k ? `AI<span class="seg-dot seg-dot--${k}" aria-hidden="true"></span>${KVAL_NAZIV[k] || esc(k)}` : 'AI';
      document.getElementById('prop-kval').innerHTML = `
        <div class="prop__head">
          <span class="prop__label" id="kvalLbl">Ocena leada</span>
          <span class="${vir[0]}">${vir[1]}</span>
        </div>
        <div class="seg seg--block" role="radiogroup" aria-labelledby="kvalLbl">
          ${gumb('hot', 'Hot')}${gumb('warm', 'Warm')}${gumb('cold', 'Cold')}${gumb('ai', ai, 'Prepusti oceno AI (ponastavi ročno)')}
        </div>
        ${podjetje.kvalifikacija_razlog ? `<p class="prop__note">${esc(podjetje.kvalifikacija_razlog)}</p>` : ''}`;
    }

    document.addEventListener('click', (e) => {
      const b = e.target.closest('#prop-kval [data-kval]');
      if (b) nastaviKval(b.dataset.kval === 'ai' ? null : b.dataset.kval);
    });

    // ── Sales status ──────────────────────────────────────────────────────
    function renderStatus() {
      const s = podjetje.status || 'nov';
      const ix = LIJAK.indexOf(s);
      const izgubljen = s === 'izgubljen';
      const crte = LIJAK.map((_, i) => `<i class="${izgubljen ? '' : i < ix ? 'is-done' : i === ix ? 'is-current' : ''}"></i>`).join('');
      const opts = [...LIJAK, 'izgubljen'].map(v =>
        `<option value="${v}"${v === s ? ' selected' : ''}>${STATUS_NAZIV[v]}</option>`).join('');
      document.getElementById('prop-status').innerHTML = `
        <div class="prop__head">
          <label class="prop__label" for="status">Prodajni status</label>
          <span class="prop__meta">${izgubljen ? 'Izgubljen' : `${ix + 1} od ${LIJAK.length} faz`}</span>
        </div>
        <span class="select-wrap">
          <select class="select e-select" id="status">${opts}</select>
        </span>
        <div class="steps${izgubljen ? ' steps--lost' : ''}" aria-hidden="true">${crte}</div>
        ${podjetje.status_updated_at ? `<p class="prop__foot">Spremenjeno ${formatDan(podjetje.status_updated_at)}</p>` : ''}`;
      document.getElementById('status').addEventListener('change', (e) => nastaviStatus(e.target.value, e.target));
    }

    // ── Before the workshop: overview card ───────────────────────────────
    // Left: how advanced they are, computed in public/admin/pred.js from the
    // self-ratings (no AI). Right: what takes their time, themes prepared by
    // AI on the server; the page asks for them by itself when they are
    // missing or made from other answers than there are now.
    let R = null;   // public/admin/pred.js, loaded at start
    let predTeme = { nalozeno: false, teme: null, odgovori_pred: 0, aktualno: false };
    let predTemeCasovnik = null;
    let predTemeSamodejno = false;   // asked once per page view

    // "21.–24. 8. 2026", "28. 8.–3. 9. 2026", one day as "24. 8. 2026".
    function obdobje(datumi) {
      const d = datumi.map(x => new Date(x)).filter(x => !Number.isNaN(x.getTime())).sort((a, b) => a - b);
      if (!d.length) return '';
      const [a, b] = [d[0], d.at(-1)];
      const dan = (x) => `${x.getDate()}.`;
      const mes = (x) => `${x.getMonth() + 1}.`;
      if (a.toDateString() === b.toDateString()) return `${dan(a)} ${mes(a)} ${a.getFullYear()}`;
      if (a.getFullYear() !== b.getFullYear()) return `${dan(a)} ${mes(a)} ${a.getFullYear()}–${dan(b)} ${mes(b)} ${b.getFullYear()}`;
      if (a.getMonth() !== b.getMonth()) return `${dan(a)} ${mes(a)}–${dan(b)} ${mes(b)} ${b.getFullYear()}`;
      return `${dan(a)}–${dan(b)} ${mes(b)} ${b.getFullYear()}`;
    }

    function ravenHtml(raven) {
      if (!raven) {
        return `
          <h3 class="pred__h">Kako napredni so</h3>
          <p class="pred__prazno">Raven se izračuna iz samoocen v anketi »AI delavnica — pred izobraževanjem«. To podjetje nanjo ni odgovarjalo.</p>`;
      }
      const vrstica = (p) => p.povprecje === null ? '' : `
        <div class="bar-row"><span class="ellipsis">${esc(p.naziv)}</span><span class="progress"><span class="progress__fill${p.povprecje < 2.5 ? ' progress__fill--low' : ''}" style="width:${Math.round(p.povprecje / 4 * 100)}%"></span></span><b>${R.decimalno(p.povprecje)}</b></div>`;
      const cip = (x, off = false) => `<span class="chip${off ? ' chip--off' : ''}">${esc(x.naziv)}<b>${x.st}</b></span>`;
      const kdo = raven.ocenilo === 1 ? '1 udeleženca' : `${raven.ocenilo} udeležencev`;
      return `
        <h3 class="pred__h">Kako napredni so</h3>
        <div class="pred__raven">
          <span class="pred__ocena">${R.decimalno(raven.povprecje)}</span><span class="pred__od">od 4</span>
          <span class="chip chip--${raven.ton}">${esc(raven.stopnja)}</span>
        </div>
        <p class="pred__opis">Povprečje samoocen ${kdo} (1 = slabo, 4 = zelo dobro).${raven.najsibkejsa.length ? ` ${esc(R.besediloNajsibkejsih(raven.najsibkejsa))}` : ''}</p>
        ${raven.podrocja.map(vrstica).join('')}
        <h4 class="pred__h4">Kako pogosto uporabljajo AI</h4>
        <div class="chips">${raven.pogostost.map(p => cip(p, p.st === 0)).join('')}</div>
        <h4 class="pred__h4">Orodja, ki jih omenjajo</h4>
        ${raven.orodja.length ? `<div class="chips">${raven.orodja.map(o => cip(o)).join('')}</div>` : '<p class="pred__prazno">Nobenega orodja niso omenili.</p>'}`;
    }

    function temeHtml() {
      const { nalozeno, teme: t } = predTeme;
      const glava = `
        <h3 class="pred__h">Kaj jim vzame največ časa</h3>
        <p class="pred__vir">Kar bi najraje prepustili AI, združeno po temah. Številka pove, koliko ljudi je to navedlo.</p>`;
      if (!nalozeno) return `${glava}<div class="loading" role="status"><span class="spinner" aria-hidden="true"></span>Nalagam …</div>`;

      const tece = !t || t.status === 'pripravlja';
      const imaStare = !!t?.koncano_at;
      let stanje = '';
      if (tece) {
        stanje = `<div class="callout callout--info pred__stanje" role="status" id="pred-teme-tece"><span class="pulse" style="margin-top:6px" aria-hidden="true"></span><div>${imaStare ? 'Pripravljam novo različico iz vseh odgovorov.' : 'AI pripravlja teme iz odgovorov.'} Traja nekaj sekund, stran se osveži sama.</div></div>`;
      } else if (t.status === 'napaka') {
        stanje = `<div class="callout callout--danger pred__stanje" role="alert" id="pred-teme-napaka">${ikona('alert')}<div><b>Priprava tem ni uspela:</b> ${esc(piko(t.napaka || 'neznana napaka'))}</div></div>`;
      }
      if (!imaStare) return glava + stanje;

      const seznam = t.teme?.length
        ? `<ol class="teme">${t.teme.map(x => `
            <li>
              <div class="teme__vrh"><b>${esc(x.naziv)}</b><span class="count" title="Toliko ljudi je to navedlo">${x.odgovori.length}</span></div>
              <a class="teme__citat" href="/admin/response.html?id=${x.citat_odgovor}" title="Odpri odgovor">»${esc(x.citat)}«</a>
            </li>`).join('')}</ol>`
        : '<p class="pred__prazno">Nihče ni navedel opravila, ki bi ga lahko prepustili AI.</p>';
      return glava + stanje + seznam;
    }

    function renderPredPregled() {
      const el = document.getElementById('pred-pregled');
      if (!el || !R) return;
      const odg = odgovoriFaze('pred');
      const glava = (pod) => `
        <header class="docp__head">
          <div class="docp__title">
            <h2 class="lbl" id="predNaslov">Pregled pred delavnico</h2>
            ${pod ? `<p>${pod}</p>` : ''}
          </div>
        </header>`;
      if (!odg.length) {
        el.innerHTML = glava('') + `
          <div class="empty">
            <span class="empty__icon" aria-hidden="true">${ikona('inbox', 'icon--lg')}</span>
            <b class="empty__title">Ni odgovorov pred delavnico</b>
            <p class="empty__text">Ko zaposleni izpolnijo anketo pred delavnico, se tu pokaže, kako napredni so in kaj jim vzame največ časa.</p>
          </div>`;
        return;
      }
      const imena = [...new Set(odg.map(o => o.q_naziv))].map(x => `»${esc(x)}«`).join(' in ');
      const pod = `Iz ${sklon(odg.length, ['odgovora', 'odgovorov', 'odgovorov', 'odgovorov'])} na ${imena} · ${obdobje(odg.map(o => o.submitted_at))}`;
      const t = predTeme.teme;
      const brez = t?.koncano_at && t.status !== 'pripravlja' ? t.brez_opravil : null;
      const noga = predTeme.nalozeno && t?.koncano_at ? `
        <footer class="pred__foot">
          <span>${brez ? `${brez} od ${t.odgovori.length} ${t.odgovori.length === 1 ? 'odgovora ni' : 'odgovorov ni'} v nobeni temi. ` : ''}Teme je pripravil AI ${danUra(t.koncano_at)}.</span>
          <span class="spacer"></span>
          <button class="btn btn--secondary btn--sm" type="button" id="pred-teme-znova"${t.status === 'pripravlja' ? ' disabled' : ''}>${ikona('refresh')}<span>Pripravi znova</span></button>
        </footer>` : (predTeme.nalozeno && t?.status === 'napaka' ? `
        <footer class="pred__foot"><span class="spacer"></span><button class="btn btn--secondary btn--sm" type="button" id="pred-teme-znova">${ikona('refresh')}<span>Pripravi znova</span></button></footer>` : '');

      el.innerHTML = glava(pod) + `
        <div class="pred__grid">
          <section class="pred__blok" aria-label="Kako napredni so">${ravenHtml(R.ravenZnanja(odg))}</section>
          <section class="pred__blok" aria-label="Kaj jim vzame največ časa">${temeHtml()}</section>
        </div>${noga}`;
      document.getElementById('pred-teme-znova')?.addEventListener('click', (e) => pripraviPredTeme(e.currentTarget));
    }

    async function naloziPredTeme() {
      if (!odgovoriFaze('pred').length) return;
      const r = await apiFetch(`/api/companies/${id}/pred-teme`);
      if (!r) return;
      predTeme = { ...r, nalozeno: true };
      // Automatic: no themes yet, or made from other answers than there are now.
      const t = r.teme;
      const zastarele = t && t.status === 'ok' && !r.aktualno;
      if (!predTemeSamodejno && r.odgovori_pred > 0 && (!t || zastarele)) {
        predTemeSamodejno = true;
        await pripraviPredTeme(null);
        return;
      }
      if (aktivnaFaza === 'pred') renderPredPregled();
      clearTimeout(predTemeCasovnik);
      if (t?.status === 'pripravlja') predTemeCasovnik = setTimeout(naloziPredTeme, 4000);
    }

    async function pripraviPredTeme(gumb) {
      if (gumb) gumb.disabled = true;
      const res = await fetch(`/api/companies/${id}/pred-teme`, { method: 'POST' }).catch(() => null);
      const r = res ? await res.json().catch(() => null) : null;
      if (res?.status === 202 && r) {
        predTeme = { ...r, nalozeno: true };
      } else if (res?.status !== 409) {
        if (gumb) { gumb.disabled = false; alert('Priprave tem ni bilo mogoče začeti. Poskusite znova.'); }
      }
      if (aktivnaFaza === 'pred') renderPredPregled();
      clearTimeout(predTemeCasovnik);
      predTemeCasovnik = setTimeout(naloziPredTeme, 4000);
    }

    // ── Answers by respondent ─────────────────────────────────────────────
    function renderOdgovori() {
      const el = document.getElementById('odgovori-section');
      const vpr = vprasalniki();
      const faza = FAZE.find(f => f.id === aktivnaFaza);
      // One questionnaire in the part: its name instead of tabs.
      const opis = vpr.length === 1
        ? `${esc(vpr[0].naziv)} · ${sklon(vpr[0].st, SKLON_ODGOVOR)}`
        : 'Ena vrstica je en izpolnjevalec. Povzetek pripravi AI, celoten vprašalnik je en klik stran.';
      const glava = `
        <header class="panel__head panel__head--plain" style="flex-wrap:wrap">
          <div style="min-width:0">
            <h2 class="panel__title" id="odgNaslov">${faza ? faza.odgovori : 'Odgovori'}</h2>
            <p class="panel__desc">${opis}</p>
          </div>
        </header>`;
      if (!vpr.length) {
        el.innerHTML = glava + `<p class="empty-line">${faza ? faza.prazno : 'Podjetje še nima odgovorov.'}</p>`;
        return;
      }
      if (!vpr.some(v => v.qid === aktivniTab)) aktivniTab = vpr[0].qid;
      const odgZaTab = odgovori.filter(o => o.questionnaire_id === aktivniTab);
      const prikazani = vsiOdgovori ? odgZaTab : odgZaTab.slice(0, MAX_ODGOVOROV);

      const vrstice = prikazani.map(r => {
        const oseba = izpolnjevalec(r.raw_data, r.vprasanja);
        const meta = [esc(oseba.podnaslov), `<span class="nowrap">${danUra(r.submitted_at)}</span>`].filter(x => x && x !== '').join(' · ');
        const povzetek = r.ai_povzetek
          ? `<div class="resp__sum" data-odg="${r.id}">${md(r.ai_povzetek)}</div>
             <button class="link sum-more" type="button" data-za="${r.id}" aria-expanded="false" hidden>Pokaži celoten povzetek</button>`
          : '<p class="resp__none">AI povzetek še ni generiran.</p>';
        return `
          <article class="resp" data-response="${r.id}">
            <span class="avatar avatar--lg${oseba.imaIme ? '' : ' avatar--anon'}" aria-hidden="true">${esc(oseba.zacetnice)}</span>
            <div style="min-width:0">
              <h3 class="odg-ime">${esc(oseba.ime)}</h3>
              <p class="resp__meta">${meta}</p>
              ${povzetek}
            </div>
            <a class="btn btn--secondary btn--sm resp__open btn-odpri" href="/admin/response.html?id=${r.id}"><span>Odpri vprašalnik</span>${ikona('arrow-right', 'icon--sm')}</a>
          </article>`;
      }).join('');

      const zavihki = vpr.map(v => `<button class="tab${v.qid === aktivniTab ? ' active' : ''}" type="button" role="tab" aria-selected="${v.qid === aktivniTab}" data-tab="${v.qid}">${esc(v.naziv)} <span class="count">${v.st}</span></button>`).join('');

      el.innerHTML = `
        ${glava}
        ${vpr.length > 1 ? `<div class="tabs odg-tabs" role="tablist" aria-label="Vprašalnik">${zavihki}</div>` : '<div style="height:var(--space-3)"></div>'}
        ${vrstice || '<p class="empty-line">Za ta vprašalnik ni odgovorov.</p>'}
        ${odgZaTab.length > MAX_ODGOVOROV ? `
          <footer class="panel__foot">
            <span>Prikazanih ${prikazani.length} od ${odgZaTab.length}</span>
            <span class="spacer"></span>
            <button class="btn btn--secondary btn--sm" type="button" id="odg-vse" aria-expanded="${vsiOdgovori}">${vsiOdgovori ? 'Pokaži manj' : `Pokaži vse (${odgZaTab.length})`}</button>
          </footer>` : ''}`;

      document.getElementById('odg-vse')?.addEventListener('click', () => {
        vsiOdgovori = !vsiOdgovori;
        renderOdgovori();
        document.getElementById('odg-vse')?.focus();
      });
      preveriPovzetke();
    }

    // A long summary is folded to three lines; the button shows only when
    // the text is really cut.
    function preveriPovzetke() {
      document.querySelectorAll('.resp__sum').forEach(s => {
        const g = document.querySelector(`.sum-more[data-za="${s.dataset.odg}"]`);
        if (!g || s.classList.contains('is-open')) return;
        const zlozena = s.offsetHeight;
        s.classList.add('is-open');
        const polna = s.offsetHeight;
        s.classList.remove('is-open');
        g.hidden = polna <= zlozena + 2;
      });
    }
    document.addEventListener('click', (e) => {
      const g = e.target.closest('.sum-more');
      if (!g) return;
      const s = document.querySelector(`.resp__sum[data-odg="${g.dataset.za}"]`);
      const odpri = !s.classList.contains('is-open');
      s.classList.toggle('is-open', odpri);
      g.textContent = odpri ? 'Skrij' : 'Pokaži celoten povzetek';
      g.setAttribute('aria-expanded', String(odpri));
    });
    window.addEventListener('resize', debounce(preveriPovzetke, 150));
    document.fonts?.ready.then(preveriPovzetke);

    // ── Side column below: per questionnaire, management ──────────────────
    function renderMeta() {
      const vpr = vprasalniki(null);
      const najvec = Math.max(1, ...vpr.map(v => v.st));
      document.getElementById('meta').innerHTML = `
        ${vpr.length ? `
          <section class="panel">
            <header class="panel__head panel__head--plain"><h2 class="panel__title">Po vprašalnikih</h2></header>
            <div class="panel__body">
              ${vpr.map(v => `<div class="bar-row" title="${esc(v.naziv)}: ${v.st}"><span class="ellipsis">${esc(v.naziv)}</span><span class="progress"><span class="progress__fill" style="width:${Math.round(v.st / najvec * 100)}%"></span></span><b>${v.st}</b></div>`).join('')}
            </div>
          </section>` : ''}
        <section class="panel">
          <header class="panel__head panel__head--plain"><h2 class="panel__title">Upravljanje</h2></header>
          <div class="panel__body">
            <p class="panel__desc">Združitev podvojenih podjetij in GDPR izbris vseh podatkov. Obojega ni mogoče razveljaviti.</p>
            <div class="actions" style="margin-top:var(--space-3)">
              <button class="btn btn--secondary btn--sm" type="button" id="btn-merge">${ikona('merge')}<span>Združi z drugim podjetjem</span></button>
              <button class="btn btn--danger btn--sm" type="button" id="btn-gdpr">${ikona('trash')}<span>GDPR izbris</span></button>
            </div>
            <dl class="kv kv--meta">
              <div><dt title="Normaliziran naziv, po katerem se združujejo odgovori">Normaliziran naziv</dt><dd title="${esc(podjetje.naziv_normaliziran)}">${esc(podjetje.naziv_normaliziran)}</dd></div>
            </dl>
          </div>
        </section>`;
      document.getElementById('btn-merge').addEventListener('click', odpriMerge);
      document.getElementById('btn-gdpr').addEventListener('click', izbrisiPodjetje);
    }

    // One questionnaire in the answers list of the active part.
    function izberiTab(qid) {
      if (qid === aktivniTab) return;
      aktivniTab = qid;
      vsiOdgovori = false;
      renderOdgovori();
    }

    // Part tabs, questionnaire links in the header, answer tabs.
    stran.addEventListener('click', (e) => {
      const dok = e.target.closest('[data-dok]');
      if (dok) {
        if (dok.dataset.dok === predlogDok) return;
        predlogDok = dok.dataset.dok;
        renderPredlog();
        document.querySelector(`#prodajni-predlog [data-dok="${predlogDok}"]`)?.focus();
        return;
      }
      const del = e.target.closest('[data-del]');
      if (del) {
        if (del.dataset.del !== aktivnaFaza) izberiFazo(del.dataset.del);
        document.querySelector(`#faze [data-del="${aktivnaFaza}"]`)?.focus();
        return;
      }
      // Header link: the part of that questionnaire, its answers.
      const q = e.target.closest('[data-q]');
      if (q) {
        e.preventDefault();
        const qid = Number(q.dataset.q);
        const v = vprasalniki(null).find(x => x.qid === qid);
        if (aktivnaFaza !== null && v && v.faza !== aktivnaFaza) izberiFazo(v.faza, { qid });
        else izberiTab(qid);
        document.getElementById('odgovori-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      const el = e.target.closest('#odgovori-section [data-tab]');
      if (!el) return;
      e.preventDefault();
      const qid = Number(el.dataset.tab);
      izberiTab(qid);
      document.querySelector(`#odgovori-section .tab[data-tab="${qid}"]`)?.focus();
    });

    // ── Actions ───────────────────────────────────────────────────────────
    async function patchPodjetje(telo) {
      const r = await apiFetch(`/api/companies/${id}`, { method: 'PATCH', body: JSON.stringify(telo) });
      if (!r?.ok) { alert('Napaka pri shranjevanju.'); return false; }
      // Never take the notes from this response: it may carry older text
      // than the one being saved right now (see shraniOpombe).
      const { interne_opombe, interne_opombe_updated_at, ...ostalo } = r.company;
      Object.assign(podjetje, ostalo);
      return true;
    }

    async function nastaviKval(v) {
      if (v === null && !podjetje.kvalifikacija_rocna) return;
      if (v !== null && v === podjetje.kvalifikacija && podjetje.kvalifikacija_rocna) return;
      if (await patchPodjetje({ kvalifikacija: v })) {
        renderKval();
        document.querySelector(`#prop-kval [data-kval="${v ?? 'ai'}"]`)?.focus();
      }
    }

    async function nastaviStatus(s, el) {
      el.disabled = true;
      const ok = await patchPodjetje({ status: s });
      el.disabled = false;
      if (!ok) { el.value = podjetje.status; return; }
      renderStatus();
    }

    // Package for Claude: the server gives the data, the questions of
    // custom_html forms are extracted here (DOMParser, same code as on the
    // answer page).
    async function izvoziZaClaude(gumb) {
      gumb.disabled = true;
      gumb.classList.add('is-loading');
      gumb.setAttribute('aria-busy', 'true');
      try {
        const data = await apiFetch(`/api/companies/${id}/izvoz`);
        if (!data?.company) throw new Error('strežnik ni vrnil podatkov');
        const { sestaviDatoteke, zip, imeMape } = await import('/admin/izvoz.js');
        const datoteke = sestaviDatoteke(data, { vprasanjaZa: vprasanjaZaPrikaz, izpolnjevalec });
        const url = URL.createObjectURL(new Blob([zip(datoteke)], { type: 'application/zip' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = `${imeMape(data)}.zip`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (err) {
        console.error('[izvoz]', err);
        alert(`Izvoz ni uspel: ${err.message}`);
      } finally {
        gumb.disabled = false;
        gumb.classList.remove('is-loading');
        gumb.removeAttribute('aria-busy');
      }
    }

    async function odpriMerge() {
      const target = prompt('ID podjetja, v katerega želite združiti TO podjetje:');
      if (!target) return;
      const targetId = parseInt(target, 10);
      if (!Number.isInteger(targetId)) { alert('Neveljaven ID.'); return; }
      if (!confirm(`Združiti podjetje #${id} v #${targetId}? Tega ni mogoče razveljaviti.`)) return;
      const r = await apiFetch(`/api/companies/${id}/merge`, {
        method: 'POST',
        body: JSON.stringify({ target_id: targetId }),
      });
      if (r?.ok) {
        alert(`Združitev uspešna. Premaknjenih odgovorov: ${r.moved_responses}.`);
        window.location.href = `/admin/company.html?id=${targetId}`;
      } else {
        alert('Napaka pri združevanju.');
      }
    }

    async function izbrisiPodjetje() {
      if (!confirm('GDPR izbris izbriše podjetje IN vse odgovore. Ste prepričani?')) return;
      if (!confirm('Zares? Tega ni mogoče razveljaviti.')) return;
      const r = await apiFetch(`/api/companies/${id}`, { method: 'DELETE' });
      if (r?.ok) {
        alert('Izbrisano.');
        window.location.href = '/admin/';
      } else {
        alert('Napaka pri izbrisu.');
      }
    }

    // ── Init ──────────────────────────────────────────────────────────────
    function napakaStrani(besedilo) {
      stran.innerHTML = `
        <div class="callout callout--danger" role="alert">${ikona('alert')}<div>${besedilo} <a href="/admin/podjetja.html">Na seznam podjetij</a></div></div>`;
    }

    (async () => {
      if (!id) { napakaStrani('Manjka parameter <code>?id=</code>.'); return; }
      const data = await apiFetch(`/api/companies/${id}`);
      if (!data?.company) { napakaStrani('Podjetja ni bilo mogoče naložiti.'); return; }
      podjetje     = data.company;
      opombeShranjene = podjetje.interne_opombe || '';
      mozniDvojnik = data.mozni_dvojnik ?? null;
      odgovori     = data.responses ?? [];
      [P, R] = await Promise.all([
        import('/admin/popis.js').catch((err) => { console.error('[popis]', err); return null; }),
        import('/admin/pred.js').catch((err) => { console.error('[pred]', err); return null; }),
      ]);
      // Part from #pred / #po / #drugo, else where the answers are. ?q=ID
      // (link from the answer page) opens the part of that questionnaire.
      aktivnaFaza = privzetaFaza();
      const q = Number(qs('q'));
      const zaQ = q ? vprasalniki(null).find(v => v.qid === q) : null;
      if (zaQ && aktivnaFaza !== null) aktivnaFaza = zaQ.faza;
      aktivniTab = zaQ ? zaQ.qid : (vprasalniki()[0]?.qid ?? null);

      const izvoz = document.getElementById('btn-izvoz');
      izvoz.hidden = false;
      izvoz.addEventListener('click', () => izvoziZaClaude(izvoz));

      renderStran();
      await Promise.all([naloziPredlog(), naloziPredTeme()]);
    })();
  </script>
</body>
