<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acenta — Podjetje</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    /* Prodajni predlog levo zgoraj, priprava na delavnico pod njim, stranski
       stolpec cez obe vrsti. Na ozkem zaslonu: predlog, opombe in ocena,
       sele nato delavnica (opombe sodijo k predlogu). */
    /* Druga vrsta 1fr: visino stranskega stolpca (cez obe vrsti) vzame
       delavnica, ne predlog, sicer pod predlogom ostane prazen pas. */
    .pp-mreza { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(265px, .74fr);
      grid-template-rows: auto 1fr;
      grid-template-areas: "predlog stran" "delavnica stran"; gap: 16px; align-items: start; }
    .pp-predlog { grid-area: predlog; }
    .pp-stran { grid-area: stran; }
    .pp-delavnica { grid-area: delavnica; }
    @media (max-width: 1080px) {
      .pp-mreza { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "predlog" "stran" "delavnica"; }
    }
    @media (max-width: 760px) {
      .pp-predlog .e-switch { display: flex; width: 100%; }
      .pp-predlog .e-switch button { flex: 1; }
    }
    .pp-predlog { scroll-margin-top: 16px; }

    /* Dokument predloga: naslovi berljivi (e-reco jih sicer pise z malimi
       velikimi crkami), siroka tabela se drsi znotraj kartice. */
    .pp-dok h1 { font-size: 19px; letter-spacing: -.02em; text-transform: none; color: #fff; margin-top: 4px; }
    .pp-dok h2 { font-size: 15px; letter-spacing: -.01em; text-transform: none; color: #fff; margin-top: 20px; }
    .pp-dok h3 { font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--lime); margin-top: 18px; }
    .pp-dok table { display: block; max-width: 100%; overflow-x: auto; }
    .pp-opozorila ul { margin: 4px 0 0; padding-left: 18px; list-style: disc; font-weight: 600; }

    /* Priprava na delavnico: ista vsebina na svetli kartici */
    .pp-svetlo .e-switch { background: var(--track); }
    .pp-svetlo .e-switch button { color: var(--muted); }
    .pp-svetlo .e-switch button:hover:not(.active) { color: var(--ink); }
    .pp-svetlo .e-switch button.active { background: var(--accent); color: #fff; }
    .pp-svetlo .e-badge { background: var(--accent-softer); color: var(--accent-ink); }
    .pp-svetlo .e-warnbar { background: var(--peach); color: var(--peach-ink); }
    .pp-svetlo .e-reco { color: var(--ink); font-weight: 500; }
    .pp-svetlo .e-reco h1, .pp-svetlo .e-reco h2, .pp-svetlo .e-reco h3, .pp-svetlo .e-reco h4 { color: var(--accent-ink); }
    .pp-svetlo .e-reco strong, .pp-svetlo .e-reco b { color: var(--ink); }
    .pp-svetlo .e-reco a { color: var(--accent); }
    .pp-svetlo .e-reco th, .pp-svetlo .e-reco td { border-color: var(--hairline); }
    .pp-svetlo .e-reco hr { border-top-color: var(--hairline); }
    .pp-svetlo .e-reco-wrap::after { background: linear-gradient(180deg, transparent, var(--card-bg)); }
    .pp-svetlo .e-reco-prazno .ikona { background: var(--accent-softer); color: var(--accent); }
    .pp-svetlo .e-reco-prazno b { color: var(--ink); }
    .pp-svetlo .e-reco-prazno p { color: var(--muted); }

    @media print {
      .app-sidebar, [data-mobilna-nav], .e-feature-actions, .e-crumb, .e-bottom { display: none !important; }
      .e-reco-wrap { max-height: none !important; }
      .e-reco-wrap::after { display: none !important; }
    }
  </style>
</head>
<body class="min-h-screen">
  <header id="nav"></header>

  <main class="flex-1 min-w-0 flex flex-col">
    <div class="e-wrap" id="stran">
      <div class="e-crumb" id="crumb">Baza vprašalnikov / <a href="/admin/podjetja.html">Podjetja</a></div>
      <div id="header"></div>
      <div id="zgoraj"></div>
      <div id="spodaj"></div>
    </div>
  </main>

  <script src="/admin/app.js"></script>
  <script>
    renderNav('home');

    const id = qs('id');
    if (!id) {
      document.getElementById('header').innerHTML = '<div class="e-note bad">Manjka ?id= parameter.</div>';
      throw new Error('no id');
    }

    // ── Stanje ────────────────────────────────────────────────────────────
    let podjetje = null;
    let odgovori = [];        // [{id, questionnaire_id, q_slug, q_naziv, submitted_at, raw_data, ai_povzetek, vprasanja}]
    let priporocila = [];     // [{questionnaire_id, slug, naziv_prikaz, vsebina, updated_at}]
    let aktivniTab = null;    // questionnaire_id za priporocila IN odgovore (isti izbor)
    let vsiOdgovori = false;  // "Pokaži vse" v seznamu odgovorov
    let mozniDvojnik = null;  // {id, naziv_prikaz} — ujemanje ob oddaji ga ni smelo samodejno združiti

    // Lijak — ista resnica kot STATUSI v src/routes/api.js.
    const LIJAK = ['nov', 'kvalificiran', 'kontaktiran', 'sestanek', 'ponudba', 'dobljen'];
    const STATUS_NAZIV = {
      nov: 'Nov', kvalificiran: 'Kvalificiran', kontaktiran: 'Kontaktiran', sestanek: 'Sestanek',
      ponudba: 'Ponudba', dobljen: 'Dobljen', izgubljen: 'Izgubljen',
    };
    const KVAL_NAZIV = { hot: 'Hot', warm: 'Warm', cold: 'Cold' };
    const MAX_ODGOVOROV = 5;

    // Zacetnice za znak podjetja; pravne oblike niso del imena.
    function zacetnicePodjetja(naziv) {
      const besede = String(naziv || '').replace(/\b(d\.?o\.?o\.?|s\.?p\.?|d\.?d\.?)/gi, '')
        .split(/\s+/).filter(b => /[\p{L}\d]/u.test(b) && !/^(za|in|na|v|pri|s|z|of|the|and)$/i.test(b));
      return besede.slice(0, 2).map(b => b.match(/[\p{L}\d]/u)[0].toUpperCase()).join('') || '?';
    }

    // Vprasalniki podjetja: vsi, za katere ima odgovore ALI priporocila.
    function vprasalniki() {
      const m = new Map();
      for (const o of odgovori) {
        if (!m.has(o.questionnaire_id)) m.set(o.questionnaire_id, { qid: o.questionnaire_id, slug: o.q_slug, naziv: o.q_naziv, st: 0 });
        m.get(o.questionnaire_id).st++;
      }
      for (const p of priporocila) {
        if (!m.has(p.questionnaire_id)) m.set(p.questionnaire_id, { qid: p.questionnaire_id, slug: p.slug, naziv: p.naziv_prikaz, st: 0 });
      }
      return [...m.values()].sort((a, b) => b.st - a.st || a.naziv.localeCompare(b.naziv));
    }

    // ── Glava ─────────────────────────────────────────────────────────────
    function renderHeader() {
      const vpr = vprasalniki();
      const zadnji = podjetje.last_response_at ? formatDan(podjetje.last_response_at) : '—';
      document.title = `Acenta — ${podjetje.naziv_prikaz}`;
      document.getElementById('crumb').innerHTML =
        `Baza vprašalnikov / <a href="/admin/podjetja.html">Podjetja</a> / <strong>${esc(podjetje.naziv_prikaz)}</strong>`;
      document.getElementById('header').innerHTML = `
        <div class="e-title">
          <div class="e-profile">
            <div class="e-logo">${esc(zacetnicePodjetja(podjetje.naziv_prikaz))}</div>
            <div style="min-width:0">
              <div class="e-eyebrow"><i></i>Podjetje · ${sklon(odgovori.length, ['odgovor', 'odgovora', 'odgovori', 'odgovorov'])} · zadnji ${zadnji}</div>
              <h1>${esc(podjetje.naziv_prikaz)}.</h1>
              <div class="e-links">
                ${vpr.map(v => `<a href="#" data-tab="${v.qid}">${esc(v.naziv)} <small>${v.st}</small></a>`).join('')}
                <span title="Normaliziran naziv, po katerem se združujejo odgovori">Normalizirano: ${esc(podjetje.naziv_normaliziran)}</span>
              </div>
            </div>
          </div>
          <div class="e-actions">
            <button type="button" class="e-btn" id="btn-predlog"
              onclick="document.getElementById('prodajni-predlog').scrollIntoView({ behavior: 'smooth', block: 'start' })">Prodajni predlog</button>
            <button type="button" class="e-btn-soft" id="btn-izvoz" onclick="izvoziZaClaude(this)"
              title="Vsi odgovori, zapisi sestankov in transkripti tega podjetja v enem ZIP-u, z navodili za prodajni predlog AI procesov">Izvoz za Claude (ZIP)</button>
            <a class="e-btn-soft" href="/admin/podjetja.html">← Vsa podjetja</a>
          </div>
        </div>
        ${mozniDvojnik ? `
          <div class="e-note warn" id="mozni-dvojnik" style="margin-bottom:16px">
            Verjetno isto podjetje kot
            <a href="/admin/company.html?id=${mozniDvojnik.id}"><strong>${esc(mozniDvojnik.naziv_prikaz)}</strong> (#${mozniDvojnik.id})</a>.
            ${esc(podjetje.mozni_dvojnik_razlog || '')}
            <div class="e-actions" style="margin-top:10px">
              <button type="button" class="e-btn" onclick="zdruziZDvojnikom()">Združi v #${mozniDvojnik.id}</button>
              <button type="button" class="e-btn-soft" onclick="niDvojnik()">Ni isto podjetje</button>
            </div>
          </div>` : ''}`;
    }

    // Opozorilo o moznem dvojniku: zdruzi TO podjetje v starejse ali zavrni.
    async function zdruziZDvojnikom() {
      if (!mozniDvojnik) return;
      if (!confirm(`Združiti „${podjetje.naziv_prikaz}“ v „${mozniDvojnik.naziv_prikaz}“? Odgovori se prenesejo, tega ni mogoče razveljaviti.`)) return;
      const r = await apiFetch(`/api/companies/${id}/merge`, {
        method: 'POST',
        body: JSON.stringify({ target_id: mozniDvojnik.id }),
      });
      if (r?.ok) {
        window.location.href = `/admin/company.html?id=${mozniDvojnik.id}`;
      } else {
        alert('Napaka pri združevanju.');
      }
    }

    async function niDvojnik() {
      if (!await patchPodjetje({ mozni_dvojnik_id: null })) return;
      mozniDvojnik = null;
      renderHeader();
    }

    // ── Zgoraj: prodajni predlog (akcentna kartica), stranski stolpec
    //    (opombe, ocena, status) in priprava na delavnico pod predlogom ──
    function renderZgoraj() {
      document.getElementById('zgoraj').innerHTML = `
        <div class="pp-mreza">
          <section class="e-feature pp-predlog" id="prodajni-predlog"></section>
          <div class="e-side pp-stran" style="grid-template-rows:auto">
            ${opombeKartica()}
            ${kvalKartica()}
            ${statusKartica()}
          </div>
          <section class="e-panel pp-delavnica pp-svetlo" id="delavnica"></section>
        </div>`;

      const polje = document.getElementById('opombe');
      polje.addEventListener('input', () => {
        podjetje.interne_opombe = polje.value;
        nacrtujShranjevanjeOpomb();
      });
      polje.addEventListener('blur', shraniOpombe);

      renderPredlog();
      renderDelavnica();
    }

    // Dolga besedila se zlozijo; gumb se pokaze samo, ce je res odrezano.
    function zlozljivo(wrap, gumb, ob) {
      if (!wrap || !gumb) return;
      if (wrap.scrollHeight <= wrap.clientHeight + 4 && !wrap.classList.contains('open')) { wrap.classList.add('kratko'); return; }
      gumb.hidden = false;
      gumb.textContent = wrap.classList.contains('open') ? 'Skrij' : 'Pokaži vse';
      gumb.addEventListener('click', () => {
        const odpri = !wrap.classList.contains('open');
        wrap.classList.toggle('open', odpri);
        gumb.textContent = odpri ? 'Skrij' : 'Pokaži vse';
        ob?.(odpri);
      });
    }

    // ── Prodajni predlog ──────────────────────────────────────────────────
    // Opus iz celega paketa (isti kot ZIP za Claude) pripravi seznam procesov
    // za direktorja in prodajni list za Matjaza. Priprava traja nekaj minut in
    // tece na strezniku; stran jo spremlja z osvezevanjem na 5 s.
    let predlogStanje = { predlog: null, tek: null, gradivo: { odgovori: 0, seje: 0 }, nalozeno: false };
    let predlogDok = 'direktor';      // 'direktor' | 'matjaz'
    let predlogOdprt = false;
    let predlogCasovnik = null;

    const NAPAKE_PREDLOGA = {
      ni_gradiva: 'Podjetje nima ne odgovorov ne zapisov sestankov.',
      prevelik_paket: 'Gradivo je preobsežno za samodejno pripravo. Uporabite Izvoz za Claude (ZIP).',
      not_found: 'Podjetje ne obstaja več.',
    };

    function ura(iso) {
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? '' : `${d.getHours()}.${String(d.getMinutes()).padStart(2, '0')}`;
    }
    const izOdgovorov = (n) => `${n} ${n === 1 ? 'odgovora' : 'odgovorov'}`;
    const izSej = (n) => `${n} ${n === 1 ? 'zapisa sestanka' : 'zapisov sestankov'}`;

    function renderPredlog() {
      const el = document.getElementById('prodajni-predlog');
      if (!el) return;
      const { predlog: p, tek, gradivo, nalozeno } = predlogStanje;
      const tece = tek?.status === 'pripravlja';
      const padlo = tek?.status === 'napaka' ? tek : null;
      const imaGradivo = gradivo.odgovori + gradivo.seje > 0;

      const stikalo = p ? `
        <div class="e-switch" role="tablist" aria-label="Dokument">
          <button type="button" role="tab" data-dok="direktor" class="${predlogDok === 'direktor' ? 'active' : ''}">Za direktorja</button>
          <button type="button" role="tab" data-dok="matjaz" class="${predlogDok === 'matjaz' ? 'active' : ''}">Za Matjaža</button>
        </div>` : '';
      const pod = p
        ? `<b>Pripravljeno ${formatDan(p.koncano_at || p.created_at)}</b> iz ${izOdgovorov(p.vhod?.odgovori ?? 0)} in ${izSej(p.vhod?.seje ?? 0)}`
        : (nalozeno ? 'Še ni pripravljen' : 'Nalagam …');

      let telo = '';
      if (tece) {
        telo += `<div class="e-warnbar" id="pp-tece">Pripravljam ${p ? 'novo različico' : 'prodajni predlog'} (začeto ob ${ura(tek.created_at)}).
          AI bere ${sklon(tek.vhod?.odgovori ?? 0, ['odgovor', 'odgovora', 'odgovore', 'odgovorov'])} in ${sklon(tek.vhod?.seje ?? 0, ['zapis sestanka', 'zapisa sestankov', 'zapise sestankov', 'zapisov sestankov'])}; traja nekaj minut. Stran se osveži sama.</div>`;
      }
      if (padlo) telo += `<div class="e-warnbar" id="pp-napaka">⚠ Zadnja priprava ni uspela: ${esc(padlo.napaka || 'neznana napaka')}</div>`;

      if (p) {
        if (predlogDok === 'direktor' && p.opozorila?.length) {
          telo += `<div class="e-warnbar pp-opozorila" id="pp-opozorila"><div><b>Preverite pred pošiljanjem:</b>
            <ul>${p.opozorila.map(o => `<li>${esc(o)}</li>`).join('')}</ul></div></div>`;
        }
        const besedilo = predlogDok === 'direktor' ? p.za_direktorja : p.za_matjaza;
        telo += `<div class="e-reco-wrap ${predlogOdprt ? 'open' : ''}" id="pp-wrap"><div class="e-reco pp-dok">${md(besedilo)}</div></div>`;
      } else if (tece) {
        telo += `<div class="e-reco-prazno">
          <b>Prodajni predlog se pripravlja</b>
          <p>Ko bo pripravljen, se tu pokažeta seznam procesov za direktorja in prodajni list za Matjaža.</p>
        </div>`;
      } else if (nalozeno) {
        telo += `<div class="e-reco-prazno">
          <span class="ikona"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8H20l-4.9 3.6 1.9 5.8-5-3.6-5 3.6 1.9-5.8L4 8.8h6.1z"/></svg></span>
          <b>Prodajni predlog še ni pripravljen</b>
          <p>AI prebere vse odgovore tega podjetja (${gradivo.odgovori}), zapise sestankov (${gradivo.seje}), interne opombe in katalog rešitev ter pripravi seznam procesov za direktorja in prodajni list za Matjaža. Traja nekaj minut.</p>
          ${imaGradivo
            ? '<button type="button" class="e-btn-white" id="pp-pripravi" style="margin-top:8px">Pripravi prodajni predlog</button>'
            : '<p>Za predlog potrebujemo vsaj en odgovor ali zapis sestanka.</p>'}
        </div>`;
      }

      const akcije = p ? `
        <div class="e-feature-actions">
          <button type="button" class="e-btn-white" id="pp-pripravi" ${tece ? 'disabled' : ''}>Pripravi znova</button>
          <a class="e-btn-ghost" id="pp-pdf" href="/api/companies/${id}/prodajni-predlog/pdf" download>Natisni / PDF za direktorja</a>
          <button type="button" class="e-btn-ghost" id="pp-kopiraj">Kopiraj</button>
          <div class="spacer"></div>
          <button type="button" class="e-btn-ghost" id="pp-vec" hidden>Pokaži vse</button>
        </div>` : '';

      el.innerHTML = `
        <div class="e-feature-top">
          <div>
            <span class="lbl">Prodajni predlog</span>
            <div class="e-feature-sub">${pod}</div>
          </div>
          ${stikalo}
        </div>
        ${telo}
        ${akcije}`;

      zlozljivo(document.getElementById('pp-wrap'), document.getElementById('pp-vec'), (odpri) => { predlogOdprt = odpri; });
      document.getElementById('pp-pripravi')?.addEventListener('click', (e) => pripraviPredlog(e.currentTarget));
      document.getElementById('pp-kopiraj')?.addEventListener('click', (e) => kopirajPredlog(e.currentTarget));
    }

    // Zavihka Za direktorja / Za Matjaza (svoj atribut, ne data-tab, ki
    // pripada izbiri vprasalnika).
    document.getElementById('stran').addEventListener('click', (e) => {
      const b = e.target.closest('[data-dok]');
      if (!b || b.dataset.dok === predlogDok) return;
      predlogDok = b.dataset.dok;
      predlogOdprt = false;
      renderPredlog();
    });

    async function naloziPredlog() {
      const r = await apiFetch(`/api/companies/${id}/prodajni-predlog`);
      if (!r) return false;
      predlogStanje = { ...r, nalozeno: true };
      renderPredlog();
      spremljajPredlog();
      return true;
    }

    function spremljajPredlog() {
      clearTimeout(predlogCasovnik);
      if (predlogStanje.tek?.status === 'pripravlja') predlogCasovnik = setTimeout(naloziPredlog, 5000);
    }

    async function pripraviPredlog(gumb) {
      if (predlogStanje.predlog && !confirm('Pripraviti nov prodajni predlog? Trenutni ostane viden, dokler novi ni pripravljen.')) return;
      const besedilo = gumb.textContent;
      gumb.disabled = true;
      gumb.textContent = 'Zbiram gradivo …';
      try {
        // Isti paket kot ZIP: vprasanja custom_html obrazcev zna izlusciti
        // samo brskalnik (DOMParser).
        const data = await apiFetch(`/api/companies/${id}/izvoz`);
        if (!data?.company) throw new Error('strežnik ni vrnil podatkov');
        const { sestaviDatoteke } = await import('/admin/izvoz.js');
        const datoteke = sestaviDatoteke(data, { vprasanjaZa: vprasanjaZaPrikaz, izpolnjevalec });
        const res = await fetch(`/api/companies/${id}/prodajni-predlog`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ datoteke }),
        });
        const r = await res.json().catch(() => ({}));
        if (res.status === 409) { await naloziPredlog(); return; }
        if (!res.ok) throw new Error(NAPAKE_PREDLOGA[r.error] || r.error || `HTTP ${res.status}`);
        predlogStanje.tek = r.tek;
        renderPredlog();
        spremljajPredlog();
      } catch (err) {
        console.error('[prodajni-predlog]', err);
        alert(`Priprava ni uspela: ${err.message}`);
        gumb.disabled = false;
        gumb.textContent = besedilo;
      }
    }

    async function kopirajPredlog(gumb) {
      const p = predlogStanje.predlog;
      if (!p) return;
      try {
        await navigator.clipboard.writeText(predlogDok === 'direktor' ? p.za_direktorja : p.za_matjaza);
        gumb.textContent = 'Kopirano';
      } catch {
        gumb.textContent = 'Kopiranje ni uspelo';
      }
      setTimeout(() => { gumb.textContent = 'Kopiraj'; }, 1600);
    }

    // ── Priprava na delavnico (prej "AI priporocila") ─────────────────────
    // Priporocila po posameznem vprasalniku. Za prodajo so presplosna, za
    // pripravo delavnice pa se vedno uporabna, zato ostanejo pod predlogom.
    function renderDelavnica() {
      const vpr = vprasalniki();
      const el = document.getElementById('delavnica');
      if (!vpr.length) {
        el.innerHTML = '<h2>Priprava na delavnico</h2><div class="e-empty">Podjetje še nima odgovorov ali priporočil.</div>';
        return;
      }
      if (aktivniTab === null || !vpr.some(v => v.qid === aktivniTab)) aktivniTab = vpr[0].qid;
      const tab = vpr.find(v => v.qid === aktivniTab);
      const p = priporocila.find(x => x.questionnaire_id === aktivniTab);
      const odgZaTab = odgovori.filter(o => o.questionnaire_id === aktivniTab);

      // Zastarela = obstaja odgovor, novejsi od zadnje generacije.
      const novejsi = p ? odgZaTab.filter(o => new Date(o.submitted_at) > new Date(p.updated_at)).length : 0;
      const besediloNovejsi = novejsi === 1 ? 'je prišel 1 nov odgovor'
        : novejsi === 2 ? 'sta prišla 2 nova odgovora'
        : novejsi <= 4 ? `so prišli ${novejsi} novi odgovori` : `je prišlo ${novejsi} novih odgovorov`;
      const stikalo = vpr.length > 1
        ? `<div class="e-switch">${vpr.map(v => `<button type="button" data-tab="${v.qid}" class="${v.qid === aktivniTab ? 'active' : ''}">${esc(v.naziv)}</button>`).join('')}</div>`
        : `<span class="e-badge">/f/${esc(tab.slug || '')}</span>`;

      const vsebina = p
        ? `${novejsi ? `<div class="e-warnbar">⚠ Zastarela: po generaciji ${besediloNovejsi}. Regenerirajte, da bodo upoštevani.</div>` : ''}
           <div class="e-reco-wrap" id="reco"><div class="e-reco">${md(p.vsebina)}</div></div>`
        : `<div class="e-reco-prazno">
             <span class="ikona"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8H20l-4.9 3.6 1.9 5.8-5-3.6-5 3.6 1.9-5.8L4 8.8h6.1z"/></svg></span>
             <b>Priporočila še niso pripravljena</b>
             <p>AI prebere ${odgZaTab.length === 1 ? 'odgovor' : `vseh ${odgZaTab.length} odgovorov`} na ta vprašalnik in pripravi povzetek skupine, predloge in naslednje korake. Generiranje traja okoli 70 sekund.</p>
           </div>`;

      const akcije = `
        <div class="e-feature-actions">
          <button type="button" class="e-btn-soft" onclick="regeneriraj(${aktivniTab}, 'priporocila')">${p ? 'Regeneriraj priporočila' : 'Generiraj priporočila'}</button>
          ${odgZaTab.length ? `<button type="button" class="e-btn-soft" onclick="regeneriraj(${aktivniTab}, 'vse')">Regeneriraj vse</button>` : ''}
          ${p ? `<a class="e-btn-soft" href="/api/companies/${id}/pdf?questionnaire_id=${aktivniTab}" download>Izvozi PDF</a>
                 <button type="button" class="e-btn-soft" onclick="window.print()">Natisni</button>` : ''}
          <div class="spacer"></div>
          ${p ? '<button type="button" class="e-btn-soft" id="reco-vec" hidden>Pokaži vse</button>' : ''}
        </div>`;

      const izKoliko = `iz ${odgZaTab.length} ${odgZaTab.length === 1 ? 'odgovora' : 'odgovorov'}`;
      el.innerHTML = `
        <div class="e-feature-top">
          <div>
            <h2>Priprava na delavnico</h2>
            <p class="desc">AI priporočila · ${esc(tab.naziv)} · ${p ? `generirano ${formatDan(p.updated_at)} ${izKoliko}` : 'še ni generirano'}</p>
          </div>
          ${stikalo}
        </div>
        ${vsebina}
        ${akcije}`;

      zlozljivo(document.getElementById('reco'), document.getElementById('reco-vec'));
    }

    // ── Interne opombe ────────────────────────────────────────────────────
    // Kar vemo mi (npr. "racun za Claude ze imajo"). Gre v prodajni predlog
    // in ZIP kot dejstvo; stranka ga ne vidi. Shrani se samo: ob premoru v
    // tipkanju in ob odhodu iz polja. Besedilo zivi v `podjetje`, zato ga
    // ponovni izris zgornjega dela (status, zavihek) ne izgubi.
    let opombeCasovnik = null;
    let opombeShranjene = '';     // nazadnje shranjeno besedilo (nastavi ga zagon)

    function stanjeOpomb() {
      if (!podjetje.interne_opombe_updated_at) return 'Še ni opomb';
      return `Shranjeno ${formatDatum(podjetje.interne_opombe_updated_at)}`;
    }

    function opombeKartica() {
      return `
        <div class="e-sidecard" style="min-height:0">
          <div class="label"><label for="opombe">Interne opombe</label> <span class="e-chip layer">samo za nas</span></div>
          <textarea id="opombe" class="textarea" rows="4" maxlength="5000" style="margin-top:10px"
            placeholder="Kar veva o podjetju: katera orodja že imajo, kdo odloča, kaj smo že rešili …">${esc(podjetje.interne_opombe || '')}</textarea>
          <div class="foot"><span id="opombe-stanje">${stanjeOpomb()}</span></div>
        </div>`;
    }

    function nacrtujShranjevanjeOpomb() {
      clearTimeout(opombeCasovnik);
      const el = document.getElementById('opombe-stanje');
      if (el) el.textContent = 'Neshranjeno …';
      opombeCasovnik = setTimeout(shraniOpombe, 900);
    }

    async function shraniOpombe() {
      clearTimeout(opombeCasovnik);
      const besedilo = podjetje.interne_opombe || '';
      if (besedilo === opombeShranjene) return;
      const r = await apiFetch(`/api/companies/${id}`, {
        method: 'PATCH', body: JSON.stringify({ interne_opombe: besedilo }),
      });
      const el = document.getElementById('opombe-stanje');
      if (!r?.ok) { if (el) el.textContent = 'Shranjevanje ni uspelo, poskusite znova'; return; }
      opombeShranjene = besedilo;
      podjetje.interne_opombe_updated_at = r.company.interne_opombe_updated_at;
      if (el && (podjetje.interne_opombe || '') === besedilo) el.textContent = stanjeOpomb();
    }

    // Opozori, ce uporabnik zapre stran sredi neshranjenih opomb.
    window.addEventListener('beforeunload', (e) => {
      if (podjetje && (podjetje.interne_opombe || '') !== opombeShranjene) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    function kvalKartica() {
      const k = podjetje.kvalifikacija;
      const vir = !k ? 'Še ni ocenjeno' : podjetje.kvalifikacija_rocna ? 'Ročno' : 'AI';
      const gumbi = ['hot', 'warm', 'cold'].map(v =>
        `<button type="button" class="${v}${k === v ? ' on' : ''}" onclick="nastaviKval('${v}')">${KVAL_NAZIV[v]}</button>`
      ).join('') + `<button type="button" class="ai${!podjetje.kvalifikacija_rocna ? ' on' : ''}" onclick="nastaviKval(null)" title="Prepusti oceno AI (ponastavi ročno)">AI</button>`;
      return `
        <div class="e-sidecard">
          <div class="label">Ocena leada <span class="e-chip layer">${vir}</span></div>
          <div class="e-kval ${k || ''}"><span class="dot"></span>${k ? KVAL_NAZIV[k] : 'Neocenjeno'}</div>
          ${podjetje.kvalifikacija_razlog ? `<p class="note">${esc(podjetje.kvalifikacija_razlog)}</p>` : ''}
          <div class="e-seg" style="margin-top:auto;padding-top:14px">${gumbi}</div>
        </div>`;
    }

    function statusKartica() {
      const s = podjetje.status || 'nov';
      const ix = LIJAK.indexOf(s);
      const izgubljen = s === 'izgubljen';
      const crte = LIJAK.map((_, i) => `<i class="${izgubljen ? '' : i < ix ? 'done' : i === ix ? 'cur' : ''}"></i>`).join('');
      const opts = [...LIJAK, 'izgubljen'].map(v =>
        `<option value="${v}" ${v === s ? 'selected' : ''}>${STATUS_NAZIV[v]}</option>`).join('');
      const kdaj = podjetje.status_updated_at ? ` · spremenjeno ${formatDan(podjetje.status_updated_at)}` : '';
      return `
        <div class="e-sidecard">
          <div class="label">Prodajni status</div>
          <div class="big" style="font-size:26px">${STATUS_NAZIV[s] || esc(s)}</div>
          <div class="e-steps${izgubljen ? ' lost' : ''}">${crte}</div>
          <div class="foot">
            <span>${izgubljen ? 'Izgubljen' : `${ix + 1} od ${LIJAK.length} faz`}${kdaj}</span>
            <select class="e-select" aria-label="Prodajni status" onchange="nastaviStatus(this.value, this)">${opts}</select>
          </div>
        </div>`;
    }

    // ── Spodaj: odgovori po izpolnjevalcih + desni stolpec ────────────────
    function renderSpodaj() {
      const vpr = vprasalniki();
      const el = document.getElementById('spodaj');
      if (!vpr.length) { el.innerHTML = ''; return; }
      const odgZaTab = odgovori.filter(o => o.questionnaire_id === aktivniTab);
      const prikazani = vsiOdgovori ? odgZaTab : odgZaTab.slice(0, MAX_ODGOVOROV);

      const vrstice = prikazani.map(r => {
        const oseba = izpolnjevalec(r.raw_data, r.vprasanja);
        const meta = [oseba.podnaslov, formatDatum(r.submitted_at)].filter(Boolean).map(esc).join(' · ');
        const povzetek = r.ai_povzetek
          ? `<div class="sum" data-odg="${r.id}">${md(r.ai_povzetek)}</div>
             <button type="button" class="e-link sum-more" data-za="${r.id}" hidden>Pokaži celoten povzetek</button>`
          : '<div class="none">AI povzetek še ni generiran.</div>';
        return `
          <article class="e-resp" data-response="${r.id}">
            <span class="e-av${oseba.imaIme ? '' : ' anon'}">${esc(oseba.zacetnice)}</span>
            <div style="min-width:0">
              <h3 class="odg-ime">${esc(oseba.ime)}</h3>
              <div class="meta">${meta}</div>
              ${povzetek}
            </div>
            <a class="e-btn e-open btn-odpri" href="/admin/response.html?id=${r.id}">Odpri celoten vprašalnik <span class="e-go">→</span></a>
          </article>`;
      }).join('');

      const zavihki = vpr.map(v =>
        `<button type="button" data-tab="${v.qid}" class="${v.qid === aktivniTab ? 'active' : ''}">${esc(v.naziv)} <b>${v.st}</b></button>`).join('');

      const najvec = Math.max(1, ...vpr.map(v => v.st));
      el.innerHTML = `
        <div class="e-bottom">
          <section class="e-panel" id="odgovori-section">
            <h2>Odgovori</h2>
            <p class="desc">Ena vrstica je en izpolnjevalec. Povzetek je AI, celoten vprašalnik je en klik stran.</p>
            <div class="e-tabs" role="tablist">${zavihki}</div>
            ${vrstice || '<div class="e-empty">Za ta vprašalnik ni odgovorov, samo priporočila.</div>'}
            ${odgZaTab.length > MAX_ODGOVOROV ? `
              <div class="e-panel-foot">
                <span>Prikazanih ${prikazani.length} od ${odgZaTab.length}</span>
                <button type="button" class="e-btn-soft" onclick="vsiOdgovori = !vsiOdgovori; renderSpodaj()">${vsiOdgovori ? 'Pokaži manj' : `Pokaži vse (${odgZaTab.length})`}</button>
              </div>` : ''}
          </section>
          <div>
            <section class="e-panel">
              <h2>Po vprašalnikih</h2>
              <p class="desc">Koliko odgovorov je podjetje oddalo na posamezen vprašalnik.</p>
              <div style="margin-top:12px">
                ${vpr.map(v => `<div class="e-bar-row" title="${esc(v.naziv)}"><span>${esc(v.naziv)}</span><div class="track"><i style="width:${Math.round(v.st / najvec * 100)}%"></i></div><strong>${v.st}</strong></div>`).join('')}
              </div>
            </section>
            <section class="e-panel">
              <h2>Upravljanje</h2>
              <p class="desc">Združitev podvojenih podjetij in GDPR izbris vseh podatkov. Obojega ni mogoče razveljaviti.</p>
              <div class="e-actions" style="margin-top:14px">
                <button type="button" class="e-btn-soft" onclick="odpriMerge()">Združi z drugim podjetjem</button>
                <button type="button" class="e-btn-danger" onclick="izbrisiPodjetje()">GDPR izbris</button>
              </div>
            </section>
          </div>
        </div>`;

      // Dolg povzetek se zapre; gumb se pokaze samo, ce je res odrezan.
      el.querySelectorAll('.e-resp .sum').forEach(s => {
        if (s.scrollHeight <= s.clientHeight + 4) { s.classList.add('odprt', 'kratko'); return; }
        const g = el.querySelector(`.sum-more[data-za="${s.dataset.odg}"]`);
        g.hidden = false;
        g.addEventListener('click', () => {
          const odpri = !s.classList.contains('odprt');
          s.classList.toggle('odprt', odpri);
          g.textContent = odpri ? 'Skrij' : 'Pokaži celoten povzetek';
        });
      });
    }

    function izberiTab(qid) {
      if (qid === aktivniTab) return;
      aktivniTab = qid;
      vsiOdgovori = false;
      renderDelavnica();
      renderSpodaj();
    }

    // En poslusalec za vse izbire vprasalnika (povezave v glavi, stikalo, zavihki).
    document.getElementById('stran').addEventListener('click', (e) => {
      const el = e.target.closest('[data-tab]');
      if (!el) return;
      e.preventDefault();
      izberiTab(Number(el.dataset.tab));
      if (el.closest('.e-links')) document.getElementById('delavnica').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // ── Akcije ────────────────────────────────────────────────────────────
    async function patchPodjetje(telo) {
      const r = await apiFetch(`/api/companies/${id}`, { method: 'PATCH', body: JSON.stringify(telo) });
      if (!r?.ok) { alert('Napaka pri shranjevanju.'); return false; }
      // Opomb ne prepisujemo: odziv bi lahko prinesel starejse besedilo od
      // tistega, ki se se shranjuje (glej shraniOpombe).
      const { interne_opombe, interne_opombe_updated_at, ...ostalo } = r.company;
      Object.assign(podjetje, ostalo);
      return true;
    }

    async function nastaviKval(v) {
      if (v === null && !podjetje.kvalifikacija_rocna) return;
      if (v !== null && v === podjetje.kvalifikacija && podjetje.kvalifikacija_rocna) return;
      if (await patchPodjetje({ kvalifikacija: v })) renderZgoraj();
    }

    async function nastaviStatus(s, el) {
      el.disabled = true;
      const ok = await patchPodjetje({ status: s });
      el.disabled = false;
      if (!ok) { el.value = podjetje.status; return; }
      renderZgoraj();
    }

    async function regeneriraj(qid, mode) {
      const opis = mode === 'vse' ? 'VSE (povzetki + priporočila)' : 'priporočila';
      const cas  = mode === 'vse' ? 'nekaj minut' : '~70 sekund';
      if (!confirm(`Zagnati regeneracijo ${opis}? (${cas})`)) return;

      const res = await fetch(`/api/companies/${id}/regenerate-ai`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ mode, questionnaire_id: qid }),
      });
      if (!res.ok) { alert('Napaka pri sproženju.'); return; }
      alert(`Sproženo. Osveži stran čez ${cas}.`);
    }

    // Paket za Claude: podatke da streznik, vprasanja custom_html obrazcev pa
    // se izluscijo tu (DOMParser, ista koda kot na strani odgovora).
    async function izvoziZaClaude(gumb) {
      const besedilo = gumb.textContent;
      gumb.disabled = true;
      gumb.textContent = 'Pripravljam …';
      try {
        const data = await apiFetch(`/api/companies/${id}/izvoz`);
        if (!data?.company) throw new Error('strežnik ni vrnil podatkov');
        const { sestaviDatoteke, zip, imeMape } = await import('/admin/izvoz.js');
        const datoteke = sestaviDatoteke(data, { vprasanjaZa: vprasanjaZaPrikaz, izpolnjevalec });
        const url = URL.createObjectURL(new Blob([zip(datoteke)], { type: 'application/zip' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = `${imeMape(data)}.zip`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (err) {
        console.error('[izvoz]', err);
        alert(`Izvoz ni uspel: ${err.message}`);
      } finally {
        gumb.disabled = false;
        gumb.textContent = besedilo;
      }
    }

    async function odpriMerge() {
      const target = prompt('ID podjetja v katerega želiš zliti TO podjetje:');
      if (!target) return;
      const targetId = parseInt(target, 10);
      if (!Number.isInteger(targetId)) { alert('Neveljaven ID.'); return; }
      if (!confirm(`Zlij podjetje #${id} → #${targetId}? To se NE da razveljaviti.`)) return;
      const r = await apiFetch(`/api/companies/${id}/merge`, {
        method: 'POST',
        body: JSON.stringify({ target_id: targetId }),
      });
      if (r?.ok) {
        alert(`Zlitje uspešno. Premaknjenih ${r.moved_responses} odgovorov.`);
        window.location.href = `/admin/company.html?id=${targetId}`;
      } else {
        alert('Napaka pri zlitju.');
      }
    }

    async function izbrisiPodjetje() {
      if (!confirm('GDPR izbris IZBRIŠE podjetje IN vse odgovore. Si prepričan/a?')) return;
      if (!confirm('Zares? Operacija ni razveljavljiva.')) return;
      const r = await apiFetch(`/api/companies/${id}`, { method: 'DELETE' });
      if (r?.ok) {
        alert('Izbrisano.');
        window.location.href = '/admin/';
      } else {
        alert('Napaka pri izbrisu.');
      }
    }

    // ── Init ──────────────────────────────────────────────────────────────
    (async () => {
      const data = await apiFetch(`/api/companies/${id}`);
      if (!data) {
        document.getElementById('header').innerHTML = '<div class="e-note bad">Napaka pri nalaganju podjetja.</div>';
        return;
      }
      podjetje    = data.company;
      opombeShranjene = podjetje.interne_opombe || '';
      mozniDvojnik = data.mozni_dvojnik ?? null;
      odgovori    = data.responses ?? [];
      priporocila = data.priporocila ?? [];
      renderHeader();
      renderZgoraj();
      renderSpodaj();
      naloziPredlog();
    })();
  </script>
</body>
</html>
