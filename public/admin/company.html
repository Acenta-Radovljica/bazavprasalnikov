<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acenta — Podjetje</title>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    /* Per-page: tabs */
    .tab-btn {
      padding: 11px 18px; border-radius: 14px 14px 0 0;
      font-size: 14px; font-weight: 600; color: var(--muted);
      cursor: pointer; border: 1px solid transparent; border-bottom: none;
      background: transparent;
      transition: color 0.15s, background 0.15s;
    }
    .tab-btn.active {
      background: var(--card-bg); color: var(--ink);
      border-color: var(--hairline);
      box-shadow: 0 -2px 8px -4px rgba(20, 18, 12, 0.06);
    }
    .tab-btn:hover:not(.active) { color: var(--ink); background: var(--bg-sub); }

    .tab-content {
      background: var(--card-bg);
      border: 1px solid var(--hairline); border-top: none;
      border-radius: 0 14px 14px 14px;
      padding: 32px;
      box-shadow: var(--shadow-2);
    }

    /* Odgovori: ena kartica = en izpolnjevalec */
    .odg-skupina { display:flex; align-items:center; gap:10px; margin:36px 0 12px; }
    .odg-skupina .pill { white-space:nowrap; flex:none; }
    .odg-skupina h2 { font-size:18px; font-weight:700; letter-spacing:-.015em; color:var(--ink); }
    .odg-seznam { display:flex; flex-direction:column; gap:10px; }
    .odg-kartica { background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--r-lg);
      padding:16px 18px; transition:border-color .15s var(--ease), box-shadow .15s var(--ease); }
    .odg-kartica:hover { border-color:var(--hairline-2); box-shadow:var(--shadow-lift); }
    .odg-glava { display:flex; align-items:center; gap:12px; }
    .odg-avatar { width:38px; height:38px; border-radius:999px; flex:none; display:flex; align-items:center; justify-content:center;
      background:var(--acenta-teal-soft); color:var(--acenta-teal); font-weight:700; font-size:13px; border:1px solid var(--acenta-teal-line); }
    .odg-avatar.anon { background:var(--bg-sub); color:var(--muted); border-color:var(--hairline); }
    .odg-kdo { flex:1; min-width:0; }
    .odg-ime { font-size:15px; font-weight:650; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .odg-meta { font-size:12px; color:var(--muted); display:flex; gap:6px; white-space:nowrap; overflow:hidden; }
    .odg-meta .pika { color:var(--muted-2); }
    .btn-odpri { flex:none; display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 14px; border-radius:999px;
      background:var(--acenta-navy); color:#fff; font-weight:600; font-size:12.5px; white-space:nowrap; text-decoration:none;
      box-shadow:0 1px 0 rgba(255,255,255,.12) inset, 0 6px 16px -8px rgba(13,21,32,.7); transition:background .15s var(--ease); }
    .btn-odpri:hover { background:var(--acenta-teal); }
    .btn-odpri svg { transition:transform .15s var(--ease); }
    .btn-odpri:hover svg { transform:translateX(2px); }
    .odg-povzetek { margin-top:14px; padding:14px 16px; background:var(--bg-sub); border-radius:var(--r);
      color:var(--ink-2); max-height:9.5em; overflow:hidden; position:relative; }
    .odg-povzetek:not(.odprt)::after { content:""; position:absolute; left:0; right:0; bottom:0; height:48px;
      background:linear-gradient(180deg, rgba(244,246,248,0), var(--bg-sub)); }
    .odg-povzetek.odprt { max-height:none; }
    .odg-povzetek > :first-child { margin-top:0; }
    .odg-povzetek > :last-child { margin-bottom:0; }
    .odg-povzetek li { margin:.35em 0; }
    .odg-povzetek strong { color:var(--ink); }
    .odg-vec { margin-top:8px; font-size:12px; font-weight:600; color:var(--acenta-teal); background:none; border:0; cursor:pointer; padding:0; }
    .odg-vec:hover { text-decoration:underline; }
    .odg-prazno { margin-top:12px; font-size:13px; color:var(--muted); font-style:italic; }
    @media (max-width:640px) {
      .odg-glava { flex-wrap:wrap; }
      .odg-meta { flex-wrap:wrap; white-space:normal; }
      .btn-odpri { width:100%; justify-content:center; }
    }
  </style>
</head>
<body class="min-h-screen">
  <header id="nav"></header>

  <main class="max-w-6xl mx-auto px-6 py-10 relative">
    <div class="hero-blob"></div>
    <a href="/admin/" class="hero-content text-sm font-medium text-[#006e5a] hover:text-[#00b894]">← Nazaj na seznam</a>

    <div id="header" class="hero-content mt-4 mb-8"></div>

    <!-- Priporocila po vprasalnikih -->
    <div id="priporocila-tabs" class="mb-8"></div>

    <!-- Odgovori (grouped by questionnaire) -->
    <div id="odgovori-section"></div>
  </main>

  <script src="/admin/app.js"></script>
  <script>
    renderNav('home');

    const id = qs('id');
    if (!id) {
      document.getElementById('header').innerHTML = '<div class="bg-red-50 text-red-700 p-4 rounded">Manjka ?id= parameter</div>';
      throw new Error('no id');
    }

    // ── Stanje ────────────────────────────────────────────────────────────
    let podjetje = null;
    let odgovori = [];        // [{id, questionnaire_id, q_slug, q_naziv, submitted_at, ...}]
    let priporocila = [];     // [{questionnaire_id, slug, naziv_prikaz, vsebina, updated_at}]
    let aktivniTab = null;    // questionnaire_id

    // ── Header (osnovni podatki podjetja) ─────────────────────────────────
    function renderHeader() {
      document.getElementById('header').innerHTML = `
        <div class="card p-10">
          <h1 class="display mb-3">${esc(podjetje.naziv_prikaz)}</h1>
          <div class="text-sm text-muted mb-6">
            Normalizirano: <code class="bg-[var(--bg-sub)] px-1.5 py-0.5 rounded text-xs">${esc(podjetje.naziv_normaliziran)}</code>
            · ${odgovori.length} ${odgovori.length === 1 ? 'odgovor' : 'odgovorov'} skupaj
            · Zadnji: ${podjetje.last_response_at ? formatDatum(podjetje.last_response_at) : '—'}
          </div>
          <div class="flex flex-wrap gap-3">
            <button onclick="odpriMerge()" class="btn-secondary">
              Zlij z drugim podjetjem
            </button>
            <button onclick="izbrisiPodjetje()" class="btn-danger">
              GDPR izbris
            </button>
          </div>
        </div>
      `;
    }

    // ── Priporocila — tabs po vprasalniku ─────────────────────────────────
    function renderPriporocila() {
      const el = document.getElementById('priporocila-tabs');

      // Pripravi seznam tabov: vsi vprasalniki, za katere podjetje ima
      // odgovore ALI priporocila. Vir resnice: unique questionnaire_id iz obeh.
      const tabMap = new Map();  // qid -> { qid, slug, naziv, imaPriporocila, imaOdgovore }

      for (const o of odgovori) {
        const k = o.questionnaire_id;
        if (!tabMap.has(k)) tabMap.set(k, { qid: k, slug: o.q_slug, naziv: o.q_naziv, imaPriporocila: false, imaOdgovore: true });
      }
      for (const p of priporocila) {
        const k = p.questionnaire_id;
        if (!tabMap.has(k)) tabMap.set(k, { qid: k, slug: p.slug, naziv: p.naziv_prikaz, imaPriporocila: true, imaOdgovore: false });
        else tabMap.get(k).imaPriporocila = true;
      }

      const tabs = Array.from(tabMap.values()).sort((a, b) => a.naziv.localeCompare(b.naziv));

      if (!tabs.length) {
        el.innerHTML = `
          <div class="bg-yellow-50 border border-yellow-200 rounded p-4 text-sm text-yellow-800">
            Podjetje še nima odgovorov ali priporočil.
          </div>
        `;
        return;
      }

      // Aktivni tab: izberi tistega z zadnjo aktivnostjo, ce ni nastavljen
      if (aktivniTab === null || !tabs.some(t => t.qid === aktivniTab)) {
        aktivniTab = tabs[0].qid;
      }

      // Render tab bar
      const tabBar = tabs.map(t => {
        const stOdg = odgovori.filter(o => o.questionnaire_id === t.qid).length;
        const status = t.imaPriporocila ? '<span class="pill teal">✓</span>' : '<span class="pill warn">brez</span>';
        return `
          <button class="tab-btn ${t.qid === aktivniTab ? 'active' : ''}" onclick="izberiTab(${t.qid})">
            ${esc(t.naziv)}
            <span class="pill muted ml-1">${stOdg}</span>
            ${status}
          </button>
        `;
      }).join('');

      el.innerHTML = `
        <div class="flex items-end gap-1 border-b border-[var(--hairline)]">${tabBar}</div>
        <div id="tab-content" class="tab-content"></div>
      `;

      renderTabContent();
    }

    function izberiTab(qid) {
      aktivniTab = qid;
      renderPriporocila();
    }

    function renderTabContent() {
      const el = document.getElementById('tab-content');
      const qid = aktivniTab;
      const p = priporocila.find(x => x.questionnaire_id === qid);
      const odgovoriZaTab = odgovori.filter(o => o.questionnaire_id === qid);
      const tabInfo = odgovoriZaTab[0] || (p ? { q_naziv: p.naziv_prikaz, q_slug: p.slug } : null);

      // Zastarela = obstaja response novejsi od priporocila updated_at
      const zadnjiResponse = odgovoriZaTab[0]?.submitted_at;
      const zastarela = p && zadnjiResponse && new Date(zadnjiResponse) > new Date(p.updated_at);

      const warning = zastarela
        ? `<div class="bg-[#fbeed4] border border-[#f0d99a] text-[#8a4d00] px-4 py-3 rounded-xl text-sm mb-5">
             ⚠️ Priporočila so <b>zastarela</b> — nov odgovor je prišel po zadnji generaciji. Klikni "Regeneriraj priporočila" za posodobitev.
           </div>`
        : '';

      // Akcijski gumbi (vedno enaki, glede na ali ima priporocila)
      const akcijeHTML = `
        <div class="flex flex-wrap gap-3 mb-6">
          <button onclick="regeneriraj(${qid}, 'priporocila')" class="btn-primary">
            ${p ? 'Regeneriraj priporočila' : 'Generiraj priporočila prvič'}
          </button>
          ${odgovoriZaTab.length ? `
            <button onclick="regeneriraj(${qid}, 'vse')" class="btn-secondary" style="background:var(--acenta-navy); color:#fff; border-color:var(--acenta-navy);">
              Regeneriraj VSE (povzetki + priporočila)
            </button>
          ` : ''}
          ${p ? `
            <a href="/api/companies/${id}/pdf?questionnaire_id=${qid}" class="btn-secondary" style="color:var(--acenta-teal-dark); border-color:var(--acenta-teal); text-decoration:none;" download>
              Izvozi PDF (Acenta branding)
            </a>
            <a href="javascript:window.print()" class="text-sm font-medium text-muted hover:text-[#15151f] self-center">Natisni</a>
          ` : ''}
        </div>
      `;

      const hdrInfo = `
        <div class="flex items-center justify-between mb-1">
          <div>
            <div class="text-xs text-muted uppercase tracking-wider font-medium">Vprašalnik</div>
            <div class="display-serif" style="font-size:24px;">${esc(tabInfo?.q_naziv || '?')}</div>
            <div class="text-xs text-muted">/f/${esc(tabInfo?.q_slug || '')}</div>
          </div>
          <div class="text-xs text-muted text-right">
            ${p ? `Generirano: <b>${formatDatum(p.updated_at)}</b>` : 'Še ni generirano'}
          </div>
        </div>
        <hr class="divider" style="margin: 24px 0;">
      `;

      if (!p) {
        el.innerHTML = `
          ${hdrInfo}
          ${akcijeHTML}
          <div class="bg-[#fdf6e3] border border-[#f0e6c8] rounded-xl p-4 text-sm text-[#8a4d00]">
            AI priporočila še niso generirana za ta vprašalnik. Klikni <b>Generiraj priporočila prvič</b>.
          </div>
        `;
        return;
      }

      const html = marked.parse(p.vsebina);
      el.innerHTML = `
        ${hdrInfo}
        ${warning}
        ${akcijeHTML}
        <div class="prose prose-sm max-w-none">${html}</div>
      `;
    }

    // ── Odgovori (grouped by questionnaire) ───────────────────────────────
    function renderOdgovori() {
      const el = document.getElementById('odgovori-section');
      if (!odgovori.length) {
        el.innerHTML = '<div class="card p-8 text-muted text-center">Še ni odgovorov.</div>';
        return;
      }

      // Grupiraj po questionnaire_id
      const grupe = new Map();
      for (const r of odgovori) {
        if (!grupe.has(r.questionnaire_id)) grupe.set(r.questionnaire_id, { naziv: r.q_naziv, slug: r.q_slug, items: [] });
        grupe.get(r.questionnaire_id).items.push(r);
      }

      const skupineHTML = Array.from(grupe.values())
        .sort((a, b) => a.naziv.localeCompare(b.naziv))
        .map(g => `
          <div class="odg-skupina">
            <h2>${esc(g.naziv)}</h2>
            <span class="pill muted">${sklon(g.items.length, ['odgovor', 'odgovora', 'odgovori', 'odgovorov'])}</span>
          </div>
          <div class="odg-seznam">
            ${g.items.map(r => {
              const oseba = izpolnjevalec(r.raw_data, r.vprasanja);
              const povzetek = r.ai_povzetek
                ? `<div class="odg-povzetek prose prose-sm max-w-none" data-odg="${r.id}">${md(r.ai_povzetek)}</div>
                   <button type="button" class="odg-vec" data-za="${r.id}" hidden>Pokaži celoten povzetek</button>`
                : '<div class="odg-prazno">AI povzetek še ni generiran.</div>';
              return `
                <article class="odg-kartica" data-response="${r.id}">
                  <header class="odg-glava">
                    <div class="odg-avatar${oseba.imaIme ? '' : ' anon'}">${esc(oseba.zacetnice)}</div>
                    <div class="odg-kdo">
                      <div class="odg-ime">${esc(oseba.ime)}</div>
                      <div class="odg-meta">
                        ${oseba.podnaslov ? `<span>${esc(oseba.podnaslov)}</span><span class="pika">·</span>` : ''}
                        <span>${formatDatum(r.submitted_at)}</span>
                      </div>
                    </div>
                    <a class="btn-odpri" href="/admin/response.html?id=${r.id}">
                      Odpri celoten vprašalnik
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
                    </a>
                  </header>
                  ${povzetek}
                </article>
              `;
            }).join('')}
          </div>
        `).join('');

      el.innerHTML = skupineHTML;

      // Dolg povzetek se zapre na ~6 vrstic; gumb se pokaze samo, ce je res odrezan.
      el.querySelectorAll('.odg-povzetek').forEach(p => {
        if (p.scrollHeight <= p.clientHeight + 4) { p.classList.add('odprt'); return; }
        const gumb = el.querySelector(`.odg-vec[data-za="${p.dataset.odg}"]`);
        gumb.hidden = false;
        gumb.addEventListener('click', () => {
          const odpri = !p.classList.contains('odprt');
          p.classList.toggle('odprt', odpri);
          gumb.textContent = odpri ? 'Skrij' : 'Pokaži celoten povzetek';
        });
      });
    }

    // ── Akcije ────────────────────────────────────────────────────────────
    async function regeneriraj(qid, mode) {
      const opis = mode === 'vse' ? 'VSE (povzetki + priporočila)' : 'priporočila';
      const cas  = mode === 'vse' ? 'nekaj minut' : '~70 sekund';
      if (!confirm(`Zagnati regeneracijo ${opis}? (${cas})`)) return;

      const res = await fetch(`/api/companies/${id}/regenerate-ai`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ mode, questionnaire_id: qid }),
      });
      if (!res.ok) { alert('Napaka pri sproženju.'); return; }
      alert(`Sproženo. Osveži stran čez ${cas}.`);
    }

    async function odpriMerge() {
      const target = prompt('ID podjetja v katerega želiš zliti TO podjetje:');
      if (!target) return;
      const targetId = parseInt(target, 10);
      if (!Number.isInteger(targetId)) { alert('Neveljaven ID.'); return; }
      if (!confirm(`Zlij podjetje #${id} → #${targetId}? To se NE da razveljaviti.`)) return;
      const r = await apiFetch(`/api/companies/${id}/merge`, {
        method: 'POST',
        body: JSON.stringify({ target_id: targetId }),
      });
      if (r?.ok) {
        alert(`Zlitje uspešno. Premaknjenih ${r.moved_responses} odgovorov.`);
        window.location.href = `/admin/company.html?id=${targetId}`;
      } else {
        alert('Napaka pri zlitju.');
      }
    }

    async function izbrisiPodjetje() {
      if (!confirm('GDPR izbris IZBRIŠE podjetje IN vse odgovore. Si prepričan/a?')) return;
      if (!confirm('Zares? Operacija ni razveljavljiva.')) return;
      const r = await apiFetch(`/api/companies/${id}`, { method: 'DELETE' });
      if (r?.ok) {
        alert('Izbrisano.');
        window.location.href = '/admin/';
      } else {
        alert('Napaka pri izbrisu.');
      }
    }

    // ── Init ──────────────────────────────────────────────────────────────
    (async () => {
      const data = await apiFetch(`/api/companies/${id}`);
      if (!data) {
        document.getElementById('header').innerHTML = '<div class="bg-red-50 text-red-700 p-4 rounded">Napaka pri nalaganju.</div>';
        return;
      }
      podjetje    = data.company;
      odgovori    = data.responses ?? [];
      priporocila = data.priporocila ?? [];
      renderHeader();
      renderPriporocila();
      renderOdgovori();
    })();
  </script>
</body>
</html>
