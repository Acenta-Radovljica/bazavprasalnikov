<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acenta — Podjetja</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <header id="nav"></header>

  <main class="flex-1 min-w-0 flex flex-col">
    <header class="page-head">
      <h1 class="display">Podjetja</h1>
      <span class="sub" id="meta">—</span>
      <div class="spacer"></div>
      <a class="btn-secondary" href="/admin/kanban.html">Kanban pogled →</a>
    </header>

    <div class="p-4 flex flex-col gap-4">
      <section class="card">
        <div class="orodna">
          <label class="polje" style="min-width:220px;flex:1 1 220px">
            <span>Iskanje</span>
            <input id="filter" type="text" class="input" placeholder="filtriraj po nazivu...">
          </label>
          <label class="polje">
            <span>Status</span>
            <select id="filterStatus" class="select"><option value="">Vsi statusi</option></select>
          </label>
          <label class="polje">
            <span>Kvalifikacija</span>
            <select id="filterKval" class="select">
              <option value="">Vse kvalifikacije</option>
              <option value="hot">HOT</option>
              <option value="warm">WARM</option>
              <option value="cold">COLD</option>
              <option value="neocenjeno">Neocenjeno</option>
            </select>
          </label>
        </div>
      </section>

      <section class="card overflow-hidden">
        <div id="content" class="scroll-x"></div>
      </section>
    </div>
  </main>

  <style>
    /* Orodna vrstica filtrov — enak gradnik kot na Procesih. */
    .orodna { display: flex; align-items: flex-end; gap: 8px; flex-wrap: wrap; padding: 10px 12px; }
    .polje { display: block; min-width: 140px; }
    .polje > span { display: block; font-size: 10px; font-weight: 700; letter-spacing: .06em;
                    text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
    .polje .select, .polje .input { height: 30px; padding: 0 8px; font-size: 12.5px; }
  </style>

  <script src="/admin/app.js"></script>
  <script>
    renderNav('home');

    let vsaPodjetja = [];

    // Lijak — ista resnica kot STATUSI v src/routes/api.js in CHECK v migraciji 005.
    const STATUSI = ['nov', 'kvalificiran', 'kontaktiran', 'sestanek', 'ponudba', 'dobljen', 'izgubljen'];

    // Barvna znacka za kvalifikacijo (HOT rdeca / WARM oranzna / COLD modra).
    // Znacke uporabljajo skupne razrede iz admin.css, da so kvalifikacije
    // videti enako tu, na kanbanu in v podjetju.
    function kvalBadge(k) {
      if (k === 'hot')  return '<span class="tag bad">HOT</span>';
      if (k === 'warm') return '<span class="tag warn">WARM</span>';
      if (k === 'cold') return '<span class="tag info">COLD</span>';
      return '<span class="tag" title="Še ni AI ocene">—</span>';
    }

    // Dropdown za status. stopPropagation prepreci, da klik odpre podjetje.
    function statusSelect(p) {
      const opts = STATUSI.map(s =>
        `<option value="${s}" ${s === p.status ? 'selected' : ''}>${s}</option>`
      ).join('');
      return `<select onclick="event.stopPropagation()"
                onchange="spremeniStatus(${p.id}, this.value, this)"
                class="select" style="height:26px;font-size:11.5px;width:auto">${opts}</select>`;
    }

    // PATCH status na backend. Ob napaki vrne select na staro vrednost.
    async function spremeniStatus(id, status, el) {
      const p = vsaPodjetja.find(x => x.id === id);
      const prej = p ? p.status : null;
      el.disabled = true;
      const res = await apiFetch(`/api/companies/${id}`, {
        method: 'PATCH',
        body: JSON.stringify({ status }),
      });
      el.disabled = false;
      if (!res || !res.ok) {
        alert('Napaka pri shranjevanju statusa.');
        if (prej) el.value = prej;
        return;
      }
      if (p) p.status = status;  // posodobi lokalni cache, da filter ostane skladen
    }

    function renderSeznam(podjetja) {
      const el = document.getElementById('content');
      if (!podjetja.length) {
        el.innerHTML = '<div class="p-8 text-center text-gray-500">Ni podjetij.</div>';
        return;
      }

      const vrstice = podjetja.map(p => {
        // Tri stanja: brez priporocil / posodobljena / zastarela (nov response po generaciji)
        const zastarela = p.has_priporocila
          && p.ai_priporocila_updated_at
          && p.zadnji_odgovor
          && new Date(p.zadnji_odgovor) > new Date(p.ai_priporocila_updated_at);
        let aiBadge;
        if (!p.has_priporocila) {
          aiBadge = '<span class="tag" title="Priporočila še niso generirana">AI —</span>';
        } else if (zastarela) {
          aiBadge = '<span class="tag warn" title="Nov odgovor po zadnji generaciji — priporočila so zastarela">AI zastarela</span>';
        } else {
          aiBadge = '<span class="tag ok" title="Priporočila so posodobljena">AI ✓</span>';
        }
        return `
          <tr class="clickable" onclick="window.location.href='/admin/company.html?id=${p.id}'">
            <td title="${esc(p.naziv_prikaz)}"><b>${esc(p.naziv_prikaz)}</b></td>
            <td>${kvalBadge(p.kvalifikacija)}</td>
            <td>${statusSelect(p)}</td>
            <td class="num">${p.st_odgovorov}</td>
            <td class="nowrap">${formatDatum(p.zadnji_odgovor)}</td>
            <td>${aiBadge}</td>
          </tr>
        `;
      }).join('');

      el.innerHTML = `
        <table class="app-table" style="min-width:820px">
          <colgroup><col style="width:28%"><col style="width:13%"><col style="width:17%"><col style="width:10%"><col style="width:18%"><col style="width:14%"></colgroup>
          <thead>
            <tr>
              <th>Naziv</th><th>Kvalifikacija</th><th>Status</th>
              <th class="num" style="text-align:right">Odgovori</th><th>Zadnji odgovor</th><th>AI status</th>
            </tr>
          </thead>
          <tbody>${vrstice}</tbody>
        </table>
      `;
    }

    // Kombiniran filter: besedilo (naziv) + status + kvalifikacija.
    // Kvalifikacija 'neocenjeno' ujame podjetja brez ocene (NULL).
    function applyFilters() {
      const q = document.getElementById('filter').value.toLowerCase().trim();
      const fStatus = document.getElementById('filterStatus').value;
      const fKval = document.getElementById('filterKval').value;

      const filtrirana = vsaPodjetja.filter(p => {
        if (q && !(p.naziv_prikaz || '').toLowerCase().includes(q)) return false;
        if (fStatus && p.status !== fStatus) return false;
        if (fKval) {
          if (fKval === 'neocenjeno') { if (p.kvalifikacija) return false; }
          else if (p.kvalifikacija !== fKval) return false;
        }
        return true;
      });

      document.getElementById('meta').textContent =
        `${filtrirana.length} / ${vsaPodjetja.length} podjetij`;
      renderSeznam(filtrirana);
    }

    document.getElementById('filter').addEventListener('input', applyFilters);
    document.getElementById('filterStatus').addEventListener('change', applyFilters);
    document.getElementById('filterKval').addEventListener('change', applyFilters);

    (async () => {
      // Napolni status filter z moznostmi lijaka
      const selS = document.getElementById('filterStatus');
      for (const s of STATUSI) {
        const o = document.createElement('option');
        o.value = s; o.textContent = s;
        selS.appendChild(o);
      }

      showLoading('content');
      const data = await apiFetch('/api/companies');
      if (!data) {
        showError('content', 'Napaka pri nalaganju podjetij.');
        return;
      }
      vsaPodjetja = data.companies ?? [];
      document.getElementById('meta').textContent = `${vsaPodjetja.length} podjetij`;
      renderSeznam(vsaPodjetja);
    })();
  </script>
</body>
</html>
