<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Podjetja · Acenta baza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    /* Page-only styles, ported from design-prototype/podjetja.html.
       .toolbar and .table--stack live in admin.css. */

    /* Company table: fixed columns, the name takes the rest */
    .ctable col.c-name { width: auto; }
    .ctable col.c-ocena { width: 120px; }
    .ctable col.c-status { width: 160px; }
    .ctable col.c-odg { width: 96px; }
    .ctable col.c-pp { width: 152px; }
    .ctable col.c-zadnji { width: 128px; }
    .ctable col.c-go { width: 44px; }
    .ctable td.c-name { white-space: normal; }
    .ctable .select-wrap { width: 100%; }
    .ctable td.c-go { color: var(--text-faint); text-align: right; }
    .ctable tr.is-link:hover td.c-go { color: var(--accent); }
    .ni { color: var(--text-muted); }
    #content > .callout { margin: var(--space-4); }
    /* .table__sub (display:block) comes after .only-m in admin.css and wins */
    .ctable .only-m { display: none; }

    /* Phone: rows become cards (admin.css .table--stack); this sets the order:
       name + arrow, status across, then score and proposal. */
    @media (max-width: 760px) {
      .ctable td.c-name { order: 0; flex: 1 1 0; min-width: 0; }
      .ctable td.c-go { order: 1; flex: none; }
      .ctable td.c-status { order: 2; flex: 1 1 100%; }
      .ctable td.c-ocena { order: 3; }
      .ctable td.c-pp { order: 4; }
      .ctable td.c-odg, .ctable td.c-zadnji { display: none; }
      .ctable .only-m { display: block; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar__title">
          <h1>Podjetja</h1>
          <span class="topbar__meta" id="meta">Nalagam …</span>
        </div>
        <span class="spacer"></span>
        <div class="topbar__actions">
          <a class="btn btn--secondary" href="/admin/kanban.html"><svg class="icon" aria-hidden="true"><use href="#i-columns"/></svg>Kanban pogled</a>
        </div>
      </header>

      <div class="page">
        <div class="toolbar" role="search">
          <label class="search">
            <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
            <input id="filter" type="search" placeholder="Filtriraj po nazivu …" aria-label="Filtriraj po nazivu" autocomplete="off">
          </label>
          <div class="toolbar__group">
            <span class="toolbar__lbl" id="ocenaLbl">Ocena</span>
            <div class="seg" role="group" aria-labelledby="ocenaLbl" id="filterKval">
              <button class="seg__item active" type="button" aria-pressed="true" data-kval="">Vse</button>
              <button class="seg__item" type="button" aria-pressed="false" data-kval="hot">Hot</button>
              <button class="seg__item" type="button" aria-pressed="false" data-kval="warm">Warm</button>
              <button class="seg__item" type="button" aria-pressed="false" data-kval="cold">Cold</button>
              <button class="seg__item" type="button" aria-pressed="false" data-kval="neocenjeno">Neocenjeno</button>
            </div>
          </div>
          <span class="spacer"></span>
          <div class="toolbar__group">
            <label class="toolbar__lbl" for="filterStatus">Status</label>
            <span class="select-wrap"><select class="select" id="filterStatus">
              <option value="">Vsi statusi</option>
            </select></span>
          </div>
        </div>

        <section class="panel" aria-label="Seznam podjetij">
          <div class="table-scroll" id="content"></div>
          <footer class="panel__foot">
            <span id="foot-count"></span>
            <span class="spacer"></span>
            <span class="hide-m">Klik na vrstico odpre podjetje · status spremenite kar v tabeli</span>
          </footer>
        </section>
      </div>
    </main>
  </div>

  <script src="/admin/app.js"></script>
  <script>
    renderNav('home');

    let vsaPodjetja = [];
    let fKval = '';

    // Funnel: the same truth as STATUSI in src/routes/api.js and the CHECK in migration 005.
    const STATUSI = ['nov', 'kvalificiran', 'kontaktiran', 'sestanek', 'ponudba', 'dobljen', 'izgubljen'];
    const STATUS_NAZIV = {
      nov: 'Nov', kvalificiran: 'Kvalificiran', kontaktiran: 'Kontaktiran', sestanek: 'Sestanek',
      ponudba: 'Ponudba', dobljen: 'Dobljen', izgubljen: 'Izgubljen',
    };

    function kvalChip(k) {
      if (k === 'hot')  return '<span class="chip chip--hot">Hot</span>';
      if (k === 'warm') return '<span class="chip chip--warm">Warm</span>';
      if (k === 'cold') return '<span class="chip chip--cold">Cold</span>';
      return '<span class="chip" title="Še ni AI ocene">Neocenjeno</span>';
    }

    // Sales proposal: ready / being prepared / none.
    function predlogChip(p) {
      if (p.prodajni_predlog_tece) return '<span class="chip chip--accent"><span class="pulse" aria-hidden="true"></span>Pripravlja se</span>';
      if (p.ima_prodajni_predlog) return `<span class="chip chip--success">${ikona('check')}Pripravljen</span>`;
      return '<span class="ni">ni</span>';
    }

    // Status select inside the row. Clicking it does not open the company.
    function statusSelect(p) {
      const opts = STATUSI.map(s =>
        `<option value="${s}" ${s === p.status ? 'selected' : ''}>${STATUS_NAZIV[s]}</option>`
      ).join('');
      return `<span class="select-wrap"><select class="select select--sm" data-id="${p.id}" aria-label="Status: ${esc(p.naziv_prikaz)}">${opts}</select></span>`;
    }

    // PATCH the status. On error the select returns to the previous value.
    async function spremeniStatus(id, status, el) {
      const p = vsaPodjetja.find(x => x.id === id);
      const prej = p ? p.status : null;
      el.disabled = true;
      const res = await apiFetch(`/api/companies/${id}`, {
        method: 'PATCH',
        body: JSON.stringify({ status }),
      });
      el.disabled = false;
      if (!res || !res.ok) {
        alert('Napaka pri shranjevanju statusa.');
        if (prej) el.value = prej;
        return;
      }
      if (p) p.status = status;  // keep the local cache in step with the filter
    }

    const odgovorov = (n) => sklon(n, ['odgovor', 'odgovora', 'odgovori', 'odgovorov']);

    function renderSeznam(podjetja) {
      const el = document.getElementById('content');
      document.getElementById('foot-count').textContent =
        `Prikazanih ${podjetja.length} od ${vsaPodjetja.length}`;

      if (!vsaPodjetja.length) {
        el.innerHTML = `
          <div class="empty empty--center">
            <b class="empty__title">Še ni podjetij</b>
            <p class="empty__text">Podjetje nastane samo, ko stranka odda vprašalnik.</p>
            <a class="btn btn--secondary" href="/admin/questionnaires.html">Odpri vprašalnike</a>
          </div>`;
        return;
      }
      if (!podjetja.length) {
        el.innerHTML = `
          <div class="empty empty--center">
            <b class="empty__title">Nobeno podjetje ne ustreza filtrom</b>
            <p class="empty__text">Spremenite iskanje ali počistite filtre.</p>
            <button class="btn btn--secondary" type="button" id="pocisti">Počisti filtre</button>
          </div>`;
        return;
      }

      const vrstice = podjetja.map(p => {
        const zadnji = p.zadnji_odgovor ? formatDan(p.zadnji_odgovor) : '';
        const podMob = `${odgovorov(p.st_odgovorov)}${zadnji ? ` · zadnji ${zadnji}` : ''}`;
        return `
          <tr class="is-link" data-href="/admin/company.html?id=${p.id}" tabindex="0">
            <td class="c-name">
              <span class="table__name" title="${esc(p.naziv_prikaz)}">${esc(p.naziv_prikaz)}</span>
              <span class="table__sub" title="${esc(p.vprasalniki || '')}">${esc(p.vprasalniki || 'brez odgovorov')}</span>
              <span class="table__sub only-m">${podMob}</span>
            </td>
            <td class="c-ocena">${kvalChip(p.kvalifikacija)}</td>
            <td class="c-status">${statusSelect(p)}</td>
            <td class="c-odg is-num" data-label="Odgovori:">${p.st_odgovorov}</td>
            <td class="c-pp" data-label="Predlog:">${predlogChip(p)}</td>
            <td class="c-zadnji is-num" data-label="Zadnji:">${zadnji || '<span class="ni">—</span>'}</td>
            <td class="c-go">${ikona('chev-right')}</td>
          </tr>`;
      }).join('');

      el.innerHTML = `
        <table class="table table--fixed table--stack ctable">
          <colgroup><col class="c-name"><col class="c-ocena"><col class="c-status"><col class="c-odg"><col class="c-pp"><col class="c-zadnji"><col class="c-go"></colgroup>
          <thead><tr>
            <th>Podjetje</th><th>Ocena</th><th>Status</th><th class="is-num">Odgovori</th>
            <th>Prodajni predlog</th><th class="is-num">Zadnji odgovor</th><th><span class="sr-only">Odpri</span></th>
          </tr></thead>
          <tbody>${vrstice}</tbody>
        </table>`;
    }

    // Combined filter: text (name) + status + score.
    // Score 'neocenjeno' matches companies without a score (NULL).
    function applyFilters() {
      const q = document.getElementById('filter').value.toLowerCase().trim();
      const fStatus = document.getElementById('filterStatus').value;

      const filtrirana = vsaPodjetja.filter(p => {
        if (q && !(p.naziv_prikaz || '').toLowerCase().includes(q)) return false;
        if (fStatus && p.status !== fStatus) return false;
        if (fKval) {
          if (fKval === 'neocenjeno') { if (p.kvalifikacija) return false; }
          else if (p.kvalifikacija !== fKval) return false;
        }
        return true;
      });
      renderSeznam(filtrirana);
    }

    function oznaciKval(gumb) {
      document.querySelectorAll('#filterKval .seg__item').forEach(x => {
        const on = x === gumb;
        x.classList.toggle('active', on);
        x.setAttribute('aria-pressed', String(on));
      });
    }

    // "Počisti filtre" in the empty state resets all three filters.
    function pocistiFiltre() {
      document.getElementById('filter').value = '';
      document.getElementById('filterStatus').value = '';
      fKval = '';
      oznaciKval(document.querySelector('#filterKval [data-kval=""]'));
      applyFilters();
    }

    document.getElementById('filter').addEventListener('input', applyFilters);
    document.getElementById('filterStatus').addEventListener('change', applyFilters);
    document.getElementById('filterKval').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-kval]');
      if (!b) return;
      fKval = b.dataset.kval;
      oznaciKval(b);
      applyFilters();
    });

    // Row opens the company (click or Enter); the status select does not.
    const vsebina = document.getElementById('content');
    vsebina.addEventListener('click', (e) => {
      if (e.target.closest('#pocisti')) { pocistiFiltre(); return; }
      if (e.target.closest('select')) return;
      const tr = e.target.closest('tr[data-href]');
      if (tr) window.location.href = tr.dataset.href;
    });
    vsebina.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || e.target.closest('select')) return;
      const tr = e.target.closest('tr[data-href]');
      if (tr) window.location.href = tr.dataset.href;
    });
    vsebina.addEventListener('change', (e) => {
      const s = e.target.closest('select[data-id]');
      if (s) spremeniStatus(Number(s.dataset.id), s.value, s);
    });

    (async () => {
      const selS = document.getElementById('filterStatus');
      for (const s of STATUSI) {
        const o = document.createElement('option');
        o.value = s; o.textContent = STATUS_NAZIV[s];
        selS.appendChild(o);
      }

      showLoading('content', 'Nalagam podjetja …');
      const data = await apiFetch('/api/companies');
      if (!data) {
        document.getElementById('meta').textContent = '';
        showError('content', 'Napaka pri nalaganju podjetij. Osvežite stran.');
        return;
      }
      vsaPodjetja = data.companies ?? [];
      const odg = vsaPodjetja.reduce((s, p) => s + (p.st_odgovorov || 0), 0);
      document.getElementById('meta').textContent =
        `${sklon(vsaPodjetja.length, ['podjetje', 'podjetji', 'podjetja', 'podjetij'])} · ${odgovorov(odg)} · razvrščeno po zadnjem odgovoru`;
      applyFilters();
    })();
  </script>
</body>
</html>
