<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acenta — Podjetja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="min-h-screen">
  <header id="nav"></header>

  <main class="flex-1 min-w-0 flex flex-col">
    <div class="e-wrap">
      <div class="e-crumb">Baza vprašalnikov / <strong>Podjetja</strong></div>

      <div class="e-title">
        <div>
          <div class="e-eyebrow"><i></i>Delo</div>
          <h1>Podjetja.</h1>
          <p id="meta">—</p>
        </div>
        <a class="e-btn-soft" href="/admin/kanban.html">Kanban pogled <span class="e-go">→</span></a>
      </div>

      <div class="e-toolbar">
        <label class="e-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="filter" type="text" placeholder="Filtriraj po nazivu …" aria-label="Filtriraj po nazivu">
        </label>
        <span class="e-lbl">Ocena</span>
        <div class="e-periods" id="filterKval" role="group" aria-label="Filter po oceni">
          <button type="button" data-kval="" class="active">Vse</button>
          <button type="button" data-kval="hot">Hot</button>
          <button type="button" data-kval="warm">Warm</button>
          <button type="button" data-kval="cold">Cold</button>
          <button type="button" data-kval="neocenjeno">Neocenjeno</button>
        </div>
        <div class="spacer"></div>
        <span class="e-lbl">Status</span>
        <select id="filterStatus" class="e-select" aria-label="Filter po statusu">
          <option value="">Vsi statusi</option>
        </select>
      </div>

      <section class="e-panel">
        <div id="content" class="e-table-scroll"></div>
        <div class="e-panel-foot">
          <span id="foot-count"></span>
          <span>Klik na vrstico odpre podjetje · status spremenite kar v tabeli</span>
        </div>
      </section>
    </div>
  </main>

  <script src="/admin/app.js"></script>
  <script>
    renderNav('home');

    let vsaPodjetja = [];
    let fKval = '';

    // Lijak — ista resnica kot STATUSI v src/routes/api.js in CHECK v migraciji 005.
    const STATUSI = ['nov', 'kvalificiran', 'kontaktiran', 'sestanek', 'ponudba', 'dobljen', 'izgubljen'];
    const STATUS_NAZIV = {
      nov: 'Nov', kvalificiran: 'Kvalificiran', kontaktiran: 'Kontaktiran', sestanek: 'Sestanek',
      ponudba: 'Ponudba', dobljen: 'Dobljen', izgubljen: 'Izgubljen',
    };

    function kvalChip(k) {
      if (k === 'hot')  return '<span class="e-chip bad">Hot</span>';
      if (k === 'warm') return '<span class="e-chip warn">Warm</span>';
      if (k === 'cold') return '<span class="e-chip cold">Cold</span>';
      return '<span class="e-chip layer" title="Še ni AI ocene">Neocenjeno</span>';
    }

    // Tri stanja priporocil: brez / pripravljeno / zastarelo (nov odgovor po generaciji).
    function aiChip(p) {
      if (!p.has_priporocila) return '<span class="e-chip warn" title="Priporočila še niso generirana">Brez priporočil</span>';
      const zastarela = p.priporocila_updated_at && p.zadnji_odgovor
        && new Date(p.zadnji_odgovor) > new Date(p.priporocila_updated_at);
      return zastarela
        ? '<span class="e-chip warn" title="Nov odgovor po zadnji generaciji">Zastarelo</span>'
        : '<span class="e-chip ok" title="Priporočila so posodobljena">Pripravljeno</span>';
    }

    // Dropdown za status. stopPropagation prepreci, da klik odpre podjetje.
    function statusSelect(p) {
      const opts = STATUSI.map(s =>
        `<option value="${s}" ${s === p.status ? 'selected' : ''}>${STATUS_NAZIV[s]}</option>`
      ).join('');
      return `<select class="e-select" onclick="event.stopPropagation()"
                onchange="spremeniStatus(${p.id}, this.value, this)" aria-label="Status">${opts}</select>`;
    }

    // PATCH status na backend. Ob napaki vrne select na staro vrednost.
    async function spremeniStatus(id, status, el) {
      const p = vsaPodjetja.find(x => x.id === id);
      const prej = p ? p.status : null;
      el.disabled = true;
      const res = await apiFetch(`/api/companies/${id}`, {
        method: 'PATCH',
        body: JSON.stringify({ status }),
      });
      el.disabled = false;
      if (!res || !res.ok) {
        alert('Napaka pri shranjevanju statusa.');
        if (prej) el.value = prej;
        return;
      }
      if (p) p.status = status;  // posodobi lokalni cache, da filter ostane skladen
    }

    function renderSeznam(podjetja) {
      const el = document.getElementById('content');
      document.getElementById('foot-count').textContent =
        `Prikazanih ${podjetja.length} od ${vsaPodjetja.length}`;
      if (!podjetja.length) {
        el.innerHTML = `<div class="e-empty">${vsaPodjetja.length ? 'Nobeno podjetje ne ustreza filtrom.' : 'Ni podjetij.'}</div>`;
        return;
      }

      const vrstice = podjetja.map((p, i) => `
        <tr class="row-link" onclick="window.location.href='/admin/company.html?id=${p.id}'">
          <td class="rk">${i + 1}</td>
          <td class="name">${esc(p.naziv_prikaz)}<span class="sub">${esc(p.vprasalniki || 'brez odgovorov')}</span></td>
          <td>${kvalChip(p.kvalifikacija)}</td>
          <td>${statusSelect(p)}</td>
          <td class="r">${p.st_odgovorov}</td>
          <td>${aiChip(p)}</td>
          <td class="r">${p.zadnji_odgovor ? formatDan(p.zadnji_odgovor) : '—'}</td>
          <td class="r"><span class="e-go">→</span></td>
        </tr>
      `).join('');

      el.innerHTML = `
        <table class="e-table">
          <thead>
            <tr>
              <th>#</th><th>Podjetje</th><th>Ocena</th><th>Status</th>
              <th class="r">Odgovori</th><th>AI</th><th class="r">Zadnji odgovor</th><th></th>
            </tr>
          </thead>
          <tbody>${vrstice}</tbody>
        </table>
      `;
    }

    // Kombiniran filter: besedilo (naziv) + status + ocena.
    // Ocena 'neocenjeno' ujame podjetja brez ocene (NULL).
    function applyFilters() {
      const q = document.getElementById('filter').value.toLowerCase().trim();
      const fStatus = document.getElementById('filterStatus').value;

      const filtrirana = vsaPodjetja.filter(p => {
        if (q && !(p.naziv_prikaz || '').toLowerCase().includes(q)) return false;
        if (fStatus && p.status !== fStatus) return false;
        if (fKval) {
          if (fKval === 'neocenjeno') { if (p.kvalifikacija) return false; }
          else if (p.kvalifikacija !== fKval) return false;
        }
        return true;
      });
      renderSeznam(filtrirana);
    }

    document.getElementById('filter').addEventListener('input', applyFilters);
    document.getElementById('filterStatus').addEventListener('change', applyFilters);
    document.getElementById('filterKval').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-kval]');
      if (!b) return;
      fKval = b.dataset.kval;
      document.querySelectorAll('#filterKval button').forEach(x => x.classList.toggle('active', x === b));
      applyFilters();
    });

    (async () => {
      const selS = document.getElementById('filterStatus');
      for (const s of STATUSI) {
        const o = document.createElement('option');
        o.value = s; o.textContent = STATUS_NAZIV[s];
        selS.appendChild(o);
      }

      showLoading('content');
      const data = await apiFetch('/api/companies');
      if (!data) {
        showError('content', 'Napaka pri nalaganju podjetij.');
        return;
      }
      vsaPodjetja = data.companies ?? [];
      const odg = vsaPodjetja.reduce((s, p) => s + (p.st_odgovorov || 0), 0);
      document.getElementById('meta').textContent =
        `${sklon(vsaPodjetja.length, ['podjetje', 'podjetji', 'podjetja', 'podjetij'])} · ${sklon(odg, ['odgovor', 'odgovora', 'odgovori', 'odgovorov'])} · razvrščeno po zadnjem odgovoru`;
      renderSeznam(vsaPodjetja);
    })();
  </script>
</body>
</html>
